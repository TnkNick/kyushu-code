<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1,shrink-to-fit=no,maximum-scale=1,viewport-fit=cover" />
<meta name="theme-color" content="#000000" />
<meta name="mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
<link rel="manifest" href="fs-manifest.json" />
<link rel="apple-touch-icon" href="icon-192.png" />
<!-- SUSPECT under test: the splash-screen tag (iPhone 14/15 Pro Max). If this drops innerHeight to 873, the startup images are the culprit. -->
<link rel="apple-touch-startup-image" media="screen and (device-width: 430px) and (device-height: 932px) and (-webkit-device-pixel-ratio: 3) and (orientation: portrait)" href="splash/launch-1290x2796.png" />
<title>FS Test</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  /* MAGENTA body = the "uncovered" indicator. Any magenta on screen = a gap. */
  html, body { height: 100%; background: #ff00ff; font-family: ui-monospace, Menlo, monospace; overflow: hidden; }

  /* Candidate A — position:fixed; inset:0 (the layout viewport).  Dark fill, GREEN bottom edge. */
  #cFixed { position: fixed; inset: 0; background: #0c1218; border-bottom: 6px solid #00ff66; }

  /* Candidate B — height:100lvh (large viewport).  CYAN bottom edge, transparent. */
  #cLvh { position: absolute; top: 0; left: 0; right: 0; height: 100lvh; border-bottom: 6px solid #00e5ff; pointer-events: none; }

  /* Candidate C — height:100dvh (dynamic viewport).  GOLD dashed bottom edge. */
  #cDvh { position: absolute; top: 0; left: 0; right: 0; height: 100dvh; border-bottom: 6px dashed #ffcc00; pointer-events: none; }

  #out { position: fixed; top: 130px; left: 50%; transform: translateX(-50%); z-index: 99;
    background: rgba(0,0,0,.9); color: #00ff88; font-size: 14px; line-height: 1.55; white-space: pre;
    padding: 14px 16px; border-radius: 12px; }
  #legend { position: fixed; top: 56px; left: 50%; transform: translateX(-50%); z-index: 99; color: #fff;
    background: rgba(0,0,0,.6); font-size: 11px; padding: 6px 10px; border-radius: 8px; text-align: center; }
</style>
</head>
<body>
  <div id="cFixed"></div>
  <div id="cLvh"></div>
  <div id="cDvh"></div>
  <div id="legend">GREEN=fixed · CYAN=100lvh · GOLD=100dvh<br>magenta = uncovered gap</div>
  <div id="out">measuring…</div>
  <script>
    function px(v){ return Math.round(v); }
    var pT = document.createElement('div'); pT.style.cssText = 'position:fixed;top:0;left:0;width:1px;height:env(safe-area-inset-top,0px);visibility:hidden'; document.body.appendChild(pT);
    var pB = document.createElement('div'); pB.style.cssText = 'position:fixed;bottom:0;left:0;width:1px;height:env(safe-area-inset-bottom,0px);visibility:hidden'; document.body.appendChild(pB);
    function upd(){
      var f = document.getElementById('cFixed').getBoundingClientRect();
      var l = document.getElementById('cLvh').getBoundingClientRect();
      var d = document.getElementById('cDvh').getBoundingClientRect();
      var dm = matchMedia('(display-mode:fullscreen)').matches ? 'fullscreen'
             : matchMedia('(display-mode:standalone)').matches ? 'standalone'
             : matchMedia('(display-mode:minimal-ui)').matches ? 'minimal-ui' : 'browser';
      document.getElementById('out').textContent =
        'screen.height ' + screen.height + '\n' +
        'innerHeight   ' + window.innerHeight + '\n' +
        'outerHeight   ' + window.outerHeight + '\n' +
        '-------------------\n' +
        'GREEN fixed.b ' + px(f.bottom) + '\n' +
        'CYAN  lvh.b   ' + px(l.bottom) + '\n' +
        'GOLD  dvh.b   ' + px(d.bottom) + '\n' +
        '-------------------\n' +
        'safe-top      ' + px(pT.getBoundingClientRect().height) + '\n' +
        'safe-bottom   ' + px(pB.getBoundingClientRect().height) + '\n' +
        'standalone    ' + (navigator.standalone === true) + '\n' +
        'display-mode  ' + dm;
    }
    upd(); setInterval(upd, 400);
    window.addEventListener('resize', upd);
  </script>
</body>
</html>
