          <p className="bk-lede">{x({
            en: 'Log spending in yen or baht, tag who shares it, and see each person\'s split - in both currencies.',
            th: 'บันทึกค่าใช้จ่ายเป็นเยนหรือบาท เลือกคนที่หารด้วย แล้วดูส่วนแบ่งของแต่ละคนได้ทั้งสองสกุลเงิน',
            ja: '円かバーツで記録し、割り勘する人を選ぶと各自の負担がわかります。',
          })}</p>
        </section>
        <div className="bk-section wallet">
          <Converter />

          {names.length ? (
            <section className="party wal-sum">
              <div className="party-head"><span className="ov-kicker">{x({ en: 'Who owes what', th: 'ใครจ่ายเท่าไหร่', ja: '各自の負担' })}</span><h2 className="ov-h2">{x({ en: 'Per person', th: 'สรุปรายคน', ja: '一人ずつ' })}</h2></div>
              <div className="wal-people">
                {names.map((n, i) => (
                  <div className="wal-person" key={i}>
                    <span className="wal-person-name">{n}</span>
                    <span className="wal-person-thb">{fmtB(perPersonYen[i] * THB_PER_YEN)}</span>
                    <span className="wal-person-yen">{fmtY(perPersonYen[i])}</span>
                  </div>
                ))}
              </div>
              <div className="wal-total"><span>{x({ en: 'Trip total', th: 'รวมทั้งทริป', ja: '合計' })}</span><b>{fmtB(totalYen * THB_PER_YEN)} - {fmtY(totalYen)}</b></div>
            </section>
          ) : null}

          <section className="party wal-add-wrap">
            <div className="party-head"><span className="ov-kicker">{x({ en: 'Add', th: 'เพิ่ม', ja: '追加' })}</span><h2 className="ov-h2">{x({ en: 'New expense', th: 'รายการใหม่', ja: '新規' })}</h2></div>
            <div className="wal-cur-toggle">
              <button className={'wal-cur' + (cur === 'jpy' ? ' on' : '')} onClick={() => setCur('jpy')}>¥ {x({ en: 'Yen', th: 'เยน', ja: '円' })}</button>
              <button className={'wal-cur' + (cur === 'thb' ? ' on' : '')} onClick={() => setCur('thb')}>฿ {x({ en: 'Baht', th: 'บาท', ja: 'バーツ' })}</button>
            </div>
            <div className="wal-add">
              <input className="exp-in wal-amt" type="number" inputMode="numeric" placeholder={cur === 'jpy' ? '¥0' : '฿0'} value={amt} onChange={(e) => setAmt(e.target.value)} aria-label="Amount" />
              <input className="exp-in wal-label" type="text" placeholder={x({ en: 'What for?', th: 'ค่าอะไร?', ja: '何に?' })} value={label} onChange={(e) => setLabel(e.target.value)} onKeyDown={(e) => { if (e.key === 'Enter') add(); }} aria-label="Label" />
            </div>
            <div className="wal-payers">
              <span className="wal-payers-lb">{x({ en: 'Split between', th: 'หารกับใคร', ja: '割り勘する人' })}</span>
              <div className="wal-payer-chips">
                {names.map((n, i) => (
                  <button key={i} className={'wal-payer' + (payers.includes(i) ? ' on' : '')} onClick={() => togglePayer(i)} aria-pressed={payers.includes(i)}>{n}</button>
                ))}
              </div>
            </div>
            <button className="wal-add-btn" onClick={add}><Icon name="plus" size={16} stroke={2.2} /><span>{x({ en: 'Add expense', th: 'เพิ่มรายการ', ja: '追加' })}</span></button>
          </section>

          {items.length ? (
            <section className="party wal-list-wrap">
              <div className="party-head"><span className="ov-kicker">{x({ en: 'Log', th: 'รายการ', ja: '記録' })}</span><h2 className="ov-h2">{x({ en: 'All expenses', th: 'ทั้งหมด', ja: '一覧' })}</h2></div>
              <ul className="wal-list">
                {items.map((it) => (
                  <li className="wal-item" key={it.id}>
                    <div className="wal-item-top">
                      <span className="wal-item-label">{it.label}</span>
                      <span className="wal-item-amt">{fmtB(thbOf(it))}<span className="wal-item-yen"> - {fmtY(yenOf(it))}</span></span>
                      <button className="exp-row-x" onClick={() => remove(it.id)} aria-label="Remove"><Icon name="close" size={13} stroke={2} /></button>
                    </div>
                    <div className="wal-item-payers">
                      {it.payers.map((pi) => (
                        <span className="wal-item-payer" key={pi}>{names[pi] || '?'} <b>{fmtB(thbOf(it) / it.payers.length)}</b></span>
                      ))}
                    </div>
                  </li>
                ))}
              </ul>
            </section>
          ) : null}
        </div>
        <div className="ov-credit"><span className="ov-credit-rule" aria-hidden="true"></span><span className="ov-credit-text">{x(window.CREDIT)}</span></div>
      </main>
    </div>
  );
}

</script>
  <script type="text/babel">
// app.jsx - composition root: state, transitions, language, tweaks, embed params.
const FONT_STACKS = {
  trirong: '"Trirong", "Sukhumvit Set", "IBM Plex Sans Thai", Georgia, serif',
  sukhumvit: '"Sukhumvit Set", "IBM Plex Sans Thai", "Hanken Grotesk", system-ui, sans-serif',
  notoserif: '"Noto Serif Thai", "Trirong", Georgia, serif',
};

const TWEAK_DEFAULTS = /*EDITMODE-BEGIN*/{
  "display": "sukhumvit",
  "typeScale": 100,
  "density": "calm",
  "showImages": true,
  "motion": true
}/*EDITMODE-END*/;

const Q = new URLSearchParams(
  (typeof window !== 'undefined' && window.__EMBED) ? window.__EMBED : location.search.slice(1)
);
const PARAM = {
  view: Q.get('view'),
  day: parseInt(Q.get('day') || '0', 10),
  detail: Q.get('detail') != null ? parseInt(Q.get('detail'), 10) : null,
  theme: Q.get('theme'),
  display: Q.get('display'),
  density: Q.get('density'),
  scale: Q.get('scale') ? parseInt(Q.get('scale'), 10) : null,
  lang: Q.get('lang'),
  embed: Q.get('embed') === '1',
  flow: Q.get('flow') === '1',
};

function initialTweaks() {
  const t = { ...TWEAK_DEFAULTS };
  if (PARAM.display) t.display = PARAM.display;
  if (PARAM.density) t.density = PARAM.density;
  if (PARAM.scale) t.typeScale = PARAM.scale;
  return t;
}

function readLang() {
  if (PARAM.lang === 'th' || PARAM.lang === 'en' || PARAM.lang === 'ja') return PARAM.lang;
  try { const s = localStorage.getItem('lookbook-lang'); if (s) return s; } catch (e) {}
  return 'th';
}

function readMode() {
  try { const s = localStorage.getItem('lookbook-mode'); if (s) return s; } catch (e) {}
  return 'dark';
}

// has the user already tapped "Begin the journey" once? (then skip the overview on launch)
function readBegan() {
  try { return localStorage.getItem('lookbook-began') === 'yes'; } catch (e) { return false; }
}

// which day index does today fall on: before the trip -> 0, after -> last, during -> that day
function computeTodayDay() {
  const today = new Date(); today.setHours(0, 0, 0, 0);
  const dates = TRIP.days.map((d) => {
    const s = (d && d.date && d.date.en) || '';
    const m = s.match(/(\d{1,2})\s+([A-Za-z]{3,})\s+(\d{4})/);
    if (!m) return null;
    const dt = new Date(m[2] + ' ' + m[1] + ' ' + m[3]);
    return isNaN(dt.getTime()) ? null : dt;
  });
  let target = 0;
  const first = dates.find(Boolean);
  const last = [...dates].reverse().find(Boolean);
  if (first && today < first) target = 0;
  else if (last && today > last) target = TRIP.days.length - 1;
  else {
    for (let i = dates.length - 1; i >= 0; i--) {
      if (dates[i] && today >= dates[i]) { target = i; break; }
    }
  }
  return target;
}

function App() {
  const [t, setTweak] = useTweaks(initialTweaks());
  const [lang, setLang] = React.useState(readLang());
  const began = PARAM.view !== 'day' && readBegan();
  const [view, setView] = React.useState((PARAM.view === 'day' || began) ? 'itinerary' : 'overview');
  const [day, setDay] = React.useState(PARAM.view === 'day' ? PARAM.day : (began ? computeTodayDay() : 0));
  const [dayKey, setDayKey] = React.useState(0);
  const [detail, setDetail] = React.useState(
    PARAM.detail != null ? TRIP.days[PARAM.day || 0].activities[PARAM.detail] : null
  );
  const [emgOpen, setEmgOpen] = React.useState(false);
  const scrollRef = React.useRef(null);

  const changeLang = (l) => { setLang(l); try { localStorage.setItem('lookbook-lang', l); } catch (e) {} };

  const [mode, setMode] = React.useState(readMode());
  const changeMode = (m) => { setMode(m); try { localStorage.setItem('lookbook-mode', m); } catch (e) {} };
  const [sysDark, setSysDark] = React.useState(() => {
    try { return window.matchMedia('(prefers-color-scheme: dark)').matches; } catch (e) { return true; }
  });
  React.useEffect(() => {
    let mq;
    try { mq = window.matchMedia('(prefers-color-scheme: dark)'); } catch (e) { return; }
    const on = (e) => setSysDark(e.matches);
    mq.addEventListener ? mq.addEventListener('change', on) : mq.addListener(on);
    return () => { mq.removeEventListener ? mq.removeEventListener('change', on) : mq.removeListener(on); };
  }, []);
  const resolvedMode = mode === 'system' ? (sysDark ? 'dark' : 'light') : mode;

  React.useEffect(() => { if (window.__hideSplash) window.__hideSplash(); }, []);

  React.useEffect(() => {
    if (!PARAM.flow) return;
    const post = () => window.parent.postMessage(
      { type: 'lookbook-height', name: window.name, h: document.documentElement.scrollHeight }, '*');
    post();
    const ro = new ResizeObserver(post);
    ro.observe(document.documentElement);
    window.addEventListener('load', post);
    const iv = setInterval(post, 400);
    const stop = setTimeout(() => clearInterval(iv), 5000);
    return () => { ro.disconnect(); clearInterval(iv); clearTimeout(stop); };
  }, [day, view, lang]);

  const rootStyle = {
    '--serif': FONT_STACKS[t.display] || FONT_STACKS.trirong,
    '--scale': (t.typeScale || 100) / 100,
  };

  const begin = () => { setView('itinerary'); };
  // "Begin the journey" - jump to today's day: before the trip -> first day,
  // after it -> last day, during it -> the matching day.
  const beginJourney = () => {
    try { localStorage.setItem('lookbook-began', 'yes'); } catch (e) {}
    setDay(computeTodayDay()); setDayKey((k) => k + 1); setView('itinerary');
  };
  const home = () => { setDetail(null); setView('overview'); };
  const openBookings = () => { setDetail(null); setView('bookings'); };
  const openChecklist = () => { setDetail(null); setView('checklist'); };
  const openWallet = () => { setDetail(null); setView('wallet'); };
  const openMore = () => { setDetail(null); setView('more'); };
  const openGuides = () => { setDetail(null); setView('guides'); };
  const openSettings = () => { setDetail(null); setView('settings'); };
  const openEmergency = () => { setDetail(null); setView('emergency'); };
  const openPhrases = openGuides;
  const ovTop = () => { const s = document.querySelector('.ov-stage'); if (s) s.scrollTo({ top: 0, behavior: 'smooth' }); };
  const jumpTo = (i) => { setDay(i); setDayKey((k) => k + 1); setView('itinerary'); };
  const selectDay = (i) => {
    if (i === day) return;
    setDay(i);
    setDayKey((k) => k + 1);
    if (scrollRef.current) scrollRef.current.scrollTo({ top: 0, behavior: 'auto' });
  };

  const cls = ['lookbook', 'density-' + t.density, 'lang-' + lang];
  if (!t.showImages) cls.push('no-images');
  if (!t.motion) cls.push('no-bgfx');
  if (PARAM.embed) cls.push('embed', 'no-anim');
  if (PARAM.flow) cls.push('flow');

  // Cover & overview borrow Day 1's palette; itinerary uses the active day's.
  const activeTheme = PARAM.theme || (view === 'itinerary' ? TRIP.days[day].theme : TRIP.days[0].theme);

  // Paint the page CANVAS (html/body) with the active theme's --paper so the iOS
  // home-indicator strip - which shows the canvas background, NOT any fixed layer -
  // matches the content instead of leaving a dark dead-zone band.
  React.useEffect(() => {
    const lb = document.querySelector('.lookbook');
    if (!lb) return;
    const paper = getComputedStyle(lb).getPropertyValue('--paper').trim();
    if (!paper) return;
    document.documentElement.style.backgroundColor = paper;
    document.body.style.backgroundColor = paper;
    const meta = document.querySelector('meta[name="theme-color"]');
    if (meta) meta.setAttribute('content', paper);
  }, [activeTheme, resolvedMode]);

  // Page-swap direction: deeper views (the More sub-pages) slide IN from the right;
  // navigating back (shallower) slides in from the left. Depth drives the direction.
  const VIEW_DEPTH = { overview: 0, itinerary: 1, bookings: 1, checklist: 1, wallet: 1, more: 1, guides: 2, settings: 2, emergency: 2 };
  const depthOf = (v) => (Object.prototype.hasOwnProperty.call(VIEW_DEPTH, v) ? VIEW_DEPTH[v] : 1);
  const prevViewRef = React.useRef(view);
  const dCur = depthOf(view), dPrev = depthOf(prevViewRef.current);
  // Slide ONLY the "More" sub-pages (depth 2): entering one slides in from the right, going back
  // from the left. Plain bottom-tab switches (depth 0/1) stay instant - no slide.
  const navDir = (dCur < 2 && dPrev < 2) ? 'none' : (dCur >= dPrev ? 'fwd' : 'back');
  React.useEffect(() => { prevViewRef.current = view; }, [view]);

  return (
    <LangCtx.Provider value={lang}>
      <div className={cls.join(' ')} data-theme={activeTheme} data-mode={resolvedMode} data-lang={lang} style={rootStyle}>
        <div className="bg-fx" aria-hidden="true">
          <span className="orb orb-1"></span>
          <span className="orb orb-2"></span>
          <span className="orb orb-3"></span>
          <span className="bg-grain"></span>
        </div>
        <div className={'view-swap swap-' + navDir} key={view}>
        {view === 'overview' ? (
          <div className="view-overview">
            <Overview trip={TRIP} dest={DESTINATION} travelers={TRAVELERS}
              onBegin={beginJourney} onJump={jumpTo} onHome={ovTop} onBookings={openBookings} onPhrases={openPhrases} onEmergency={openEmergency}
              lang={lang} onLang={changeLang} />
          </div>
        ) : view === 'bookings' ? (
          <div className="view-bookings">
            <Bookings trip={TRIP} onHome={home} lang={lang} />
          </div>
        ) : view === 'checklist' ? (
          <div className="view-checklist">
            <ChecklistPage onHome={home} lang={lang} />
          </div>
        ) : view === 'wallet' ? (
          <div className="view-wallet">
            <WalletPage onHome={home} lang={lang} />
          </div>
        ) : view === 'more' ? (
          <div className="view-more">
            <MorePage onHome={home} onSettings={openSettings} onGuides={openGuides} onEmergency={openEmergency} lang={lang} />
          </div>
        ) : view === 'guides' ? (
          <div className="view-guides">
            <GuidesPage onHome={home} onMore={openMore} lang={lang} />
          </div>
        ) : view === 'settings' ? (
          <div className="view-settings">
            <SettingsPage onHome={home} onMore={openMore} lang={lang} onLang={changeLang} mode={mode} onMode={changeMode} />
          </div>
        ) : view === 'emergency' ? (
          <div className="view-emergency">
            <EmergencyPage onHome={home} onMore={openMore} lang={lang} />
          </div>
        ) : (
          <div className="view-itinerary">
            <DayNav days={TRIP.days} current={day} onSelect={selectDay} onHome={home} onBookings={openBookings} onPhrases={openPhrases} onEmergency={openEmergency} lang={lang} onLang={changeLang} />
            <main className="stage" ref={scrollRef}>
              <div className="stage-inner" key={dayKey + '-' + lang}>
                <Timeline day={TRIP.days[day]} onOpen={setDetail} />
                <Footer trip={TRIP} day={day} lang={lang} onPrev={() => selectDay(Math.max(0, day - 1))} first={day === 0} onNext={() => selectDay(Math.min(TRIP.days.length - 1, day + 1))} last={day === TRIP.days.length - 1} />
              </div>
            </main>
          </div>
        )}
        </div>

        {detail ? <ActivityDetail a={detail} onClose={() => setDetail(null)} /> : null}

        {['itinerary', 'bookings', 'checklist', 'wallet', 'more'].includes(view) ? (
          <MobileTabBar view={view} onItinerary={begin} onBookings={openBookings} onChecklist={openChecklist} onWallet={openWallet} onMore={openMore} />
        ) : null}

        {false ? (
          <TweaksPanel title="Tweaks">
            <TweakSection label="Atmosphere" />
            <TweakToggle label="Ambient motion" value={t.motion} onChange={(v) => setTweak('motion', v)} />
            <TweakSelect
              label="Display font"
              value={t.display}
              options={[{ value: 'sukhumvit', label: 'Sukhumvit - all sans' }, { value: 'trirong', label: 'Trirong - elegant serif' }, { value: 'notoserif', label: 'Noto Serif - classic' }]}
              onChange={(v) => setTweak('display', v)}
            />
            <TweakSection label="Composition" />
            <TweakSlider label="Type scale" value={t.typeScale} min={88} max={116} step={2} unit="%" onChange={(v) => setTweak('typeScale', v)} />
            <TweakRadio label="Rhythm" value={t.density} options={[{ value: 'compact', label: 'Compact' }, { value: 'calm', label: 'Calm' }]} onChange={(v) => setTweak('density', v)} />
            <TweakToggle label="Show imagery" value={t.showImages} onChange={(v) => setTweak('showImages', v)} />
          </TweaksPanel>
        ) : null}
      </div>
    </LangCtx.Provider>
  );
}

function Footer({ trip, day, onPrev, onNext, first, last, lang }) {
  const x = (v) => window.tx(v, lang);
  return (
    <footer className="stage-foot">
      <div className="stage-foot-line" aria-hidden="true"></div>
      <div className="stage-foot-nav">
        {!first ? (
          <button className="stage-prev" onClick={onPrev}>
            <span className="stage-prev-i"><Icon name="chevronLeft" size={18} stroke={1.4} /></span>
            <span className="stage-prev-txt">
              <span className="stage-prev-k">{x({ en: 'Previous', th: 'ก่อนหน้า' })}</span>
              <span className="stage-prev-t">{(lang === 'th' ? trip.days[day - 1].labelTh : trip.days[day - 1].label)}</span>
            </span>
          </button>
        ) : <span className="stage-foot-spacer"></span>}
        {last ? (
          <div className="stage-foot-end">
            <Icon name="compass" size={20} stroke={1.1} />
            <p>{x({ en: 'Journey complete - nine days across Kyushu.', th: 'การเดินทางสิ้นสุดลง รวมเก้าวันทั่วคิวชู' })}</p>
          </div>
        ) : (
          <button className="stage-next" onClick={onNext}>
            <span className="stage-next-txt">
              <span className="stage-next-k">{x({ en: 'Next', th: 'ถัดไป' })}</span>
              <span className="stage-next-t">{(lang === 'th' ? trip.days[day + 1].labelTh : trip.days[day + 1].label)}</span>
            </span>
            <Icon name="arrowRight" size={18} stroke={1.4} />
          </button>
        )}
      </div>
      <div className="stage-credit">{x(window.CREDIT)}</div>
    </footer>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App />);

</script>
<script>
  /* PWA: capture the install prompt (Chrome/Android) for the in-app install tip */
  window.__bip = null;
  window.addEventListener('beforeinstallprompt', function (e) { e.preventDefault(); window.__bip = e; window.dispatchEvent(new Event('bip-ready')); });
  window.addEventListener('appinstalled', function () { window.__bip = null; try { localStorage.setItem('wwn-install-tip', 'off'); } catch (e) {} });
  /* PWA: register the offline service worker + self-cache this page (any filename) */
  if ('serviceWorker' in navigator) {
    window.addEventListener('load', function () {
      navigator.serviceWorker.register('sw.js').catch(function () {});
      if (window.caches) caches.open('wwn-kyushu-v99').then(function (c) {
        c.add(new Request(location.href, { cache: 'reload' })).catch(function () {});
      });
    });
  }
</script>
</body>
</html>
