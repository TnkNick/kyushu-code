          blurb: L('Leave the van in one lot and do the whole stop on foot - the shrine is a 2-minute walk, Monzenmachi runs from the gate, and you finish back at the same lot. Reckon on an hour here, then it is ten minutes west to Uchinomaki to take the Imakin ticket. The address is Ichinomiya-machi Miyaji 1945-3.',
                   'จอดรถไว้ลานเดียวแล้วเดินเที่ยวทั้งจุด ศาลเจ้าเดินแค่ 2 นาที ถนนมนเซนมาจิเริ่มจากหน้าประตู เดินจบแล้ววนกลับมาที่ลานเดิม เผื่อเวลาที่นี่ราวหนึ่งชั่วโมง แล้วขับไปทางตะวันตกสิบนาทีไปรับบัตรคิวที่อุจิโนมากิ ที่อยู่คือ อิจิโนมิยะมาจิ มิยาจิ 1945-3'),
          refs: { map: 'https://maps.google.com/?q=%E7%86%8A%E6%9C%AC%E7%9C%8C%E9%98%BF%E8%98%87%E5%B8%82%E4%B8%80%E3%81%AE%E5%AE%AE%E7%94%BA%E5%AE%AE%E5%9C%B01945-3',
                  booking: L('¥300 first 3 h, then ¥100/h, ¥1,000 cap', '300 เยน 3 ชั่วโมงแรก แล้ว 100 เยนต่อชั่วโมง สูงสุด 1,000 เยน'),
                  notes: L('CHECK YOUR VAN HEIGHT: this lot has a 2.40 m limit. Most 8-seaters are well under it, but a high-roof Hiace can be close - measure at the rental desk. Over 2.40 m you are charged the large-vehicle rate instead: ¥2,000 for 3 h, then ¥1,000/h, ¥5,000 cap. Pick this lot over the shrine own ones - the city page and the national roadside database disagree about whether those are paid or free. It is the only paid parking of the morning.', 'เช็กความสูงรถตู้ก่อน เพราะลานนี้จำกัดความสูงไว้ที่ 2.40 เมตร รถ 8 ที่นั่งส่วนใหญ่ต่ำกว่านี้สบายๆ แต่ไฮเอซหลังคาสูงอาจเฉียด ควรวัดที่ร้านเช่ารถก่อน ถ้าเกิน 2.40 เมตรจะโดนเรตรถใหญ่แทน คือ 2,000 เยนสำหรับ 3 ชั่วโมง แล้วชั่วโมงละ 1,000 เยน สูงสุด 5,000 เยน ควรเลือกลานนี้แทนลานของศาลเจ้า เพราะเว็บเทศบาลกับฐานข้อมูลจุดจอดของกรมทางหลวงบอกไม่ตรงกันว่าลานศาลเจ้าเก็บเงินหรือฟรี และนี่เป็นที่เดียวของช่วงเช้าที่ต้องเสียค่าจอด') } },

        { type: 'feature', time: '09:05', meridiem: 'Morning', kind: 'Shrine', imageId: 'a-d2-asojinja',
          title: L('Aso Shrine & Monzenmachi', 'ศาลเจ้าอาโซและถนนมนเซนมาจิ'),
          place: L('Ichinomiya - the restored romon gate', 'อิจิโนมิยะ กับประตูโรมงที่บูรณะเสร็จแล้ว'),
          blurb: L('Over 2,000 years old, with one of the three great two-storey romon gates in Japan. The gate collapsed in the 2016 earthquake and only reopened in December 2023 after a seven-and-a-half year rebuild that reused about 72% of the original timbers. The street in front, Monzenmachi, has fifteen spring-water fountains and is made for eating your way along it - which is exactly what you want first thing.',
                   'ศาลเจ้าอายุกว่า 2,000 ปี มีประตูโรมงสองชั้นที่ถือเป็นหนึ่งในสามประตูศาลเจ้ายิ่งใหญ่ที่สุดของญี่ปุ่น ประตูพังลงตอนแผ่นดินไหวปี 2016 และเพิ่งเปิดใหม่ธันวาคม 2023 หลังบูรณะ 7 ปีครึ่ง โดยใช้ไม้เดิมกลับมาได้ราว 72% ส่วนถนนหน้าศาลเจ้าชื่อมนเซนมาจิ มีจุดน้ำผุด "มิซุกิ" 15 จุด และเป็นถนนสำหรับเดินกินโดยเฉพาะ ซึ่งเหมาะกับการเริ่มวันมาก'),
          refs: { map: 'https://maps.google.com/?q=Aso+Shrine+Ichinomiya', official: 'https://asojinja.or.jp/',
                  booking: L('Shrine entry free', 'เข้าศาลเจ้าฟรี'),
                  notes: L('This replaces the Nakadake crater, which is shut at Level 3. About 9 km east of Uchinomaki, ten minutes by road. Doing it now, before the Imakin ticket, means the Monzenmachi shops are open - most start around 09:00 and shut about 17:00 - and nobody is watching a queue number.',
                           'จุดนี้มาแทนปล่องนากาดาเกะที่ปิดอยู่ในระดับเตือนภัย 3 อยู่ห่างอุจิโนมากิไปทางตะวันออกราว 9 กิโลเมตร ขับสิบนาที การมาช่วงนี้ก่อนไปรับบัตรคิว ทำให้ร้านบนถนนมนเซนมาจิเปิดพอดี ส่วนใหญ่เริ่มเปิดราว 09:00 และปิดราว 17:00 และไม่ต้องคอยพะวงเลขคิวด้วย') } },

        { type: 'step', time: '10:10', meridiem: 'Morning', kind: 'Parking', icon: 'car',
          title: L('Park at Uchinomaki - take a queue ticket', 'จอดที่ลานอุจิโนมากิแล้วไปรับบัตรคิว'),
          place: L('Uchinomaki Parking Lot - free', 'ลานจอดอุจิโนมากิ จอดฟรี'),
          blurb: L('Put the van in the free Uchinomaki visitor lot on the Kumamoto Bank side, then walk the five minutes to Imakin and take a ticket before anything else. Imakin has two lots of its own but both are tiny - six spaces opposite the shop and about ten marked bays in front of the bank - so neither is any use to a van. Tell the staff on the door how many you are and they hand you a number.',
                   'เอารถตู้เข้าลานจอดนักท่องเที่ยวอุจิโนมากิฝั่งธนาคารคุมาโมโตะ จอดฟรี แล้วเดินห้านาทีไปรับบัตรคิวที่อิมาคินก่อนทำอย่างอื่น อิมาคินมีลานของร้านเองสองจุดแต่เล็กมากทั้งคู่ คือหกช่องตรงข้ามร้าน กับช่องที่ตีเส้นไว้ราวสิบช่องหน้าธนาคาร ใช้กับรถตู้ไม่ได้สักที่ ไปถึงแล้วบอกพนักงานหน้าร้านว่ามากี่คน เขาจะให้เบอร์คิวมา'),
          refs: { map: 'https://maps.google.com/?q=%E5%86%85%E7%89%A7%E9%A7%90%E8%BB%8A%E5%A0%B4+%E9%98%BF%E8%98%87%E5%B8%82',
                  parking: L('Free. Overflow at the Aso Gymnasium if it is full.', 'จอดฟรี ถ้าเต็มให้ไปโรงยิมอาโซ'),
                  notes: L('Tickets go out from around 10:00, earlier on a busy day, and they CAN run out - keep a fallback in mind, there are other akaushi places in Uchinomaki and along Monzenmachi. Ask what time your number is likely to be called before you drive off to the dairy. Coming back around 12:20 on a holiday Sunday the free lot may well be full, which is what the gymnasium is for.',
                           'แจกบัตรคิวตั้งแต่ราว 10:00 วันที่คนเยอะอาจเร็วกว่านั้น และบัตรหมดได้จริง ควรมีแผนสำรองไว้ เพราะในอุจิโนมากิและตลอดถนนมนเซนมาจิยังมีร้านอากาอุชิอื่นอีก ก่อนขับไปร้านนมให้ถามร้านว่าเบอร์เราน่าจะถูกเรียกกี่โมง และตอนกลับมาราว 12:20 ในวันอาทิตย์กลางวันหยุดยาว ลานฟรีมีโอกาสเต็ม นั่นคือเหตุผลที่ต้องรู้จักโรงยิมอาโซไว้') } },

        { type: 'feature', time: '10:35', meridiem: 'Morning', kind: 'Sweets', imageId: 'a-d3-sweets',
          title: L('ASO MILK FACTORY', 'ASO MILK FACTORY'),
          place: L('Abe Farm\'s own shop - 1.1 km from Imakin', 'ร้านของฟาร์มอาเบะ ห่างจากอิมาคิน 1.1 กิโลเมตร'),
          blurb: L('Aso is grazing country, and this is the farm shop of the dairy behind ASO MILK - thick soft serve, gelato, cheese, baked things and proper coffee, with a restaurant attached. The same site is Hana Asobi, so the rose garden is not a separate stop: a glasshouse dome of 1,320 sq m, the largest in western Japan, holding around 750 varieties and 4,500 plants.',
                   'อาโซคือเมืองทุ่งเลี้ยงวัว และที่นี่คือร้านของฟาร์มที่อยู่เบื้องหลังนม ASO MILK มีทั้งซอฟต์ครีมเข้มข้น เจลาโต ชีส ของอบ และกาแฟจริงจัง พร้อมร้านอาหารในตัว ที่เดียวกันนี้คือ はな阿蘇美 สวนกุหลาบจึงไม่ใช่จุดแวะแยก เป็นโดมกระจกขนาด 1,320 ตารางเมตร ใหญ่ที่สุดในญี่ปุ่นฝั่งตะวันตก มีกุหลาบราว 750 สายพันธุ์ 4,500 ต้น'),
          refs: { map: 'https://maps.google.com/?q=ASO+MILK+FACTORY+Aso',
                  parking: L('About 200 shared spaces with room for coaches - the easiest parking of the whole day. No fee is published and nothing suggests there is one.', 'ลานรวมราว 200 ช่อง รับรถบัสได้ จอดง่ายที่สุดของทั้งวัน และไม่มีข้อมูลว่าเก็บเงิน และไม่มีอะไรบ่งชี้ว่าต้องจ่าย'),
                  official: 'https://asomilkfactory.com/about/',
                  notes: L('Open 09:30-18:00 daily, restaurant 11:00-15:00, rose garden 09:30-17:00 with the dome closing to entry at 16:30. This is ASO MILK FACTORY in Uchinomaki, NOT Aso Milk Farm in Nishihara village, which is 20 km away on the far side of the caldera. The two hours here are the Imakin wait, so there is no rush at all.', 'เปิด 09:30 ถึง 18:00 ทุกวัน ร้านอาหาร 11:00 ถึง 15:00 สวนกุหลาบ 09:30 ถึง 17:00 โดมปิดรับเข้า 16:30 ที่นี่คือ ASO MILK FACTORY ในอุจิโนมากิ ไม่ใช่ 阿蘇ミルク牧場 ที่หมู่บ้านนิชิฮาระ ซึ่งอยู่ไกลออกไป 20 กิโลเมตรคนละฝั่งปากปล่อง สองชั่วโมงที่นี่คือเวลารอคิวอิมาคินพอดี จึงไม่ต้องรีบเลย') } },

        { type: 'feature', time: '12:30', meridiem: 'Midday', kind: 'Dining', imageId: 'a-d3-lunch',
          title: L('Imakin Shokudo - Akaushi-don', 'อิมาคินโชคุโด ข้าวหน้าเนื้ออากาอุชิ'),
          place: L('Aso-shi Uchinomaki 290 - the shop that started it', 'อาโซชิ อุจิโนมากิ 290 ร้านต้นตำรับ'),
          blurb: L('The Aso specialty, from the shop that invented it around 2005 - grass-fed akaushi red wagyu, seared and piled over rice with a soft egg. Eat whenever your number is called; the time here is an estimate, not a booking.',
                   'ของขึ้นชื่อของอาโซ จากร้านที่คิดค้นเมนูนี้ขึ้นมาเมื่อราวปี 2005 เป็นเนื้ออากาอุชิวากิวแดงเลี้ยงปล่อย ย่างวางบนข้าวกับไข่ลวก กินตอนที่เขาเรียกคิว เวลาตรงนี้เป็นการประมาณ ไม่ใช่เวลาจอง'),
          refs: { map: 'https://maps.google.com/?q=Imakin+Shokudo+Aso', official: 'http://aso-imakin.com/',
                  booking: L('About 2,000 yen for the akaushi-don', 'ข้าวหน้าอากาอุชิราว 2,000 เยน'),
                  notes: L('No reservations of any kind, only same-day numbers taken at the door, and it is closed Wednesdays. Waits run 1-2 hours on a weekday and 2-3 hours or more on a holiday, and today is the Sunday of a three-day weekend. DECISION POINT: if the number has not been called by 13:30, eat somewhere else - Uchinomaki has to be behind you by 13:40 to reach Beppu at six.', 'ไม่รับจองทุกช่องทาง ใช้บัตรคิวหน้าร้านของวันนั้นอย่างเดียว และปิดวันพุธ วันธรรมดารอ 1 ถึง 2 ชั่วโมง วันหยุดรอ 2 ถึง 3 ชั่วโมงขึ้นไป และวันนี้เป็นวันอาทิตย์ของวันหยุดยาวสามวัน จุดตัดสินใจคือ ถ้าถึง 13:30 แล้วยังไม่ถูกเรียก ให้ไปกินร้านอื่น เพราะต้องออกจากอุจิโนมากิภายใน 13:40 ถึงจะถึงเบปปุหกโมงเย็น') } },

        { type: 'feature', time: '13:40', meridiem: 'Afternoon', kind: 'View', imageId: 'a-d2-milkroad',
          title: L('Milk Road', 'มิลค์โร้ด'),
          place: L('Up from Uchinomaki onto the north rim - 25 min', 'ไต่จากอุจิโนมากิขึ้นสันเขาด้านเหนือ 25 นาที'),
          blurb: L('The scenic ridge road along the Aso outer rim - wide pasture, grazing cattle and the caldera opening up on your right. The drive itself is the first sight of the day, and from up here you see more of the volcano than you would from the floor.',
                   'ถนนสันเขาวิวสวยที่ทอดยาวบนขอบนอกปากปล่องอาโซ สองข้างทางเป็นทุ่งเลี้ยงสัตว์กว้าง วัวเล็มหญ้า และแอ่งปากปล่องค่อยๆ เปิดออกทางขวามือ ตัวเส้นทางเองนี่แหละคือวิวแรกของวัน และจากบนนี้จะเห็นภูเขาไฟได้มากกว่าตอนอยู่ข้างล่าง'),
          refs: { map: 'https://maps.google.com/?q=Milk+Road+Aso', notes: L('Allow about two and a half hours from leaving Uchinomaki to leaving Daikanbo, taking in all three viewpoints. Late November is peak susuki (pampas grass) along the ridge - low sun late in the day lights the plumes up silver. The high ridge can drop near freezing at dawn, so watch for ice early.', 'เผื่อเวลาราวสองชั่วโมงครึ่ง นับจากออกจากอุจิโนมากิถึงตอนออกจากไดคันโบ รวมแวะครบทั้งสามจุดชมวิว ปลายพฤศจิกายนเป็นช่วงหญ้าซูซูกิสวยที่สุดตลอดสันเขา แสงเย็นจะส่องให้ปุยหญ้าเป็นสีเงิน ส่วนตอนเช้ามืดสันเขาสูงใกล้จุดเยือกแข็ง ระวังน้ำแข็ง') } },

        { type: 'feature', time: '14:05', meridiem: 'Afternoon', kind: 'View', imageId: 'a-aso-kabutoiwa',
          title: L('Kabutoiwa Observatory', 'จุดชมวิวคาบุโตอิวะ'),
          place: L('First pull-in once the road tops out', 'จุดจอดแรกหลังถนนไต่ขึ้นถึงสันเขา'),
          blurb: L('The first proper pull-in after the climb, named for the helmet-shaped rock beside it. A free lot, a shelter, and a clean view south across the whole caldera to the five peaks. Twenty minutes is plenty - this is the warm-up for Daikanbo, not a substitute for it.',
                   'จุดจอดจริงจังจุดแรกหลังไต่ขึ้นถึงสันเขา ชื่อมาจากหินรูปหมวกนักรบที่อยู่ข้างๆ มีลานจอดฟรี ศาลาพัก และวิวโล่งไปทางใต้ข้ามปากปล่องทั้งแอ่งไปจนถึงยอดเขาทั้งห้า แวะยี่สิบนาทีก็พอ เพราะเป็นการอุ่นเครื่องก่อนไดคันโบ ไม่ใช่ตัวแทนของไดคันโบ'),
          refs: { map: 'https://maps.google.com/?q=%E3%81%8B%E3%81%B6%E3%81%A8%E5%B2%A9%E5%B1%95%E6%9C%9B%E6%89%80',
                  parking: L('Free roadside lot', 'ลานจอดริมถนน จอดฟรี'),
                  notes: L('Open at all hours, with nothing on site beyond a toilet and a vending machine. The wind up on the rim is far colder than down in the town, so dig the jackets out of the boot here rather than at Daikanbo.',
                           'เปิดตลอดเวลา บนจุดไม่มีอะไรนอกจากห้องน้ำกับตู้กดเครื่องดื่ม ลมบนสันเขาเย็นกว่าในเมืองมาก ควรหยิบเสื้อกันหนาวออกจากท้ายรถตั้งแต่จุดนี้ ไม่ต้องรอไปหยิบที่ไดคันโบ') } },

        { type: 'feature', time: '14:45', meridiem: 'Afternoon', kind: 'View', imageId: 'a-d2-nishiyu',
          title: L('Nishiyunoura Observatory', 'จุดชมวิวนิชิยุโนะอุระ'),
          place: L('Rim panorama over the caldera', 'พาโนรามาขอบปากปล่อง'),
          blurb: L('A quieter rim observatory with a sweeping panorama of the central cones and the town spread across the caldera floor - a great first stop before Daikanbo.',
                   'จุดชมวิวบนขอบปล่องที่คนน้อยกว่า เห็นพาโนรามากรวยภูเขาไฟกลางและเมืองที่กระจายอยู่บนพื้นปากปล่อง เป็นจุดแวะแรกที่ดีก่อนไปไดคันโบ'),
          refs: { map: 'https://maps.google.com/?q=Nishiyunoura+Observatory+Aso',
                  booking: L('Observatory - ¥300 pp (¥100 if you eat at the restaurant)', 'ค่าขึ้นจุดชมวิวคนละ 300 เยน เหลือ 100 เยนถ้ากินข้าวที่ร้าน'),
                  parking: L('Free gravel lot, big enough that coaches use it - no problem for the van. Open 10:00-17:00.', 'ลานกรวดจอดฟรี กว้างพอให้รถบัสจอดได้ รถตู้จึงสบายมาก เปิด 10:00 ถึง 17:00'),
                  notes: L('Along the rim from Kabutoiwa you reach this one about half an hour before Daikanbo, so the order is right. The ridge road is slow in a van - do not try to win time back here, the Yamanami leg to Beppu has the slack.', 'ขับเลียบสันเขามาจากคาบุโตอิวะจะถึงจุดนี้ก่อนไดคันโบราวครึ่งชั่วโมง ลำดับจึงถูกแล้ว ถนนสันเขาขับรถตู้ช้า อย่าพยายามเร่งเอาเวลาคืนตรงนี้ เพราะช่วงยามานามิไปเบปปุมีเวลาเผื่อไว้แล้ว') } },

        { type: 'feature', time: '15:15', meridiem: 'Afternoon', kind: 'View', imageId: 'a-d3-daikanbo',
          title: L('Daikanbo viewpoint', 'จุดชมวิวไดคันโบ'),
          place: L('The caldera rim', 'ขอบปากปล่อง'),
          blurb: L('The classic rim viewpoint - the whole 25-km caldera opens below, the central cones lined up like a sleeping figure.',
                   'จุดชมวิวขอบปล่องคลาสสิก แอ่งปากปล่องกว้าง 25 กิโลเมตร เปิดออกเบื้องล่าง กรวยกลางเรียงตัวเหมือนคนนอนหลับ'),
          refs: { map: 'https://maps.google.com/?q=Daikanbo+Aso',
                  parking: L('Free, somewhere around 100-160 spaces plus a bus bay. It fills hardest 11:00-14:00 and autumn weekends are the worst of its year - you arrive 11:50 on a holiday Sunday, so expect to circle a bit.', 'ฟรี ราว 100-160 ช่อง มีช่องรถบัสด้วย แต่เต็มหนักสุดช่วง 11:00 ถึง 14:00 และเสาร์อาทิตย์หน้าใบไม้เปลี่ยนสีคือช่วงแย่ที่สุดของปี เราไปถึง 11:50 วันอาทิตย์วันหยุดยาว เผื่อวนหาที่จอดหน่อย'),
                  notes: L('Wind is fierce on the rim - bring a layer.', 'ลมแรงบนขอบปล่อง พกเสื้อกันหนาว') } },

        { type: 'step', time: '16:05', meridiem: 'Afternoon', kind: 'Transfer', icon: 'car',
          title: L('Down the Yamanami to Beppu', 'ลงยามานามิสู่เบปปุ'),
          place: L('Daikanbo, Oguni, Senomoto, Yufuin, Beppu - about 100 km, 2 h', 'ไดคันโบ โอกุนิ เซโนโมโตะ ยูฟุอิน เบปปุ ระยะประมาณ 100 กิโลเมตร ใช้เวลาประมาณ 2 ชั่วโมง'),
          blurb: L('North off the rim to Oguni, east to Senomoto where the Yamanami Highway proper begins, then over Makinoto Pass at 1,330 m, across the Kuju grasslands, past Yufuin and over the last saddle below Mt Tsurumi down to the coast. Leaving Daikanbo at five past four puts the best stretch, Senomoto to Makinoto, squarely in the low light between half four and ten past five. Yufuin itself waits for tomorrow afternoon.',
                   'ลงจากสันเขาไปทางเหนือสู่โอกุนิ แล้วเลี้ยวตะวันออกไปเซโนโมโตะ ซึ่งเป็นจุดเริ่มของยามานามิไฮเวย์จริงๆ จากนั้นข้ามช่องเขามากิโนโตะที่สูง 1,330 เมตร ผ่านทุ่งหญ้าคุจู ผ่านยูฟุอิน แล้วข้ามสันเขาช่วงสุดท้ายใต้ภูเขาสึรุมิลงสู่ชายฝั่ง การออกจากไดคันโบสี่โมงห้านาทีทำให้ช่วงที่สวยที่สุดคือเซโนโมโตะถึงมากิโนโตะ ตรงกับแสงเย็นระหว่างสี่โมงครึ่งถึงห้าโมงสิบพอดี ส่วนตัวเมืองยูฟุอินเก็บไว้บ่ายพรุ่งนี้'),
          refs: { map: 'https://maps.google.com/?q=%E6%B5%B7%E4%B9%83%E3%83%9B%E3%83%86%E3%83%AB+%E3%81%AF%E3%81%98%E3%82%81+%E5%88%A5%E5%BA%9C',
                  parking: L('Set Umi no Hotel Hajime as the destination - it has its own car park for guests.', 'ตั้งจุดหมายไว้ที่โรงแรมอูมิโนะ ฮาจิเมะเลย เพราะมีลานจอดสำหรับผู้เข้าพัก'),
                  notes: L('Sunset is 17:13, so the last hour, from Yufuin down to Beppu, is after dark - a main road with traffic, but the descent off the Tsurumi saddle is steep and winding, so take it slowly. Fill up at Oguni, the last easy fuel before the pass. If the weather has turned and you would rather not take a 1,330 m pass in the dark, go Oguni to Hita and take the Oita Expressway to Beppu instead.',
                           'พระอาทิตย์ตก 17:13 ชั่วโมงสุดท้ายจากยูฟุอินลงเบปปุจึงเป็นตอนมืด เป็นถนนสายหลักที่มีรถวิ่ง แต่ช่วงลงจากสันเขาสึรุมิชันและคดเคี้ยว ควรขับช้าๆ เติมน้ำมันที่โอกุนิ เป็นปั๊มสุดท้ายที่หาง่ายก่อนขึ้นช่องเขา ถ้าอากาศเปลี่ยนและไม่อยากข้ามช่องเขาสูง 1,330 เมตรตอนมืด ให้ไปทางโอกุนิขึ้นฮิตะแล้วเข้าทางด่วนโออิตะไปเบปปุแทน') } },

        { type: 'step', time: '18:05', meridiem: 'Evening', kind: 'Check-in', icon: 'bed',
          title: L('Check in - Umi no Hotel Hajime', 'เช็คอินโรงแรมอูมิโนะ ฮาจิเมะ'),
          place: L('Beppu bay - ten minutes from the station', 'ริมอ่าวเบปปุ ห่างสถานีสิบนาที'),
          blurb: L('Thirty-five rooms, and every one of them has its own hot spring bath, which in Beppu is less a luxury than a local habit. The draw is upstairs though: a panoramic open-air bath and a picture-window indoor bath looking across Beppu Bay to the Kunisaki peninsula. Ten minutes on foot from the east exit of JR Beppu Station, so dinner and the old bathhouse are walkable and the car stays put until morning.',
                   'ห้องพักสามสิบห้าห้อง และทุกห้องมีบ่อน้ำพุร้อนในตัว ซึ่งในเบปปุถือเป็นเรื่องปกติมากกว่าความหรูหรา แต่ของเด็ดอยู่ชั้นบน คือบ่อกลางแจ้งแบบพาโนรามาและบ่อในร่มกระจกบานใหญ่ที่มองข้ามอ่าวเบปปุไปถึงคาบสมุทรคุนิซากิ เดินสิบนาทีจากทางออกฝั่งตะวันออกของสถานี JR เบปปุ มื้อค่ำและโรงอาบน้ำเก่าจึงเดินถึง และจอดรถทิ้งไว้ได้จนถึงเช้า'),
          refs: { map: 'https://maps.google.com/?q=%E6%B5%B7%E4%B9%83%E3%83%9B%E3%83%86%E3%83%AB+%E3%81%AF%E3%81%98%E3%82%81+%E5%88%A5%E5%BA%9C', official: 'https://www.new-matsumi.com/',
                  parking: L('Y550 a night for guests - about 40 spaces', 'ค่าจอดคืนละ 550 เยนสำหรับผู้เข้าพัก มีราว 40 ช่อง'),
                  reservation: { time: '18:05', code: 'BEP-STAY', party: L('Night 2 - 1 night - to book', 'คืนที่ 2 หนึ่งคืน ยังไม่ได้จอง') },
                  notes: L('NOT BOOKED YET. Check-in from 15:00, check-out 10:00. Formerly Hotel New Matsumi, so older listings still carry that name - check you are booking the right place. Ask for a bay-facing room, and book room-only or breakfast only, because tonight you eat in town. This is the Sunday of the three-day weekend, one of the two hardest nights of the trip to get, so book it straight after Kumamoto.',
                           'ยังไม่ได้จอง เช็คอินตั้งแต่ 15:00 เช็คเอาท์ 10:00 เดิมชื่อ Hotel New Matsumi เว็บเก่าๆ จึงยังใช้ชื่อนั้นอยู่ ควรเช็กให้แน่ว่าจองถูกที่ ขอห้องหันหน้าออกอ่าว และเลือกแบบไม่รวมอาหารหรือรวมแค่มื้อเช้า เพราะคืนนี้ไปกินในเมือง คืนนี้เป็นคืนวันอาทิตย์ของวันหยุดยาวสามวัน เป็นหนึ่งในสองคืนที่จองยากที่สุดของทริป ควรจองต่อจากคุมาโมโตะทันที') } },

        { type: 'feature', time: '19:00', meridiem: 'Night', kind: 'Dining', imageId: 'a-beppu-izutsu',
          title: L('Kaisen Izutsu - toriten and ryukyu', 'ไคเซ็นอิซุทสึ โทริเท็นและริวคิว'),
          place: L('The arcade by Beppu Station - eight minutes on foot', 'ถนนมีหลังคาหน้าสถานีเบปปุ เดินจากโรงแรมแปดนาที'),
          blurb: L('The two things Oita eats that nowhere else does, in one sitting. Toriten is chicken in a light batter fried like tempura and eaten with ponzu and mustard - Beppu is where it started. Ryukyu is the fishermen\'s dish of raw fish marinated in soy, sesame and ginger, eaten as it is or over rice. Izutsu is a busy fish restaurant in the covered street in front of the station, known locally for how fresh and how cheap it is, and it does a set with both.',
                   'ของกินสองอย่างที่มีแต่โออิตะ ได้กินครบในมื้อเดียว โทริเท็นคือไก่ชุบแป้งบางแล้วทอดแบบเทมปุระ กินกับพอนสึและมัสตาร์ด และเบปปุคือที่ที่เมนูนี้เริ่มต้น ส่วนริวคิวคือปลาดิบหมักซีอิ๊ว งา และขิง อาหารของชาวประมง กินเปล่าๆ หรือราดข้าวก็ได้ อิซุทสึเป็นร้านอาหารทะเลที่คึกคักอยู่ในถนนมีหลังคาหน้าสถานี คนท้องถิ่นรู้จักกันว่าสดและราคาไม่แพง และมีชุดที่ได้ทั้งสองอย่าง'),
          refs: { map: 'https://maps.google.com/?q=%E6%B5%B7%E9%AE%AE%E3%81%84%E3%81%A5%E3%81%A4+%E5%88%A5%E5%BA%9C',
                  notes: L('Kusunokimachi 5-5, tel 0977-22-2449. Open 11:00-15:00 and 18:00-22:30, CLOSED MONDAYS - which is why it is tonight and not tomorrow. It is popular and a queue at the door is normal, so ring ahead and ask whether they can hold a table for five on a holiday Sunday. Takegawara is five minutes further on foot, so the walk after dinner is already done.',
                           'ที่อยู่คุสึโนกิมาจิ 5-5 โทร 0977-22-2449 เปิด 11:00 ถึง 15:00 และ 18:00 ถึง 22:30 หยุดวันจันทร์ ซึ่งเป็นเหตุผลที่ต้องมาคืนนี้ ไม่ใช่พรุ่งนี้ ร้านคนเยอะ ต่อคิวหน้าร้านเป็นเรื่องปกติ ควรโทรไปถามก่อนว่าเก็บโต๊ะห้าคนให้ได้ไหมในคืนวันอาทิตย์ของวันหยุดยาว ส่วนทาเคงาวาระอยู่ถัดไปอีกห้านาทีเดิน หลังมื้อค่ำจึงแทบไม่ต้องเดินต่อ') } },

        { type: 'feature', time: '20:30', meridiem: 'Night', kind: 'Onsen', imageId: 'a-beppu-takegawara',
          title: L('Takegawara Onsen sand bath', 'อาบทรายที่ทาเคงาวาระออนเซน'),
          place: L('The 1938 bathhouse in the old town', 'โรงอาบน้ำไม้ปี 1938 ในย่านเมืองเก่า'),

                  parking: L('Its own car park on site.', 'มีลานจอดของร้านเอง'),
                  notes: L('Open 11:00-21:00 and closed Wednesdays, with the occasional unannounced closure on top, so check Instagram before you set off. With the name down at half past seven the table should come up in the first hour or so after opening - follow the list online and come back when it gets close. If the call runs late, it is the pudding that gets shortened, not the two o\'clock start for Yufuin. Budget around Y3,000-4,000 a head in practice, more than the menu suggests, because the plates are big and you will keep going.',
                           'เปิดเวลา 11:00 ถึง 21:00 หยุดวันพุธ และบางครั้งปิดกะทันหันโดยไม่แจ้งล่วงหน้า ควรเช็คอินสตาแกรมของร้านก่อนออกเดินทาง ถ้าลงชื่อไว้ตั้งแต่เจ็ดโมงครึ่ง น่าจะได้โต๊ะภายในราวชั่วโมงแรกหลังร้านเปิด ให้ติดตามคิวทางออนไลน์แล้วกลับมาเมื่อใกล้ถึงคิว ถ้าถูกเรียกช้า ให้ตัดเวลาร้านพุดดิ้งลง ไม่ใช่เลื่อนเวลาออกไปยูฟุอินบ่ายสองโมง งบจริงราว 3,000 ถึง 4,000 เยนต่อคน มากกว่าที่เมนูบอก เพราะชิ้นใหญ่และจะสั่งเพลิน') } },

        { type: 'feature', time: '13:15', meridiem: 'Afternoon', kind: 'Sweets', imageId: 'a-d5-sweets',
          title: L('Okamotoya - jigoku-mushi purin', 'โอกาโมโตยะ พุดดิ้งนึ่งไอบ่อนรก'),
          place: L('Myoban - up the hill from Kannawa', 'ย่านเมียวบัง บนเนินเหนือคันนาวะ'),
          blurb: L('The original steamed-over-the-springs custard pudding, made the same way since 1988: firm, eggy, with a bitter caramel, cooked in the natural steam of Myoban. The egg sandwich, made with eggs from the same steam, is the other thing people order, and there is a view down over the hillside from the shop. Myoban is also where the thatched huts that make yu-no-hana bath salts stand, a few minutes along the road.',
                   'พุดดิ้งคัสตาร์ดนึ่งด้วยไอน้ำพุร้อนต้นตำรับ ทำสูตรเดิมมาตั้งแต่ปี 1988 เนื้อแน่น รสไข่ชัด ราดคาราเมลขม นึ่งด้วยไอน้ำธรรมชาติของเมียวบัง อีกเมนูที่คนสั่งคู่กันคือแซนด์วิชไข่ที่ใช้ไข่นึ่งด้วยไอเดียวกัน และจากร้านมองลงไปเห็นไหล่เขาได้ ย่านเมียวบังยังเป็นที่ตั้งของกระท่อมมุงจากที่ใช้ผลิตเกลือแร่อาบน้ำยุโนะฮานะ ห่างไปตามถนนไม่กี่นาที'),
          refs: { map: 'https://maps.google.com/?q=%E5%B2%A1%E6%9C%AC%E5%B1%8B%E5%A3%B2%E5%BA%97+%E6%98%8E%E7%A4%AC', official: 'https://jigoku-prin.com/',
                  parking: L('Large car park at the shop.', 'มีลานจอดขนาดใหญ่หน้าร้าน'),
                  notes: L('Myoban 3-kumi, tel 0977-66-6115. Open 08:30-18:30 every day, last orders 17:30. Ten minutes uphill from Kamesho, and Beppu IC is just below Myoban, so it costs nothing on the way to Yufuin. If the sushi ran late, take the purin away in the car rather than cutting into the two o\'clock start.',
                           'ที่อยู่เมียวบัง 3 กุมิ โทร 0977-66-6115 เปิด 08:30 ถึง 18:30 ทุกวัน รับออร์เดอร์สุดท้าย 17:30 ขับขึ้นเนินจากคาเมโชสิบนาที และทางขึ้นทางด่วนเบปปุอยู่ใต้เมียวบังพอดี จึงไม่ต้องอ้อมเลยเมื่อไปยูฟุอิน ถ้าซูชิเสร็จช้า ให้ซื้อพุดดิ้งขึ้นรถไปกินแทน อย่าไปเบียดเวลาออกเดินทางบ่ายสองโมง') } },

        { type: 'step', time: '14:00', meridiem: 'Afternoon', kind: 'Transfer', icon: 'car',
          title: L('Drive to Yufuin - the Kinrin Lake car park', 'ขับไปยูฟุอิน ลานจอดข้างบึงคินริน'),
          place: L('Oita Expressway, Beppu IC to Yufuin IC - about 25 km, 35 min', 'ทางด่วนโออิตะจากเบปปุไอซีถึงยูฟุอินไอซี ระยะประมาณ 25 กิโลเมตร ใช้เวลาประมาณ 35 นาที'),
          blurb: L('On at Beppu IC just below Myoban, off at Yufuin, and down into the valley with Mt Yufu standing over it. Park once by the lake for the whole afternoon - Yunotsubo, the sweets and the cafe are all a few minutes\' walk from the same lot.',
                   'ขึ้นทางด่วนที่เบปปุไอซีซึ่งอยู่ใต้เมียวบังพอดี ลงที่ยูฟุอินไอซี แล้วลงสู่หุบเขาที่มีภูเขายูฟุตั้งตระหง่านอยู่ จอดรถครั้งเดียวข้างบึงไว้ทั้งบ่าย ทั้งถนนยูโนทสึโบะ ร้านขนม และคาเฟ่ เดินจากลานเดียวกันไม่กี่นาที'),
          refs: { map: 'https://maps.google.com/?q=%E3%82%BF%E3%82%A4%E3%83%A0%E3%82%BA%E6%B9%AF%E5%B8%83%E9%99%A2%E9%87%91%E9%B1%97%E6%B9%96',
                  parking: L('Times Yufuin Kinrinko, two minutes from the lake: a flat Y900 for the day on weekends and holidays, Y600 on weekdays. Times Yufuin Kinrinko 2 is the overflow.', 'ไทม์สยูฟุอินคินรินโกะ ห่างบึงสองนาที เสาร์อาทิตย์และวันหยุดเหมาวันละ 900 เยน วันธรรมดา 600 เยน ถ้าเต็มให้ไปไทม์สยูฟุอินคินรินโกะ 2'),
                  notes: L('Today is a holiday, so the valley road can back up in the afternoon - another reason the car leaves Beppu at two, not three.',
                           'วันนี้เป็นวันหยุด ถนนเข้าหุบเขาช่วงบ่ายอาจรถติด นี่เป็นอีกเหตุผลที่ต้องออกจากเบปปุบ่ายสอง ไม่ใช่บ่ายสาม') } },

        { type: 'feature', time: '14:40', meridiem: 'Afternoon', kind: 'Wander', imageId: 'a-d6-yunotsubo',
          title: L('Yunotsubo Kaido', 'ถนนยูโนทสึโบะ'),
          place: L('The main street - shops shut ~17:30', 'ถนนสายหลัก ร้านส่วนใหญ่ปิดราว 17:30'),
          blurb: L('The kilometre of craft shops, cheese and jam stalls, croquette counters and small galleries that runs from the lake back towards the station. The car is at the lake end, so walk out along it towards the station and back.',
                   'ถนนยาวหนึ่งกิโลเมตรเต็มไปด้วยร้านงานคราฟต์ แผงชีสและแยม เคาน์เตอร์โครเกะ และแกลเลอรีเล็กๆ ทอดจากบึงกลับไปทางสถานี รถจอดอยู่ฝั่งบึง จึงเดินออกไปทางสถานีแล้ววนกลับมา'),
          refs: { map: 'https://maps.google.com/?q=Yunotsubo+Kaido+Yufuin',
                  notes: L('Most shops shut around 17:30 - which is why the street comes first and the lake last.', 'ร้านส่วนใหญ่ปิดราว 17:30 จึงต้องเดินถนนนี้ก่อน แล้วค่อยไปบึงเป็นที่สุดท้าย') } },

        { type: 'feature', time: '15:20', meridiem: 'Afternoon', kind: 'Sweets', imageId: 'a-d6-sweets',
          title: L('Yufuin Sweets - B-speak & Milch', 'ของหวานยูฟุอินจากร้าน B-speak และ Milch'),
          place: L('Roll cake & baked cheesecake', 'โรลเค้กและชีสเค้กอบ'),
          blurb: L('B-speak sells one thing, a plain rolled sponge, and sells out of it; Milch does a small baked cheesecake eaten warm at the counter. Both are on the street you are already walking.',
                   'B-speak ขายอย่างเดียวคือโรลเค้กเนื้อสปันจ์ธรรมดา และขายหมดทุกวัน ส่วน Milch ทำชีสเค้กอบชิ้นเล็กให้กินอุ่นๆ ที่เคาน์เตอร์ ทั้งสองร้านอยู่บนถนนสายที่กำลังเดินอยู่แล้ว'),
          refs: { map: 'https://maps.google.com/?q=B-speak+Yufuin',
                  notes: L('B-speak often sells out by mid-afternoon - if the whole roll is gone, take the sliced P roll.', 'B-speak มักหมดตั้งแต่บ่ายแก่ ถ้าโรลทั้งก้อนหมด ให้เอาแบบตัดชิ้นหรือ P roll แทน') } },

        { type: 'feature', time: '16:10', meridiem: 'Afternoon', kind: 'Coffee', imageId: 'a-yuf-laruche',
          title: L('CAFE LA RUCHE - coffee on the lake', 'CAFE LA RUCHE กาแฟริมบึงคินริน'),
          place: L('The shore of Kinrin Lake - as the light goes', 'ริมบึงคินริน ตอนแสงเย็นกำลังหมด'),
          blurb: L('The cafe that sits right on the edge of Kinrin Lake. It roasts its own coffee and bakes its own croissants, and late in the afternoon it is the warmest seat in the valley from which to watch the light go off the water and Mt Yufu. Sunset is about 17:10 - finish the cups, then walk the short path round the lake.',
                   'คาเฟ่ที่ตั้งอยู่ริมบึงคินรินพอดี คั่วกาแฟเองและอบครัวซองต์เอง ช่วงบ่ายแก่ๆ ที่นี่คือที่นั่งอุ่นที่สุดในหุบเขาสำหรับดูแสงค่อยๆ หายไปจากผิวน้ำและภูเขายูฟุ พระอาทิตย์ตกราว 17:10 ดื่มเสร็จแล้วค่อยเดินเล่นรอบบึงสั้นๆ'),
          refs: { map: 'https://maps.google.com/?q=CAFE+LA+RUCHE+Yufuin',
                  notes: L('Kawakami 1592-1. Open 09:00-17:30, from 08:00 on Sundays and holidays, closed Wednesdays. Tomorrow at dawn you come back to this same shore for the mist, so this evening is the other half of the lake\'s day.',
                           'ที่อยู่คาวาคามิ 1592-1 เปิด 09:00 ถึง 17:30 วันอาทิตย์และวันหยุดเปิดตั้งแต่ 08:00 หยุดวันพุธ พรุ่งนี้เช้ามืดจะกลับมาที่ริมบึงเดิมนี้เพื่อดูไอหมอก เย็นนี้จึงเป็นอีกครึ่งหนึ่งของวันที่บึงนี้') } },

        { type: 'step', time: '17:15', meridiem: 'Evening', kind: 'Check-in', icon: 'bed',
          title: L('Check in - Ryokan Nobiru Sansou', 'เช็คอินเรียวกังโนบิรุซันโซ'),
          place: L('On the slope above Yufuin - ten minutes by car', 'บนเนินเหนือเมืองยูฟุอิน ขับจากบึงสิบนาที'),
          blurb: L('An onsen ryokan up on the hillside above the town, with Mt Yufu behind it and its own spring running straight into the baths. There are separate indoor and outdoor baths for men and women, and three private family baths, each with an indoor tub and an open-air one, that you take in turn. Every so often the water comes out a faint cobalt blue, which is rare enough that the inn mentions it. Dinner tonight and breakfast tomorrow are both served here.',
                   'เรียวกังออนเซนบนเนินเหนือตัวเมือง มีภูเขายูฟุอยู่ด้านหลัง และน้ำพุร้อนของตัวเองไหลตรงลงบ่อ มีบ่อในร่มและบ่อกลางแจ้งแยกชายหญิง กับบ่อครอบครัวส่วนตัวอีกสามหลัง แต่ละหลังมีทั้งอ่างในร่มและอ่างกลางแจ้ง ผลัดกันใช้ได้ บางครั้งน้ำจะออกมาเป็นสีฟ้าโคบอลต์อ่อนๆ ซึ่งหาได้ยากจนเรียวกังเขียนบอกไว้เอง มื้อค่ำคืนนี้และมื้อเช้าพรุ่งนี้กินที่นี่ทั้งคู่'),
          refs: { map: 'https://maps.google.com/?q=%E9%87%8E%E8%92%9C%E5%B1%B1%E8%8D%98+%E7%94%B1%E5%B8%83%E5%B8%82', official: 'http://nobiru-sansou.com/',
                  parking: L('Free, 20 spaces, no booking needed.', 'จอดฟรี 20 ช่อง ไม่ต้องจอง'),
                  reservation: { time: '17:15', code: 'YUF-NOBIRU', party: L('Night 3 - 1 night - dinner and breakfast - to book', 'คืนที่ 3 หนึ่งคืน รวมมื้อค่ำและมื้อเช้า ยังไม่ได้จอง') },
                  notes: L('NOT BOOKED YET. Kawakami 786-6, tel 0977-85-4768. CHECK-IN IS 15:00 TO 18:00 ONLY - arrive by six or ring ahead - and check-out is 10:00. For five, ask for one of the big rooms: the detached Nobiru annex has two tatami rooms and its own open-air bath, and there are ten- and twelve-mat rooms looking at Mt Yufu. The family baths cannot be reserved; ask at the desk which one is free. Guests can bathe from 06:00 to midnight. The inn cannot cater for allergies, and any special dinner order has to be phoned in three days ahead. It warns that the hill road can freeze from November, so ask the rental desk about winter tyres.',
                           'ยังไม่ได้จอง ที่อยู่คาวาคามิ 786-6 โทร 0977-85-4768 เช็คอินได้เฉพาะ 15:00 ถึง 18:00 ต้องมาถึงก่อนหกโมงเย็นหรือโทรแจ้งล่วงหน้า และเช็คเอาท์ 10:00 สำหรับห้าคนให้ขอห้องใหญ่ เช่นเรือนแยกโนบิรุที่มีห้องเสื่อทาทามิสองห้องกับบ่อกลางแจ้งส่วนตัว หรือห้องสิบเสื่อและสิบสองเสื่อที่มองเห็นภูเขายูฟุ บ่อครอบครัวจองล่วงหน้าไม่ได้ ให้ถามที่เคาน์เตอร์ว่าหลังไหนว่าง ผู้เข้าพักแช่น้ำได้ตั้งแต่ 06:00 ถึงเที่ยงคืน เรียวกังไม่รับทำอาหารสำหรับคนแพ้อาหาร และถ้าอยากสั่งเมนูพิเศษต้องโทรสั่งล่วงหน้าสามวัน เรียวกังเตือนไว้ด้วยว่าถนนขึ้นเนินอาจเป็นน้ำแข็งตั้งแต่เดือนพฤศจิกายน ควรถามร้านรถเช่าเรื่องยางสำหรับหน้าหนาว') } },

        { type: 'feature', time: '18:30', meridiem: 'Evening', kind: 'Dining', imageId: 'a-d3-kaiseki',
          title: L('Kaiseki dinner at the ryokan', 'มื้อค่ำไคเซกิที่เรียวกัง'),
          place: L('Bungo beef and the season, course by course', 'เนื้อบุงโงะและวัตถุดิบตามฤดู เสิร์ฟทีละคอร์ส'),
          blurb: L('Course after small course of whatever is in season, each on its own plate, cooked with the inn\'s own spring water. The Bungo beef steak is the dish the ryokan is known for - Oita\'s own wagyu - so if one thing is going to be upgraded, make it that.',
                   'เสิร์ฟทีละคอร์สเล็กๆ ตามวัตถุดิบประจำฤดู แต่ละอย่างมาในจานของตัวเอง และปรุงด้วยน้ำพุของเรียวกังเอง จานที่ที่นี่ขึ้นชื่อคือสเต๊กเนื้อบุงโงะ วากิวของโออิตะ ถ้าจะอัปเกรดอะไรสักอย่าง ให้เลือกจานนี้'),
          refs: { notes: L('Confirm the dinner sitting when you check in - arriving at quarter past five leaves about an hour to bathe first. Upgrades or extra dishes must be ordered by phone at least three days before; nothing can be added on the day.',
                           'ยืนยันเวลามื้อค่ำตอนเช็คอิน มาถึงห้าโมงสิบห้าจะมีเวลาแช่น้ำก่อนราวหนึ่งชั่วโมง ส่วนการอัปเกรดหรือสั่งจานเพิ่มต้องโทรสั่งล่วงหน้าอย่างน้อยสามวัน วันจริงเพิ่มอะไรไม่ได้') } },

        { type: 'step', time: '20:00', meridiem: 'Night', kind: 'Onsen', icon: 'bed',
          title: L('The family baths and the open-air pools', 'บ่อครอบครัวและบ่อกลางแจ้ง'),
          place: L('Three private baths, taken in turn', 'บ่อส่วนตัวสามหลัง ผลัดกันใช้'),
          blurb: L('The point of sleeping in Yufuin rather than passing through it. Take one of the three private family baths together, indoor tub and open-air one, then the separate outdoor pools later on. The spring runs straight in, so there is no hurry.',
                   'นี่คือเหตุผลของการนอนค้างที่ยูฟุอินแทนที่จะแค่แวะผ่าน เข้าบ่อครอบครัวส่วนตัวหนึ่งในสามหลังด้วยกัน ทั้งอ่างในร่มและอ่างกลางแจ้ง แล้วค่อยแยกไปบ่อกลางแจ้งชายหญิงตอนดึก น้ำพุร้อนไหลลงบ่อตลอด ไม่ต้องรีบ'),
          refs: { notes: L('The baths are open to guests until midnight and again from 06:00, so there is time for one more before the lake at dawn.',
                           'บ่อเปิดให้ผู้เข้าพักถึงเที่ยงคืน และเปิดอีกทีตั้งแต่ 06:00 จึงยังมีเวลาแช่อีกรอบก่อนไปบึงตอนรุ่งเช้า') } },
      ],
    },
    {
      label: 'Day 04', labelTh: 'วันที่ 04', theme: 'kurogane',
      date: L('Tuesday - 24 Nov 2026', 'อังคาร 24 พฤศจิกายน 2026'),
      title: L('Back to Fukuoka', 'กลับสู่ฟุกุโอกะ'),
      subtitle: L('Lake Mist, an Edo Town, a Reclining Buddha', 'หมอกริมบึง เมืองเอโดะ และพระนอนองค์ใหญ่'),
      note: L(
        'Late November is exactly when the mist comes off Kinrin Lake, so the day starts at dawn with the town still asleep, then back up the hill for breakfast and one more bath. West out of the mountains after that, with lunch in Hita, the old shogunate merchant town halfway home, and one stop before the city: Nanzoin in Sasaguri, where a bronze Buddha forty-one metres long lies on the hillside. The car goes back at Hakata Station as the Christmas lights come on outside it, and the last five nights are all in one house in Sumiyoshi, walking distance from Canal City and the river.',
        'ปลายพฤศจิกายนคือช่วงที่ไอหมอกลอยขึ้นจากบึงคินรินพอดี วันนี้จึงเริ่มตั้งแต่ฟ้ายังไม่สว่างขณะที่เมืองยังหลับ แล้วกลับขึ้นเนินไปกินมื้อเช้าและแช่น้ำอีกรอบ จากนั้นมุ่งตะวันตกออกจากเขา แวะกินข้าวเที่ยงที่ฮิตะ เมืองพ่อค้าเก่าสมัยโชกุนที่อยู่กึ่งกลางทางกลับ และแวะอีกที่ก่อนเข้าเมือง คือวัดนันโซอินที่ซาซากุริ ซึ่งมีพระนอนทองสัมฤทธิ์ยาวสี่สิบเอ็ดเมตรอยู่บนเนินเขา รถไปคืนที่สถานีฮากาตะตอนที่ไฟคริสต์มาสหน้าสถานีเริ่มเปิด และห้าคืนสุดท้ายอยู่บ้านหลังเดียวกันทั้งหมดที่ย่านสุมิโยชิ เดินถึงคาแนลซิตี้และริมแม่น้ำ'
      ),
      coverId: 'day4-cover',
      activities: [
        { type: 'feature', time: '06:45', meridiem: 'Dawn', kind: 'Lake', imageId: 'a-d7-mist',
          title: L('Kinrin Lake at dawn', 'บึงคินรินยามรุ่ง'),
          place: L('Steam off the water - ten minutes down from the ryokan', 'ไอน้ำลอยเหนือผิวน้ำ ขับลงจากเรียวกังสิบนาที'),
          blurb: L('Hot springs feed the lake from below, so on a cold morning the whole surface steams. Late November is the best time of year for it - the colder the night, the thicker the mist. Walk the loop before the coaches arrive.',
                   'มีน้ำพุร้อนไหลเข้าบึงจากใต้พื้น พอเช้าอากาศเย็นผิวน้ำทั้งบึงจึงเป็นไอ ปลายพฤศจิกายนคือช่วงที่ดีที่สุดของปี ยิ่งคืนไหนหนาวไอยิ่งหนา ควรเดินรอบบึงให้เสร็จก่อนรถทัวร์มาถึง'),
          refs: { map: 'https://maps.google.com/?q=Lake+Kinrin+Yufuin',

                  notes: L('Best between about 06:30 and 08:00 on a clear cold morning - it thins fast once the sun is properly up. Leave the bags in the room; you come straight back up for breakfast.', 'สวยสุดราว 06:30 ถึง 08:00 ของเช้าที่ฟ้าใสและหนาว พอแดดขึ้นเต็มที่ไอจะจางเร็ว ทิ้งกระเป๋าไว้ในห้องได้ เพราะจะกลับขึ้นไปกินมื้อเช้าทันที') } },

        { type: 'step', time: '08:00', meridiem: 'Morning', kind: 'Onsen', icon: 'bed',
          title: L('Breakfast at the ryokan', 'มื้อเช้าที่เรียวกัง'),
          place: L('Back up the hill, then one more bath', 'กลับขึ้นเนิน แล้วแช่น้ำอีกรอบ'),

        { type: 'step', time: '10:05', meridiem: 'Morning', kind: 'Transfer', icon: 'car',
          title: L('Drive to the Mameda west car park - Hita', 'ขับไปลานจอดมาเมดะฝั่งตะวันตกที่ฮิตะ'),
          place: L('Oita Expressway, Yufuin IC to Hita IC - 55 km, 50 min', 'ทางด่วนโออิตะจากยูฟุอินไอซีถึงฮิตะไอซี 55 กิโลเมตร 50 นาที'),
          blurb: L('West along the Oita Expressway, dropping out of the mountains into the river basin. Hita is exactly halfway home, which is why lunch is there.',
                   'วิ่งไปทางตะวันตกบนทางด่วนโออิตะ ลงจากภูเขาเข้าสู่ที่ราบลุ่มแม่น้ำ ฮิตะอยู่กึ่งกลางทางกลับพอดี จึงเป็นจุดกินข้าวเที่ยง'),
          refs: { map: 'https://maps.google.com/?q=%E8%B1%86%E7%94%B0%E8%A5%BF%E9%A7%90%E8%BB%8A%E5%A0%B4+%E6%97%A5%E7%94%B0%E5%B8%82',
                  parking: L('Mameda west car park, Minatomachi 8-54 - 47 spaces, free.', 'ลานจอดมาเมดะฝั่งตะวันตก มินาโตะมาจิ 8-54 มี 47 ช่อง จอดฟรี') } },

        { type: 'feature', time: '11:00', meridiem: 'Late morning', kind: 'Wander', imageId: 'a-d7-lunch',
          title: L('Hita Mameda-machi', 'ฮิตะ ย่านมาเมดะมาจิ'),
          place: L('Edo merchant streets - on foot', 'ย่านพ่อค้าสมัยเอโดะ เดินชม'),
          blurb: L('Hita was run directly by the shogunate, and Mameda-machi is the merchant quarter that survived it - white-walled storehouses, lattice fronts and a canal, all on a flat grid you can walk in half an hour.',
                   'ฮิตะเคยอยู่ใต้การปกครองของรัฐบาลโชกุนโดยตรง และมาเมดะมาจิคือย่านพ่อค้าที่เหลือรอดมา มีโกดังผนังขาว หน้าบ้านไม้ระแนง และลำคลอง ทั้งหมดอยู่บนผังตารางพื้นราบที่เดินจบในครึ่งชั่วโมง'),
          refs: { map: 'https://maps.google.com/?q=Mameda+machi+Hita',
                  parking: L('47 free spaces at the Mameda west lot.', 'ลานตะวันตกของมาเมดะจอดฟรี 47 คัน'),
                  notes: L('Forty-five minutes is enough to walk it - then take the car five minutes south to lunch.',
                           'เดินชมสี่สิบห้านาทีก็พอ แล้วขับรถลงใต้ไปอีกห้านาทีเพื่อกินข้าวเที่ยง') } },

        { type: 'feature', time: '11:50', meridiem: 'Midday', kind: 'Dining', imageId: 'a-hita-sofuren',
          title: L('Sofuren Sohonten - Hita yakisoba', 'โซฟุเร็นสาขาใหญ่ ฮิตะยากิโซบะ'),
          place: L('Wakamiyamachi - the shop that set the style', 'ย่านวากามิยะมาจิ ร้านที่วางแบบฉบับของเมนูนี้'),
          blurb: L('Hita yakisoba is fried hard on an iron griddle until the noodles crisp and brown on both sides, then tossed with pork, a heap of bean sprouts and green onion, so every forkful is half soft and half crunch. Sofuren has made it that way for more than half a century, and its noodles, meat and vegetables still come out of its own kitchens. Order the yakisoba and nothing else the first time.',
                   'ฮิตะยากิโซบะคือบะหมี่ผัดบนกระทะเหล็กจนเส้นกรอบและเกรียมทั้งสองด้าน แล้วคลุกกับหมู ถั่วงอกกองโต และต้นหอม ทุกคำจึงนุ่มครึ่งหนึ่งและกรอบอีกครึ่ง โซฟุเร็นทำแบบนี้มามากกว่าครึ่งศตวรรษ และยังผลิตเส้น เนื้อ และผักในครัวของตัวเองทั้งหมด ครั้งแรกให้สั่งยากิโซบะอย่างเดียวพอ'),
          refs: { map: 'https://maps.google.com/?q=%E6%83%B3%E5%A4%AB%E6%81%8B+%E7%B7%8F%E6%9C%AC%E5%BA%97+%E6%97%A5%E7%94%B0', official: 'https://www.sofuren.com/stores/souhonten',
                  parking: L('About 50 spaces at the shop.', 'มีลานจอดของร้านราว 50 ช่อง'),
                  notes: L('Wakamiyamachi 416-1, tel 0973-24-3188. Open 11:00-22:00, last orders 21:30, closed only on 1 January and the odd staff-training day. Get back on the road by quarter to one - Nanzoin stops letting people in at half past four.',
                           'ที่อยู่วากามิยะมาจิ 416-1 โทร 0973-24-3188 เปิด 11:00 ถึง 22:00 รับออร์เดอร์สุดท้าย 21:30 หยุดแค่วันที่ 1 มกราคมกับวันอบรมพนักงานบางวัน ควรออกเดินทางต่อภายในเที่ยงสี่สิบห้า เพราะวัดนันโซอินปิดรับเข้าสี่โมงครึ่ง') } },

        { type: 'step', time: '12:45', meridiem: 'Afternoon', kind: 'Transfer', icon: 'car',
          title: L('Drive to the Nanzoin car park - Sasaguri', 'ขับไปลานจอดวัดนันโซอินที่ซาซากุริ'),
          place: L('Oita and Kyushu Expressways, then Route 201 - about 95 km, 1 h 20', 'ทางด่วนโออิตะและทางด่วนคิวชู แล้วต่อถนนหมายเลข 201 ระยะประมาณ 95 กิโลเมตร ใช้เวลาประมาณ 1 ชั่วโมง 20 นาที'),
          blurb: L('Back onto the Oita Expressway to Tosu, north on the Kyushu Expressway to Fukuoka IC, then east along Route 201 into the hills of Sasaguri. Nanzoin sits about twenty-five minutes short of Hakata, so it is a detour of under an hour on the way home rather than a separate trip.',
                   'กลับขึ้นทางด่วนโออิตะไปโทสุ แล้วขึ้นเหนือบนทางด่วนคิวชูไปลงที่ฟุกุโอกะไอซี จากนั้นไปทางตะวันออกตามถนนหมายเลข 201 เข้าสู่เนินเขาซาซากุริ วัดนันโซอินอยู่ห่างจากฮากาตะราวยี่สิบห้านาที จึงเป็นการอ้อมไม่ถึงหนึ่งชั่วโมงระหว่างทางกลับ ไม่ต้องแยกมาอีกวัน'),
          refs: { map: 'https://maps.google.com/?q=%E5%8D%97%E8%94%B5%E9%99%A2+%E9%A7%90%E8%BB%8A%E5%A0%B4+%E7%AF%A0%E6%A0%97',
                  parking: L('Three free car parks at the temple. They fill up at weekends; today is a weekday.', 'วัดมีลานจอดฟรีสามลาน เสาร์อาทิตย์มักเต็ม แต่วันนี้เป็นวันธรรมดา') } },

        { type: 'feature', time: '14:05', meridiem: 'Afternoon', kind: 'Temple', imageId: 'a-sasaguri-nanzoin',
          title: L('Nanzoin - the reclining Buddha', 'วัดนันโซอิน พระนอนองค์ใหญ่'),
          place: L('Sasaguri - 41 metres of bronze on the hillside', 'ซาซากุริ พระนอนทองสัมฤทธิ์ยาว 41 เมตรบนเนินเขา'),
          blurb: L('The head temple of the Sasaguri pilgrimage, a Shingon temple in the wooded hills east of Fukuoka, and home to one of the largest bronze statues in the world: a reclining Buddha 41 metres long, 11 metres high and 300 tonnes, stretched out at the top of the grounds. The way up passes rows of stone Buddhas and goes through the Seven Lucky Gods tunnel, which you walk through making a wish. Give it an hour and a quarter.',
                   'วัดหลักของเส้นทางแสวงบุญซาซากุริ เป็นวัดนิกายชินงนบนเนินเขาที่มีป่าล้อมทางตะวันออกของฟุกุโอกะ และเป็นที่ประดิษฐานรูปหล่อทองสัมฤทธิ์ที่ใหญ่ที่สุดแห่งหนึ่งของโลก คือพระนอนยาว 41 เมตร สูง 11 เมตร หนัก 300 ตัน ทอดองค์อยู่ด้านบนสุดของวัด ทางเดินขึ้นผ่านพระพุทธรูปหินเรียงราย และลอดอุโมงค์เทพเจ้าโชคลาภทั้งเจ็ดที่เดินผ่านพร้อมอธิษฐานขอพร เผื่อเวลาราวหนึ่งชั่วโมงสิบห้านาที'),
          refs: { map: 'https://maps.google.com/?q=Nanzoin+Temple+Sasaguri',
                  booking: L('Y500 each for overseas visitors since March 2026 - Japanese residents and under-19s free', 'ผู้มาเยือนจากต่างประเทศคนละ 500 เยน ตั้งแต่มีนาคม 2026 ส่วนผู้มีถิ่นพำนักในญี่ปุ่นและอายุต่ำกว่า 19 ปีเข้าฟรี'),
                  notes: L('Sasaguri 1035, tel 092-947-7195. The reclining Buddha area is open 09:00-17:00 with last entry at 16:30, and its gate is locked from 16:30 until the next morning, so do not arrive late. Photography is not allowed in some places, including inside the halls - follow the signs. Wear shoes for slopes and steps, dress modestly and keep voices down; it is a working temple.',
                           'ที่อยู่ซาซากุริ 1035 โทร 092-947-7195 โซนพระนอนเปิด 09:00 ถึง 17:00 ปิดรับเข้า 16:30 และประตูทางเข้าพระนอนล็อกตั้งแต่ 16:30 จนถึงเช้าวันรุ่งขึ้น ห้ามมาช้า บางจุดห้ามถ่ายรูป รวมถึงในวิหาร ให้ดูป้าย ใส่รองเท้าที่เดินทางลาดและบันไดได้ แต่งกายสุภาพ และพูดเบาๆ เพราะเป็นวัดที่ยังประกอบพิธีจริง') } },

        { type: 'step', time: '15:25', meridiem: 'Afternoon', kind: 'Transfer', icon: 'car',
          title: L('Drive to the house - Sumiyoshi', 'ขับไปบ้านพักที่ย่านสุมิโยชิ'),
          place: L('Route 201 into Hakata - about 20 km, 40 min', 'ถนนหมายเลข 201 เข้าฮากาตะ ระยะประมาณ 20 กิโลเมตร ใช้เวลาประมาณ 40 นาที'),
          blurb: L('Down out of the hills and into the city from the east, past Hakata Station to Sumiyoshi. Unload everything at the house first - the car goes back the moment it is empty, and nobody has to carry bags from the station.',
                   'ลงจากเนินเขาเข้าเมืองทางตะวันออก ผ่านสถานีฮากาตะไปย่านสุมิโยชิ ขนของทั้งหมดลงที่บ้านก่อน พอรถว่างก็เอาไปคืนทันที ไม่มีใครต้องลากกระเป๋าจากสถานี'),
          refs: { map: 'https://maps.google.com/?cid=8269104671073730333',
                  parking: L('Free parking at the house, per the listing.', 'บ้านมีที่จอดรถฟรีตามที่ระบุในประกาศ'),
                  notes: L('Traffic into Hakata builds after four, so leaving Nanzoin by half past three matters more than ten extra minutes at the temple. Fill the tank on Route 201 before the city.',
                           'รถเข้าฮากาตะเริ่มติดหลังสี่โมง การออกจากวัดภายในบ่ายสามโมงครึ่งจึงสำคัญกว่าการอยู่ที่วัดนานขึ้นอีกสิบนาที และเติมน้ำมันบนถนนหมายเลข 201 ก่อนเข้าเมือง') } },

        { type: 'step', time: '16:05', meridiem: 'Afternoon', kind: 'Check-in', icon: 'bed',
          title: L('Check in - AMP FLAT SUMIYOSHI TERRACE', 'เช็คอิน AMP FLAT SUMIYOSHI TERRACE'),
          place: L('A whole three-storey house in Sumiyoshi', 'บ้านสามชั้นทั้งหลังในย่านสุมิโยชิ'),
          blurb: L('The last five nights in one place, and a whole house rather than hotel rooms: three storeys, a private terrace and free parking, with everyone under one roof for the rest of the trip. Sumiyoshi is the quiet residential pocket between Hakata Station and Canal City - about twelve minutes on foot to Canal City, with Sumiyoshi Shrine, the Rakusuien garden, the Naka river and the station all within a walk, so most city days start from the front door.',
                   'ห้าคืนสุดท้ายอยู่ที่เดียว และเป็นบ้านทั้งหลังแทนที่จะเป็นห้องโรงแรม มีสามชั้น ระเบียงส่วนตัว และที่จอดรถฟรี ทุกคนอยู่ใต้หลังคาเดียวกันตลอดช่วงที่เหลือของทริป ย่านสุมิโยชิคือย่านที่อยู่อาศัยเงียบๆ ระหว่างสถานีฮากาตะกับคาแนลซิตี้ เดินไปคาแนลซิตี้ราวสิบสองนาที ส่วนศาลเจ้าสุมิโยชิ สวนราคุซุยเอน ริมแม่น้ำนากะ และสถานีฮากาตะ ก็อยู่ในระยะเดินทั้งหมด วันเที่ยวในเมืองส่วนใหญ่จึงเริ่มจากหน้าประตูบ้านได้เลย'),
          refs: { map: 'https://maps.google.com/?cid=8269104671073730333',
                  parking: L('Free parking at the house - enough to unload before the car goes back.', 'จอดฟรีที่บ้าน พอสำหรับขนของลงก่อนเอารถไปคืน'),
                  reservation: { time: '16:05', code: 'FUK-SUMIYOSHI', party: L('Base nights 4-8 - to book', 'คืนที่ 4-8 ห้าคืน ยังไม่ได้จอง') },
                  notes: L('NOT BOOKED YET. The map pin is on the house itself. The door code and the check-in and check-out times come with the booking - the public listing does not show them, so fill them in here once booked. AMP FLAT is run by Andes Inc in Hakata, tel 092-718-3822, and messages normally go through the booking platform. Budget taxis only for the late nights and the last morning - the rest is walkable, or a short subway ride from Gion or Hakata.',

        'The second city day, and the one the shortened loop paid for. Everything today sits within a square kilometre east of the river, most of it a short walk from the house in Sumiyoshi, so there is no schedule to keep. Hakata proper is the old merchant half of Fukuoka: the shrine the city grew up around, the first Zen temple built in Japan, a covered arcade that has traded for a century, the wagashi house at the end of it, and a walled tea garden almost nobody finds. Finish on chicken-skin skewers, which Fukuoka invented and which are far better than they sound.',

        { type: 'feature', time: '10:30', meridiem: 'Morning', kind: 'Temple', imageId: 'a-hakata-tochoji',

  <script type="text/babel">
// components.jsx - lookbook UI (bilingual). Depends on window.Icon, REF_TYPES, tx, tr.
const { useState, useEffect, useRef, useContext, createContext } = React;

// Language context - provides current lang + resolvers x()/r().
const LangCtx = createContext('en');
function useT() {
  const lang = useContext(LangCtx);
  return { lang, x: (v) => window.tx(v, lang), r: (s) => window.tr(s, lang) };
}

// -- LangToggle - TH / EN segmented switch ------------------------------
function LangToggle({ lang, onChange, tone = 'ink' }) {
  return (
    <div className={'lang-toggle' + (tone === 'ondark' ? ' on-dark' : '')} role="group" aria-label="Language">
      <button className={lang === 'en' ? 'on' : ''} onClick={() => onChange('en')}>EN</button>
      <button className={lang === 'th' ? 'on' : ''} onClick={() => onChange('th')}>ไทย</button>
    </div>
  );
}

// -- ImageFrame ---------------------------------------------------------
function ImageFrame({ id, placeholder, ratio = '4 / 3', className = '', kicker }) {
  return (
    <div className={'img-frame ' + className} style={{ aspectRatio: ratio }}>
      <image-slot
        id={id}
        src={id ? 'images/' + id + '.jpg' : undefined}
        shape="rect"
        placeholder={placeholder || 'Drop image'}
        style={{ position: 'absolute', inset: 0, width: '100%', height: '100%', display: 'block' }}
      ></image-slot>
      {kicker ? <span className="img-kicker">{kicker}</span> : null}
      <span className="img-edge" aria-hidden="true"></span>
    </div>
  );
}

// -- ReferenceDock ------------------------------------------------------
function ResValue({ value }) {
  const { x, r } = useT();
  return (
    <div className="dock-res">
      <div className="dock-res-row"><span className="dock-res-k">{r('Time')}</span><span className="dock-res-v">{value.time}</span></div>
      <div className="dock-res-row"><span className="dock-res-k">{r('Confirmation')}</span><span className="dock-res-v mono">{value.code}</span></div>
      <div className="dock-res-row"><span className="dock-res-k">{r('Party')}</span><span className="dock-res-v">{x(value.party)}</span></div>
    </div>
  );
}

function RefValue({ type, value }) {
  const { x } = useT();
  if (type.kind === 'reservation') return <ResValue value={value} />;
  if (type.kind === 'link') {
    let host = value;
    try { host = new URL(value).hostname.replace(/^www\./, ''); } catch (e) {}
    return (
      <a className="dock-link" href={value} target="_blank" rel="noopener noreferrer">
        <span className="dock-link-url">{host}</span>
        <Icon name="arrowUpRight" size={14} stroke={1.4} />
      </a>
    );
  }
  if (type.key === 'notes') return <p className="dock-notes">{x(value)}</p>;
  return <p className="dock-text">{x(value)}</p>;
}

function ReferenceDock({ refs, variant = 'inline' }) {
  const { x } = useT();
  const present = REF_TYPES.filter((t) => refs && refs[t.key] != null);
  const [active, setActive] = useState(null);
  if (!present.length) return null;

  if (variant === 'expanded') {
    return (
      <div className="dock dock-expanded">
        {present.map((t) => (
          <div className="dock-card" key={t.key}>
            <div className="dock-card-hd">
              <Icon name={t.icon} size={16} stroke={1.3} />
              <span className="dock-card-label">{x(t.label)}</span>
            </div>
            <div className="dock-card-body"><RefValue type={t} value={refs[t.key]} /></div>
          </div>
        ))}
      </div>
    );
  }

  const activeType = present.find((t) => t.key === active);
  return (
    <div className={'dock' + (active ? ' is-open' : '')}>
      <div className="dock-rail">
        {present.map((t) => (
          <button
            key={t.key}
            type="button"
            className={'dock-chip' + (active === t.key ? ' active' : '')}
            onClick={() => setActive(active === t.key ? null : t.key)}
          >
            <Icon name={t.icon} size={15} stroke={1.3} />
            <span className="dock-chip-label">{x(t.label)}</span>
          </button>
        ))}
      </div>
      <div className="dock-drawer" style={{ gridTemplateRows: active ? '1fr' : '0fr' }}>
        <div className="dock-drawer-inner">
          {activeType ? (
            <div className="dock-detail" key={activeType.key}>
              <RefValue type={activeType} value={refs[activeType.key]} />
            </div>
          ) : null}
        </div>
      </div>
    </div>
  );
}

// -- reveal-on-scroll hook ----------------------------------------------
function useInView() {
  const ref = useRef(null);
  useEffect(() => {
    const el = ref.current;
    if (!el) return;
    const io = new IntersectionObserver(
      (entries) => entries.forEach((e) => { if (e.isIntersecting) el.classList.add('in'); }),
      { threshold: 0.16 }
    );
    io.observe(el);
    return () => io.disconnect();
  }, []);
  return ref;
}

// -- StepBlock - compact logistics row (flights, tickets, transit) -------
function StepBlock({ a, index }) {
  const { x, r } = useT();
  const ref = useInView();
  return (
    <article className="tl-row tl-row-step" ref={ref} style={{ '--i': index }}>
      <div className="tl-mid" aria-hidden="true"><span className="tl-dot tl-dot-step"></span></div>
      <div className="tl-content">
        <div className="step">
          <div className="step-lead">
            <span className="step-time">{a.time}</span>
            <span className="step-ic"><Icon name={a.icon || 'compass'} size={18} stroke={1.3} /></span>
          </div>
          <div className="step-body">
            <div className="step-head">
              <h4 className="step-title">{x(a.title)}</h4>
              <span className="step-kind">{r(a.kind)}</span>
            </div>
            <p className="step-place">{x(a.place)}</p>
            <p className="step-note">{x(a.blurb)}</p>
            <div className="step-dock" onClick={(e) => e.stopPropagation()}>
              <ReferenceDock refs={a.refs} />
            </div>
          </div>
        </div>
      </div>
    </article>
  );
}

// -- FeatureBlock - hero image + caption + dock (sightseeing, dining) -----
function FeatureBlock({ a, index, onOpen }) {
  const { x, r } = useT();
  const ref = useInView();
  return (
    <article className="tl-row" ref={ref} style={{ '--i': index }}>
      <div className="tl-mid" aria-hidden="true"><span className="tl-dot"></span></div>

      <div className="tl-content">
        <div className="tl-head" onClick={() => onOpen(a)}>
          <span className="tl-time">{a.time}</span>
          <span className="tl-meridiem">{r(a.meridiem)}</span>
          <span className="tl-headrule" aria-hidden="true"></span>
        </div>

        <div className="activity" onClick={() => onOpen(a)}>
          <div className="activity-media">
            <ImageFrame id={a.imageId} placeholder={x(a.title)} ratio="16 / 10" kicker={r(a.kind)} />
          </div>
          <div className="activity-caption">
            <div className="activity-text">
              <h3 className="activity-title">{x(a.title)}</h3>
              <p className="activity-place">{x(a.place)}</p>
              <p className="activity-blurb">{x(a.blurb)}</p>
              <button className="activity-open" onClick={(e) => { e.stopPropagation(); onOpen(a); }}>
                <span>{x({ en: 'View detail', th: 'ดูรายละเอียด' })}</span>
                <Icon name="arrowRight" size={15} stroke={1.4} />
              </button>
            </div>
            <div className="activity-foot" onClick={(e) => e.stopPropagation()}>
              <ReferenceDock refs={a.refs} />
            </div>
          </div>
        </div>
      </div>
    </article>
  );
}

function ActivityBlock({ a, index, onOpen }) {
  return a.type === 'step'
    ? <StepBlock a={a} index={index} />
    : <FeatureBlock a={a} index={index} onOpen={onOpen} />;
}

// -- Timeline -----------------------------------------------------------
// -- Per-day konbini - nearest store to that night's stay ----------------
function konbiniForDay(day) {
  if (!window.KONBINI || !window.KONBINI.areas) return null;
  const n = parseInt((day.label.match(/\d+/) || [])[0], 10);
  if (!n) return null;
  return window.KONBINI.areas.find((ar) => {
    const nums = (ar.days.en.match(/\d+/g) || []).map(Number);
    if (nums.length === 1) return nums[0] === n;
    if (nums.length >= 2) return n >= nums[0] && n <= nums[nums.length - 1];
    return false;
  }) || null;
}

function DayKonbini({ area }) {
  const { x } = useT();
  if (!area) return null;
  const cats = [
    { items: area.stores,   icon: 'store',  label: { en: 'Convenience', th: 'ร้านสะดวกซื้อ' } },
    { items: area.pharmacy, icon: 'plus',   label: { en: 'Pharmacy', th: 'ร้านขายยา' } },
    { items: area.hospital, icon: 'alert',  label: { en: 'Hospital', th: 'โรงพยาบาล' } },
    { items: area.donki,    icon: 'wallet', label: { en: 'Don Quijote', th: 'ดองกี้' } },
  ].filter((c) => c.items && c.items.length);
  if (!cats.length) return null;
  return (
    <div className="dnear">
      <div className="dnear-head">
        <Icon name="pin" size={13} stroke={1.5} />
        <span className="dnear-title">{x({ en: 'Near your stay', th: 'ใกล้ที่พัก' })}</span>
        <span className="dnear-area">{x(area.area)}</span>
      </div>
      <div className="dnear-cats">
        {cats.map((c, ci) => (
          <div className="dnear-cat" key={ci}>
            <span className="dnear-cat-head">
              <span className="dnear-cat-ic"><Icon name={c.icon} size={14} stroke={1.5} /></span>
              <span className="dnear-cat-label">{x(c.label)}</span>
            </span>
            <span className="dnear-chips">
              {c.items.map((st, i) => (
                <a className="dnear-chip" key={i} href={st.map} target="_blank" rel="noopener noreferrer" title={x(st.detail)}>{st.brand}</a>
              ))}
            </span>
          </div>
        ))}
      </div>
    </div>
  );
}

function Timeline({ day, onOpen }) {
  const { x, lang } = useT();
  return (
    <section className="day" key={day.label}>
      <header className="day-head">
        <div className="day-head-row">
          <span className="day-label">{lang === 'th' ? day.labelTh : day.label}</span>
          <span className="day-rule" aria-hidden="true"></span>
          <span className="day-date">{x(day.date)}</span>
          <DayWeather wx={weatherForDay(day)} note={window.WEATHER && window.WEATHER.note} />
        </div>
        <h2 className="day-title">{x(day.title)}</h2>
        <p className="day-sub">{x(day.subtitle)}</p>
        <p className="day-note">{x(day.note)}</p>
      </header>

      {day.visitJapan ? <VisitJapanBox /> : null}

      <DayKonbini area={konbiniForDay(day)} />

      <div className="timeline">
        {day.activities.map((a, i) => (
          <ActivityBlock key={a.imageId || (a.kind + a.time)} a={a} index={i} onOpen={onOpen} />
        ))}
      </div>
    </section>
  );
}

// -- Clock - live dual-timezone (home <-> Japan), updates every second -----
function useNow() {
  const [now, setNow] = useState(() => new Date());
  useEffect(() => {
    const id = setInterval(() => setNow(new Date()), 1000);
    return () => clearInterval(id);
  }, []);
  return now;
}
function fmtTime(date, tz) {
  try {
    return new Intl.DateTimeFormat('en-GB', { hour: '2-digit', minute: '2-digit', second: '2-digit', hour12: false, timeZone: tz }).format(date);
  } catch (e) { return '--:--:--'; }
}
// Day/month/year out of a localized date line, e.g. "Saturday - 21 Nov 2026"
// or the Thai "เสาร์ 21 พฤศจิกายน 2026".
const TH_MONTH_SHORT = {
  'มกราคม': 'ม.ค.', 'กุมภาพันธ์': 'ก.พ.', 'มีนาคม': 'มี.ค.', 'เมษายน': 'เม.ย.',
  'พฤษภาคม': 'พ.ค.', 'มิถุนายน': 'มิ.ย.', 'กรกฎาคม': 'ก.ค.', 'สิงหาคม': 'ส.ค.',
  'กันยายน': 'ก.ย.', 'ตุลาคม': 'ต.ค.', 'พฤศจิกายน': 'พ.ย.', 'ธันวาคม': 'ธ.ค.',
};
function dateParts(s) {
  const m = String(s || '').match(/(\d{1,2})\s+(\S+)\s+(\d{4})/);
  return m ? { day: m[1], month: m[2], year: m[3] } : null;
}
function shortMonth(m) { return TH_MONTH_SHORT[m] || String(m).slice(0, 3); }

// Trip date range from the itinerary days, e.g. "21-29 Nov 2026" / "21-29 พ.ย. 2026"
function tripDateRange(x) {
  const days = (window.TRIP && window.TRIP.days) || [];
  if (!days.length) return '';
  const a = dateParts(x(days[0].date)), b = dateParts(x(days[days.length - 1].date));
  if (!a || !b) return '';
  return a.month === b.month
    ? a.day + '-' + b.day + ' ' + shortMonth(a.month) + ' ' + b.year
    : a.day + ' ' + shortMonth(a.month) + ' - ' + b.day + ' ' + shortMonth(b.month) + ' ' + b.year;
}

function Clock({ variant = 'chrome' }) {
  const { x } = useT();
  const now = useNow();
  const jp = fmtTime(now, 'Asia/Tokyo');
  const bkk = fmtTime(now, 'Asia/Bangkok');
  if (variant === 'chrome') {
    const dateStr = now.toLocaleDateString('en-GB', { timeZone: 'Asia/Tokyo', day: 'numeric', month: 'short', year: 'numeric' });
    const jpHM = jp.split(':').slice(0, 2).join(':');
    return (
      <div className="clock-chrome" title="Trip dates - now (JST)">
        <span className="clock-trip">{tripDateRange(x)}</span>
        <span className="clock-now mono">{dateStr} - <span className="clock-zone">JP</span>{jpHM}</span>
      </div>
    );
  }
  // 'panel' - the larger dual clock used on the Overview screen
  return (
    <div className="clock-panel">
      <div className="clock-cell">
        <span className="clock-cell-zone">{x({ en: 'Japan - Tokyo', th: 'ญี่ปุ่น - โตเกียว' })}</span>
        <span className="clock-cell-time mono">{jp}</span>
      </div>
      <span className="clock-div" aria-hidden="true"></span>
      <div className="clock-cell">
        <span className="clock-cell-zone">{x({ en: 'Home - Bangkok', th: 'บ้าน - กรุงเทพฯ' })}</span>
        <span className="clock-cell-time mono">{bkk}</span>
      </div>
    </div>
  );
}

// One-line live local date + time (JST) - sits beneath the trip date in the centered nav block
function NowLine() {
  const now = useNow();
  const dateStr = now.toLocaleDateString('en-GB', { timeZone: 'Asia/Tokyo', day: 'numeric', month: 'short', year: 'numeric' });
  const jp = fmtTime(now, 'Asia/Tokyo');
  const jpHM = jp.split(':').slice(0, 2).join(':');
  return <span className="chrome-now-live mono">{dateStr} - <span className="clock-zone">JP</span>{jpHM}</span>;
}

  // draw the route as a clean closed loop: order stops by angle around their centroid (no crossings)
  const cx = route.reduce((a, s) => a + s.mx, 0) / route.length;
  const cy = route.reduce((a, s) => a + s.my, 0) / route.length;
  const ring = route.slice().sort((a, b) => Math.atan2(a.my - cy, a.mx - cx) - Math.atan2(b.my - cy, b.mx - cx));
  const startAt = Math.max(0, ring.findIndex((s) => s.start));
  const loop = ring.slice(startAt).concat(ring.slice(0, startAt));
  const d = loop.map((s, i) => (i === 0 ? 'M' : 'L') + s.mx + ',' + (s.my * 1.35).toFixed(2)).join(' ') + ' Z';
  return (
    <div className="jmap" ref={ref}>
      <div className="jmap-base">
        <svg className="jmap-geo" viewBox="0 0 100 135.1" preserveAspectRatio="none" aria-hidden="true">
          <path className="jmap-land" d={KYUSHU_GEO} />
        </svg>
        <span className="jmap-veil" aria-hidden="true"></span>
      </div>
      <svg className="jmap-svg" viewBox="0 0 100 135" preserveAspectRatio="none" aria-hidden="true">
        <path id="jmapRoute" className="jmap-path" d={d} pathLength="100" fill="none" />
        <circle className="jmap-comet" r="1.7">
          <animateMotion dur="6.5s" repeatCount="indefinite" calcMode="linear" rotate="0">
            <mpath href="#jmapRoute" />
          </animateMotion>
        </circle>
      </svg>
      {route.map((s, i) => (
        <button className={'jmap-node' + (s.start ? ' is-start' : '')} key={i} style={{ left: s.mx + '%', top: s.my + '%', '--i': i }}
          onClick={() => onJump(s.day)} aria-label={x(s.city)}>
          {s.start ? <span className="jmap-flag">{x({ en: 'Start \u00b7 End', th: '\u0e40\u0e23\u0e34\u0e48\u0e21 \u00b7 \u0e08\u0e1a' })}</span> : null}
          <span className="jmap-pin" aria-hidden="true"></span>
          <span className="jmap-label">
            <span className="jmap-city">{x(s.city)}</span>
            <span className="jmap-days">{x(s.days)}</span>
          </span>
        </button>
      ))}
    </div>
  );
}

// -- Morning run route map ------------------------------------------------
// The map geometry travels with the data (RUNROUTE.map): SVG path strings
// projected from OpenStreetMap into a 0 0 100 76 viewBox. Stop `x`/`y` are
// percentages of the same canvas, so the pins land on the route line.
function RunRouteMap({ data }) {
  const { x } = useT();
  const ref = useInView();
  const [active, setActive] = React.useState(null);
  const stops = data.stops || [];
  const map = data.map || {};
  const total = parseFloat(data.distance) || 1;
  // elevation profile from each stop's height in metres
  const elev = stops.map((s) => ({ km: parseFloat(s.km), m: s.m || 0 }));
  const elevPts = elev.map((e) => (e.km / total) * 100 + ',' + (26 - (e.m / 40) * 22).toFixed(1)).join(' ');
  // keep tooltips inside the canvas near its edges
  const tipClass = (s) => (s.y < 24 ? ' tip-down' : '') + (s.x < 24 ? ' tip-left' : s.x > 76 ? ' tip-right' : '');

  return (
    <div className="runmap" ref={ref}>
      <div className="runmap-stats">
        {(data.stats || []).map((s, i) => (
          <div className="runstat" key={i} style={{ '--i': i }}>
            <span className="runstat-ic"><Icon name={s.icon} size={14} stroke={1.5} /></span>
            <span className="runstat-v">{x(s.v)}</span>
            <span className="runstat-k">{x(s.k)}</span>
          </div>
        ))}
      </div>

      <div className="runmap-canvas">
        <svg viewBox="0 0 100 76" className="runmap-svg" role="img" aria-label={x(data.title)}>
          <defs>
            <linearGradient id="runWater" x1="0" y1="0" x2="0" y2="1">
              <stop offset="0%" stopColor="var(--accent)" stopOpacity="0.30" />
              <stop offset="100%" stopColor="var(--accent)" stopOpacity="0.12" />
            </linearGradient>
          </defs>
          {map.roads ? <path className="runmap-road" d={map.roads} fill="none" /> : null}
          {map.rail ? <path className="runmap-rail" d={map.rail} fill="none" /> : null}
          {map.green ? <path className="runmap-park" d={map.green} /> : null}
          {(map.rivers || []).map((r, i) => (
            <path key={i} className="runmap-river" d={r.d} fill="none" style={{ strokeWidth: r.w }} />
          ))}
          {map.water ? <path className="runmap-lake" d={map.water} fill="url(#runWater)" /> : null}
          {(map.labels || []).map((l, i) => (
            <text key={i} className="runmap-name" x={l.x} y={l.y}>{x(l.t)}</text>
          ))}
          <path className="runmap-line-case" d={map.route} fill="none" />
          <path id="runRoute" className="runmap-line" d={map.route} pathLength="100" fill="none" />
          <circle className="runmap-dot" r="1.5">
            <animateMotion dur={Math.round(total * 1.6) + 's'} repeatCount="indefinite" calcMode="linear" rotate="0">
              <mpath href="#runRoute" />
            </animateMotion>
          </circle>
        </svg>
        {stops.map((s, i) => (
          <button key={i} type="button"
            className={'runpin is-' + s.kind + (active === i ? ' is-on' : '') + tipClass(s) + (s.flagSide ? ' flag-' + s.flagSide : '')}
            style={{ left: s.x + '%', top: s.y + '%', '--i': i }}
            onClick={() => { const n = active === i ? null : i; setActive(n);
              if (n !== null) setTimeout(() => { const el = document.querySelectorAll('.runsteps > li')[n]; if (el) el.scrollIntoView({ behavior: 'smooth', block: 'center' }); }, 60); }}
            aria-label={x(s.name)}>
            {s.flag ? <span className="runpin-flag">{x(s.flag)}</span> : null}
            <span className="runpin-dot">{s.kind === 'finish' ? <Icon name="bowl" size={11} stroke={1.8} /> : i + 1}</span>
            <span className="runpin-tip">{x(s.name)}<b>{s.km} {x(data.unit)}</b></span>
          </button>
        ))}
      </div>

      <div className="runmap-elev">
        <svg viewBox="0 0 100 28" preserveAspectRatio="none" aria-hidden="true">
          <polyline className="runelev-line" points={elevPts} fill="none" />
          <polygon className="runelev-fill" points={'0,28 ' + elevPts + ' 100,28'} />
        </svg>
        <div className="runmap-elev-ax">
          <span>0 {x(data.unit)}</span>
          <span>{x(data.elevNote || '')}</span>
          <span>{data.distance} {x(data.unit)}</span>
        </div>
      </div>

      <ol className="runsteps">
        {stops.map((s, i) => (
          <li key={i} className={active === i ? 'is-on' : ''}>
            <button type="button" className="runstep" onClick={() => setActive(active === i ? null : i)}>
              <span className={'runstep-n is-' + s.kind}>{s.kind === 'finish' ? <Icon name="bowl" size={13} stroke={1.7} /> : i + 1}</span>
              <span className="runstep-body">
                <span className="runstep-top">
                  <span className="runstep-name">{x(s.name)}</span>
                  <span className="runstep-km">{s.km} {x(data.unit)}</span>
                </span>
                <span className="runstep-note">{x(s.note)}</span>
                <span className="runstep-media">
                  <ImageFrame id={'dish-a-d2-cityrun-' + i} placeholder={x(s.name)} ratio="4 / 3" className="runstep-img" />
                </span>
                {s.map ? (
                  <span className="runstep-go" onClick={(e) => { e.stopPropagation(); window.open(s.map, '_blank', 'noopener,noreferrer'); }}>
                    <Icon name="map" size={13} stroke={1.5} /> {x({ en: 'Open in Maps', th: 'เปิดในแผนที่' })}
                  </span>
                ) : null}
              </span>
            </button>
          </li>
        ))}
      </ol>

      {data.note ? <p className="runmap-foot">{x(data.note)}</p> : null}
    </div>
  );
}

// -- Bookings - consolidated reservations + ticket checklist -------------
const BK_CATS = [
  { key: 'flight',  icon: 'plane', label: { en: 'Flights',        th: 'เที่ยวบิน' } },
  { key: 'stay',    icon: 'bed',   label: { en: 'Stays',          th: 'ที่พัก' } },
  { key: 'transit', icon: 'train', label: { en: 'Rail & Transit', th: 'รถไฟและการเดินทาง' } },
  { key: 'dining',  icon: 'bowl',  label: { en: 'Dining',         th: 'ร้านอาหาร' } },
];

function bkCategory(a) {
  const k = (a.kind || '').toLowerCase();
  if (k === 'flight' || k === 'departure' || a.icon === 'plane') return 'flight';
  if (k === 'check-in' || k === 'onsen') return 'stay';
  if (['train', 'shinkansen', 'journey', 'ferry', 'bus', 'transfer'].includes(k) || a.icon === 'train' || a.icon === 'car') return 'transit';
  if (['dining', 'coffee'].includes(k)) return 'dining';
  return 'entry';
}

function bkShortDate(dateObj, lang) {
  const p = dateParts(window.tx(dateObj, lang));
  return p ? p.day + ' ' + shortMonth(p.month) : '';
}

function collectBookings(trip) {
  const reservations = [];
  const passes = [];
  trip.days.forEach((d, di) => {
    d.activities.forEach((a) => {
      if (!a.refs) return;
      if (a.refs.reservation) reservations.push({ a, di, day: d, cat: bkCategory(a) });
      else if (a.refs.booking) passes.push({ a, di, day: d });
    });
  });
  return { reservations, passes };
}

function BookingsList({ trip, lang }) {

    try { return JSON.parse(localStorage.getItem('jp-booked') || '{}'); } catch (e) { return {}; }
  });
  const toggle = (code) => setBooked((prev) => {
    const n = { ...prev, [code]: !prev[code] };
    try { localStorage.setItem('jp-booked', JSON.stringify(n)); } catch (e) {}
    return n;

  const total = reservations.length;
  const doneCount = reservations.filter((it) => booked[it.a.refs.reservation.code]).length;

    <div className="bk-list">

// -- Expenses - shared-trip spending log (÷4) ----------------------------
function Expenses() {
  const { x } = useT();
  const [items, setItems] = useState(() => {
    try { return JSON.parse(localStorage.getItem('jp-expenses') || '[]'); } catch (e) { return []; }
  });
  const [amt, setAmt] = useState('');
  const [note, setNote] = useState('');
  const save = (list) => { setItems(list); try { localStorage.setItem('jp-expenses', JSON.stringify(list)); } catch (e) {} };
  const add = () => {
    const a = parseFloat((amt || '').toString().replace(/,/g, ''));
    if (!a || a <= 0) return;
    save([{ id: 'e' + Date.now(), a, n: (note || '').trim() || '-' }, ...items]);
    setAmt(''); setNote('');
  };
  const remove = (id) => save(items.filter((it) => it.id !== id));
  const total = items.reduce((s, it) => s + it.a, 0);
  const per = total / 4;
  const fmt = (v) => '฿' + v.toLocaleString('en-US', { maximumFractionDigits: 0 });
  return (
    <section className="party exp">
      <div className="party-head">
        <span className="ov-kicker">{x({ en: 'Expenses', th: 'ค่าใช้จ่าย', ja: '支出' })}</span>
        <h2 className="ov-h2">{x({ en: 'Trip spending', th: 'บันทึกค่าใช้จ่าย', ja: '支出メモ' })}</h2>
      </div>
      <div className="exp-totals">
        <div className="exp-tot"><span className="exp-tot-k">{x({ en: 'Total', th: 'รวมทั้งหมด', ja: '合計' })}</span><span className="exp-tot-v">{fmt(total)}</span></div>
        <div className="exp-tot exp-tot-split"><span className="exp-tot-k">{x({ en: 'Each ÷ 4', th: 'หาร 4 คน', ja: '1人 ÷4' })}</span><span className="exp-tot-v">{fmt(per)}</span></div>
      </div>
      <div className="exp-add">
        <input className="exp-in exp-amt" type="number" inputMode="numeric" placeholder="฿0" value={amt} onChange={(e) => setAmt(e.target.value)} aria-label="Amount" />
        <input className="exp-in exp-note" type="text" placeholder={x({ en: 'What for?', th: 'ค่าอะไร?', ja: '何に?' })} value={note} onChange={(e) => setNote(e.target.value)} onKeyDown={(e) => { if (e.key === 'Enter') add(); }} aria-label="Note" />
        <button className="exp-add-btn" onClick={add} aria-label="Add"><Icon name="plus" size={17} stroke={2} /></button>
      </div>
      {items.length ? (
        <ul className="exp-list">
          {items.map((it) => (
            <li className="exp-row" key={it.id}>
              <span className="exp-row-n">{it.n}</span>
              <span className="exp-row-a">{fmt(it.a)}</span>
              <button className="exp-row-x" onClick={() => remove(it.id)} aria-label="Remove"><Icon name="close" size={13} stroke={2} /></button>
            </li>
          ))}
        </ul>
      ) : (
        <p className="exp-empty">{x({ en: 'No expenses yet - add one above.', th: 'ยังไม่มีรายการ เพิ่มด้านบนได้เลย', ja: 'まだ記録なし' })}</p>
      )}
    </section>
  );
}

// -- Packing / before-you-fly checklist ----------------------------------
function Packing({ data, storeKey = 'jp-packed' }) {
  const { x } = useT();
  const ref = useInView();
  const [done, setDone] = useState(() => {
    try { return JSON.parse(localStorage.getItem(storeKey) || '{}'); } catch (e) { return {}; }
  });
  const toggle = (k) => setDone((prev) => {
    const n = { ...prev, [k]: !prev[k] };
    try { localStorage.setItem(storeKey, JSON.stringify(n)); } catch (e) {}
    return n;
  });
  return (
    <section className="party packing" ref={ref}>
      <div className="party-head">
        <span className="ov-kicker">{x(data.subtitle)}</span>
        <h2 className="ov-h2">{x(data.title)}</h2>

        {data.groups.map((g, gi) => (
          <div className="pack-group" key={gi}>
            <h3 className="pack-group-label">{x(g.label)}</h3>
            <ul className="pack-list">
              {g.items.map((it, ii) => {
                const k = 'g' + gi + '-i' + ii;
                const on = !!done[k];
                return (
                  <li key={ii}>
                    <button className={'pack-item' + (on ? ' on' : '')} onClick={() => toggle(k)} aria-pressed={on}>
                      <span className="pack-check"><Icon name="check" size={12} stroke={2.6} /></span>
                      <span className="pack-label">{x(it)}</span>
                    </button>
                  </li>
                );
              })}
            </ul>
          </div>
        ))}
      </div>
    </section>
  );
}
