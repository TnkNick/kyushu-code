                   'จุดชมวิวขอบปล่องคลาสสิก - แอ่งปากปล่องกว้าง 25 กม. เปิดออกเบื้องล่าง กรวยกลางเรียงตัวเหมือนคนนอนหลับ'),
          refs: { map: 'https://maps.google.com/?q=Daikanbo+Aso',
                  parking: L('Free, somewhere around 100-160 spaces plus a bus bay. It fills hardest 11:00-14:00 and autumn weekends are the worst of its year - you arrive 11:50 on a holiday Sunday, so expect to circle a bit.', 'ฟรี ราว 100-160 ช่อง มีช่องรถบัสด้วย - เต็มหนักสุดช่วง 11:00-14:00 และเสาร์อาทิตย์หน้าใบไม้เปลี่ยนสีคือช่วงแย่ที่สุดของปี - เราไปถึง 11:50 วันอาทิตย์วันหยุดยาว เผื่อวนหาที่จอดหน่อย'),
                  notes: L('Wind is fierce on the rim - bring a layer.', 'ลมแรงบนขอบปล่อง พกเสื้อกันหนาว') } },

        { type: 'step', time: '12:15', meridiem: 'Midday', kind: 'Parking', icon: 'car',
          title: L('Park at Uchinomaki - take a queue ticket', 'จอดรถที่อุจิโนมากิ - รับบัตรคิว'),
          place: L('Park, take a ticket, come back here to eat', 'จอดรถ รับบัตรคิว แล้ววนกลับมากินที่นี่'),
          blurb: L('Three small lots here rather than one big one: about 6 spaces opposite the shop, roughly 30 in front of Myokoji temple, and about 30 more a 4-minute walk away - take the van to one of the bigger two. Then take a ticket BEFORE anything else: Imakin has no reservations, only same-day numbers, and the wait runs 2-3 hours at weekends. Today is a Sunday inside a three-day holiday weekend.',
                   'ที่นี่มีลานเล็กๆ 3 จุด ไม่ใช่ลานใหญ่จุดเดียว: ราว 6 ช่องตรงข้ามร้าน ราว 30 ช่องหน้าวัดเมียวโคจิ และอีกราว 30 ช่องเดิน 4 นาที - เอารถตู้ไปสองลานหลัง - แล้วไปรับบัตรคิวก่อนทำอย่างอื่น: ร้านอิมาคิงจองไม่ได้ ใช้บัตรคิวหน้าร้านอย่างเดียว เสาร์-อาทิตย์รอ 2-3 ชม. และวันนี้เป็นวันอาทิตย์กลางวันหยุดยาว 3 วัน'),
          refs: { map: 'https://maps.google.com/?q=Imakin+Shokudo+Aso',
                  notes: L('Tickets go out from around 10:00-10:30 and CAN run out on a busy day, so have a fallback in mind - there are other akaushi places in Uchinomaki and on Monzenmachi, and the beef is the point, not the queue. Ask what time your number is likely to be called before you drive off to the shrine.', 'แจกบัตรคิวราว 10:00-10:30 และวันที่คนเยอะ บัตรอาจหมดได้ เตรียมแผนสำรองไว้ - แถวอุจิโนมากิและถนนมนเซนมาจิมีร้านอาคาอุชิอื่นอีก จุดสำคัญคือเนื้อ ไม่ใช่การต่อคิว - ก่อนขับไปศาลเจ้า ถามร้านก่อนว่าคิวน่าจะถูกเรียกกี่โมง') } },

        { type: 'step', time: '12:40', meridiem: 'Midday', kind: 'Parking', icon: 'car',
          title: L('Park once at Ichinomiya - then walk', 'จอดรถที่อิจิโนมิยะที่เดียว - แล้วเดิน'),
          place: L('Aso-shi Ichinomiya-machi Chuo lot', 'ลานกลางอาโซชิ อิจิโนมิยะมาจิ'),
          blurb: L('Leave the van in one lot and do the whole stop on foot - the shrine is a 2-minute walk, Monzenmachi runs from the gate, and you finish back at the same lot. Reckon on an hour before you drive back to Uchinomaki for lunch. The address is Ichinomiya-machi Miyaji 1945-3.',
                   'จอดรถไว้ลานเดียวแล้วเดินเที่ยวทั้งจุด - ศาลเจ้าเดิน 2 นาที ถนนมนเซนมาจิเริ่มจากหน้าประตู เดินจบแล้ววนกลับมาที่ลานเดิม - เผื่อเวลาราวชั่วโมงก่อนขับกลับไปกินข้าวที่อุจิโนมากิ - ที่อยู่คือ อิจิโนมิยะมาจิ มิยาจิ 1945-3'),
          refs: { map: 'https://maps.google.com/?q=%E7%86%8A%E6%9C%AC%E7%9C%8C%E9%98%BF%E8%98%87%E5%B8%82%E4%B8%80%E3%81%AE%E5%AE%AE%E7%94%BA%E5%AE%AE%E5%9C%B01945-3',
                  booking: L('¥300 first 3 h, then ¥100/h, ¥1,000 cap', '¥300 3 ชม.แรก แล้ว ¥100/ชม. สูงสุด ¥1,000'),
                  notes: L('CHECK YOUR VAN HEIGHT: this lot has a 2.40 m limit. Most 8-seaters are well under it, but a high-roof Hiace can be close - measure at the rental desk. Over 2.40 m you are charged the large-vehicle rate instead: ¥2,000 for 3 h, then ¥1,000/h, ¥5,000 cap. Pick this lot over the shrine own ones - the city page and the national roadside database disagree about whether those are paid or free. It is the only paid parking of the morning.', 'เช็กความสูงรถตู้ก่อน: ลานนี้จำกัดความสูง 2.40 ม. - รถ 8 ที่นั่งส่วนใหญ่ต่ำกว่านี้สบายๆ แต่ไฮเอซหลังคาสูงอาจเฉียด วัดที่ร้านเช่ารถก่อน - ถ้าเกิน 2.40 ม. จะโดนเรตรถใหญ่แทน: ¥2,000 สำหรับ 3 ชม. แล้ว ¥1,000/ชม. สูงสุด ¥5,000 - เลือกลานนี้แทนลานของศาลเจ้า เพราะเว็บเทศบาลกับฐานข้อมูลจุดจอดของกรมทางหลวงบอกไม่ตรงกันว่าลานศาลเจ้าเก็บเงินหรือฟรี - เป็นที่เดียวของช่วงเช้าที่ต้องเสียค่าจอด') } },

        { type: 'feature', time: '12:45', meridiem: 'Midday', kind: 'Shrine', imageId: 'a-d2-asojinja',
          title: L('Aso Shrine & Monzenmachi', 'ศาลเจ้าอาโซ & ถนนมนเซนมาจิ'),
          place: L('Ichinomiya - the restored romon gate', 'อิจิโนมิยะ - ประตูโรมงที่บูรณะเสร็จแล้ว'),
          blurb: L('Over 2,000 years old, with one of the three great two-storey romon gates in Japan. The gate collapsed in the 2016 earthquake and only reopened in December 2023 after a seven-and-a-half year rebuild that reused about 72% of the original timbers. The street in front, Monzenmachi, has fifteen spring-water fountains and is made for eating your way along it - which is exactly what you want while the Imakin queue burns down.',
                   'ศาลเจ้าอายุกว่า 2,000 ปี มีประตูโรมงสองชั้นที่ถือเป็นหนึ่งในสามประตูศาลเจ้ายิ่งใหญ่ที่สุดของญี่ปุ่น - ประตูพังตอนแผ่นดินไหวปี 2016 และเพิ่งเปิดใหม่ธันวาคม 2023 หลังบูรณะ 7 ปีครึ่ง โดยใช้ไม้เดิมกลับมาได้ราว 72% - ถนนหน้าศาลเจ้าชื่อมนเซนมาจิ มีจุดน้ำผุด "มิซุกิ" 15 จุด และเป็นถนนสำหรับเดินกินโดยเฉพาะ ซึ่งพอดีกับการรอคิวอิมาคิงเลย'),
          refs: { map: 'https://maps.google.com/?q=Aso+Shrine+Ichinomiya', official: 'https://asojinja.or.jp/',
                  booking: L('Shrine entry free', 'เข้าศาลเจ้าฟรี'),
                  notes: L('This replaces the Nakadake crater, which is shut at Level 3. About 9 km east of Uchinomaki, roughly 15-20 min each way, so it fits a 2-hour wait comfortably - and doing it now rather than late afternoon means the Monzenmachi shops are actually open (most shut around 17:00). Keep an eye on your ticket number; you are 20 minutes from the restaurant.',
                           'จุดนี้มาแทนปล่องนากาดาเกะที่ปิดอยู่ (ระดับ 3) - ห่างอุจิโนมากิไปทางตะวันออกราว 9 กม. ขับราว 15-20 นาทีต่อเที่ยว จึงพอดีกับการรอคิว 2 ชม. - และการมาช่วงนี้แทนช่วงเย็น ทำให้ร้านบนถนนมนเซนมาจิยังเปิดอยู่จริง (ส่วนใหญ่ปิดราว 17:00) - คอยดูเลขคิวด้วย เพราะอยู่ห่างร้าน 20 นาที') } },

        { type: 'feature', time: '14:00', meridiem: 'Afternoon', kind: 'Dining', imageId: 'a-d3-lunch',
          title: L('Aso Akaushi-don', 'ข้าวหน้าเนื้ออาโซอากาอุชิ'),
          place: L('Aso red-wagyu beef bowl', 'ข้าวหน้าเนื้อแดงวากิวอาโซ'),
          blurb: L('The Aso specialty - grass-fed akaushi (red wagyu) seared and piled over rice with a soft egg. Eat whenever your number is called; the time here is a guess, not a booking.',
                   'ของขึ้นชื่ออาโซ - เนื้ออากาอุชิ (วากิวแดง) เลี้ยงปล่อย ย่างวางบนข้าวกับไข่ลวก - กินตอนที่เขาเรียกคิว เวลาตรงนี้เป็นแค่การเดา ไม่ใช่เวลาจอง'),
          refs: { map: 'https://maps.google.com/?q=Imakin+Shokudo+Aso', notes: L('Lunch only. DECISION POINT: if you have not been called by about 14:30, give up and eat elsewhere - the afternoon cannot absorb more than that without pushing Kusasenri past sunset and the ryokan check-in past 18:30.', 'เปิดเฉพาะมื้อเที่ยง - จุดตัดสินใจ: ถ้าถึงราว 14:30 แล้วยังไม่ถูกเรียก ให้ถอยไปกินร้านอื่น เพราะบ่ายรับต่อไม่ไหว จะดันคุซะเซนริเลยพระอาทิตย์ตกและเช็คอินเรียวกังเลย 18:30') } },

        { type: 'feature', time: '15:00', meridiem: 'Afternoon', kind: 'Sweets', imageId: 'a-d3-sweets',
          title: L('Aso Milk Factory', 'อาโซมิลค์แฟกตอรี'),
          place: L('Dairy soft cream - Aso grassland milk', 'ซอฟต์ครีมนมสด - นมทุ่งอาโซ'),
          blurb: L('Aso is grazing country - a thick, milky soft-serve and a bottle of fresh Aso milk, 1.1 km from Imakin. Pudding after the beef bowl, then straight on to the cones.',
                   'อาโซคือเมืองทุ่งเลี้ยงวัว - ซอฟต์ครีมนมสดเข้มข้นกับนมอาโซสดสักขวด ห่างจากอิมาคิงแค่ 1.1 กม. - กินเป็นของหวานต่อจากข้าวหน้าเนื้อ แล้วขับต่อขึ้นเขาเลย'),
          refs: { map: 'https://maps.google.com/?q=ASO+MILK+FACTORY+Aso',
                  parking: L('About 200 shared spaces with room for coaches - the easiest parking of the whole day. No fee is published and nothing suggests there is one.', 'ลานรวมราว 200 ช่อง รับรถบัสได้ - จอดง่ายที่สุดของทั้งวัน - ไม่มีข้อมูลว่าเก็บเงิน และไม่มีอะไรบ่งชี้ว่าต้องจ่าย'),
                  notes: L('This is ASO MILK FACTORY in Uchinomaki, NOT Aso Milk Farm in Nishihara village - that one is 20 km away on the far side of the caldera. A 20-minute stop, no more; the light is going.', 'ที่นี่คือ ASO MILK FACTORY ในอุจิโนมากิ ไม่ใช่ 阿蘇ミルク牧場 ที่หมู่บ้านนิชิฮาระ - อันนั้นอยู่ไกล 20 กม. คนละฝั่งปากปล่อง - แวะแค่ 20 นาทีพอ แสงกำลังจะหมด') } },

        { type: 'step', time: '15:55', meridiem: 'Afternoon', kind: 'Parking', icon: 'car',
          title: L('Park - Komezuka lower lot', 'จอดรถ - ลานล่างโคเมซึกะ'),
          place: L('Free, then a short walk up', 'ฟรี แล้วเดินขึ้นนิดหน่อย'),
          blurb: L('Free lot with about 45 spaces at the foot of the cone, then 5-10 minutes on foot up to the viewpoint. Do not chase the shoulder spots nearer the top - there are only a handful and they go early at weekends.',
                   'ลานฟรีราว 45 ช่องที่เชิงภูเขาไฟ แล้วเดินขึ้นจุดชมวิว 5-10 นาที - อย่าไปแย่งที่จอดริมไหล่ทางใกล้ยอด มีไม่กี่ช่องและเต็มเร็วช่วงเสาร์อาทิตย์'),
          refs: { map: 'https://maps.google.com/?q=Komezuka+Aso' } },

        { type: 'feature', time: '16:00', meridiem: 'Afternoon', kind: 'View', imageId: 'a-d2-komezuka',
          title: L('Komezuka Observatory', 'จุดชมวิวโคเมซึกะ'),
          place: L('The perfect grass cone', 'ภูเขาไฟลูกจิ๋วทรงสวย'),
          blurb: L('A textbook miniature volcano - a perfectly rounded grass cone with a scoop out of its top, said to be where a god took rice. By late November the grass has turned bleached gold, which suits it better than summer green.',
                   'ภูเขาไฟจิ๋วในตำรา - กรวยหญ้าทรงกลมสวยมีรอยเว้าตรงยอด เล่าว่าเทพเจ้าตักข้าวไป - ปลายพฤศจิกายนหญ้าเปลี่ยนเป็นสีทองซีด สวยกว่าสีเขียวหน้าร้อนอีก'),
          refs: { map: 'https://maps.google.com/?q=Komezuka+Aso' } },

        { type: 'step', time: '16:25', meridiem: 'Afternoon', kind: 'Parking', icon: 'car',
          title: L('Park - Kusasenri (paid)', 'จอดรถ - คุซะเซนริ (เสียเงิน)'),
          place: L('Pay on the way out', 'จ่ายตอนขาออก'),
          blurb: L('The last parking of the day and the only one with a real gate: ¥500 for a car. Your 8-seater counts as an ordinary passenger car, not a bus, so do not let anyone charge you ¥2,000. Unmanned since 2024 - a camera reads the plate and you pay as you leave. The meadow starts at the edge of the lot.',
                   'ที่จอดสุดท้ายของวัน และเป็นที่เดียวที่มีระบบเก็บเงินจริงจัง: รถยนต์ ¥500 - รถตู้ 8 ที่นั่งนับเป็นรถยนต์นั่งธรรมดา ไม่ใช่รถบัส อย่าให้ใครเก็บ ¥2,000 - ตั้งแต่ปี 2024 เป็นระบบไร้คนดูแล กล้องอ่านป้ายทะเบียนแล้วจ่ายตอนออก - ทุ่งหญ้าเริ่มตรงขอบลานจอดเลย'),
          refs: { map: 'https://maps.google.com/?q=Kusasenri+Aso',
                  booking: L('Car ¥500 (bus ¥2,000)', 'รถยนต์ ¥500 (รถบัส ¥2,000)') } },

        { type: 'feature', time: '16:30', meridiem: 'Afternoon', kind: 'Park', imageId: 'a-d3-kusasenri',
          title: L('Kusasenrigahama', 'คุซะเซนริกาฮามะ'),
          place: L('Grassland under the volcano', 'ทุ่งหญ้าใต้ภูเขาไฟ'),
          blurb: L('A wide meadow with twin crater ponds right under Nakadake - horses graze in summer; in late November it is pale gold kusa-momiji grass and silver susuki under a big sky. Landing here around 16:30 is lucky rather than late: sunset is about 17:20, and low sun through the susuki plumes is the best light of the day.',
                   'ทุ่งหญ้ากว้างมีบ่อปล่องคู่อยู่ใต้นากาดาเกะพอดี - หน้าร้อนมีม้าเล็มหญ้า - ปลายพฤศจิกายนเป็นทุ่งหญ้าสีทองซีดกับหญ้าซูซูกิสีเงินใต้ฟ้ากว้าง - มาถึงราว 16:30 ถือว่าโชคดีไม่ใช่สาย เพราะพระอาทิตย์ตกราว 17:20 แสงเย็นส่องผ่านปุยหญ้าซูซูกิคือแสงที่สวยที่สุดของวัน'),
          refs: { map: 'https://maps.google.com/?q=Kusasenri+Aso', official: 'https://www.aso-volcano.jp/',
                  notes: L('Leave by about 17:20 - Uchinomaki is only 25 minutes down the hill. The Nakadake crater road starts just above here but is shut - Aso went to eruption alert Level 3 on 14 Aug 2026, closing everything within 2 km of the crater. Kusasenri is outside that zone and open as normal. The level moves both ways, so if it drops back to 1 or 2 before you travel, the crater terminal is a short drive further up and you can add it back on the day.', 'ออกจากที่นี่ราว 17:20 - อุจิโนมากิลงเขาไปแค่ 25 นาที - ถนนขึ้นปล่องนากาดาเกะเริ่มเหนือจุดนี้ขึ้นไปนิดเดียว แต่ปิดอยู่ - อาโซขึ้นเป็นเตือนภัยระดับ 3 เมื่อ 14 ส.ค. 2026 ปิดทุกอย่างในรัศมี 2 กม. รอบปากปล่อง - ตัวคุซะเซนริอยู่นอกเขตนั้น เปิดปกติ - ระดับเตือนภัยขึ้นลงได้ ถ้าลดเหลือ 1 หรือ 2 ก่อนไป ปล่องอยู่ห่างจากตรงนี้ขึ้นไปแป๊บเดียว เพิ่มกลับเข้าโปรแกรมหน้างานได้เลย') } },

        { type: 'step', time: '17:45', meridiem: 'Evening', kind: 'Check-in', icon: 'bed',
          title: L('Check in - Aso Uchinomaki Onsen', 'เช็คอิน - อาโซ อุจิโนมากิออนเซน'),
          place: L('Yumeoisou - one night', 'ยูเมโออิโซ - หนึ่งคืน'),
          blurb: L('Straight down off the Panorama Line and you are there - about 25 minutes from Kusasenri, no detour, no mountain lanes in the dark. Uchinomaki is the biggest onsen town in the Aso area: 80 springs, 21 inns in the association, and enough restaurants that there is somewhere to go after dinner.',
                   'ลงจากพาโนรามาไลน์ก็ถึงเลย - ห่างจากคุซะเซนริราว 25 นาที ไม่ต้องอ้อม ไม่ต้องขับถนนภูเขาตอนมืด - อุจิโนมากิเป็นเมืองออนเซนที่ใหญ่ที่สุดในย่านอาโซ: มีบ่อน้ำแร่ 80 บ่อ เรียวกังในสมาคม 21 แห่ง และร้านอาหารมากพอที่จะมีที่ไปต่อหลังมื้อค่ำ'),
          refs: { map: 'https://maps.google.com/?q=Yumeoisou+Aso+Uchinomaki', official: 'https://yumeoisou.com/',
                  parking: L('100 free spaces across four lots, no booking needed - the easiest parking of any stay on the trip, and no narrow approach.', 'ที่จอดฟรี 100 คัน แบ่งเป็น 4 ลาน ไม่ต้องจอง - จอดง่ายที่สุดในบรรดาที่พักทั้งทริป และทางเข้าไม่แคบ'),
                  reservation: { time: '17:45', code: 'ASO-RYO', party: L('Night 2 - 1 night - to book', 'คืน 2 - 1 คืน - รอจอง') },
                  notes: L('NOT BOOKED YET, and still the most urgent booking of the trip: Mon 23 Nov is Labour Thanksgiving Day, so this is the Sunday of a three-day weekend in peak foliage season. Yumeoisou has the room type you need - its own site lists a 14/20-tatami large room for 6-10 people, so all five fit in one, plus rooms with a semi-open-air bath. Around 10-15 free private family baths (sources differ on the count, but they are free), and the buffet includes all-you-can-drink alcohol. Published band is around ¥10,000-15,000 per person with two meals, and promotional 5-in-a-room plans have gone as low as ¥9,800-10,800 - but those are NORMAL-season figures and this date is peak, so expect the top of the band or above. Alternatives in the same town: Aso Plaza Hotel, asoplaza.co.jp, more of a proper hotel with two of its own springs and a rooftop bath; or Aso Hotel, asohotel.jp/en, cheapest of the three but no room sleeps more than four.',
                           'ยังไม่จอง และยังเป็นคืนที่ต้องรีบที่สุดของทริป เพราะ 23 พ.ย. เป็นวันขอบคุณแรงงาน คืนนี้จึงเป็นวันอาทิตย์กลางวันหยุดยาว 3 วัน ตรงกับหน้าใบไม้เปลี่ยนสีพอดี - ยูเมโออิโซมีห้องแบบที่เราต้องการ เว็บทางการระบุห้องใหญ่ 14/20 เสื่อ นอนได้ 6-10 คน ทั้ง 5 คนอยู่ห้องเดียวได้ และมีห้องแบบมีอ่างกึ่งกลางแจ้งด้วย - มีบ่อแช่ส่วนตัวแบบครอบครัวฟรีราว 10-15 บ่อ (แหล่งข้อมูลบอกจำนวนไม่ตรงกัน แต่ฟรีแน่) และบุฟเฟ่ต์รวมเครื่องดื่มแอลกอฮอล์ไม่อั้น - ช่วงราคาที่ประกาศราว ¥10,000-15,000 ต่อคนพร้อมอาหาร 2 มื้อ และเคยมีแพลนโปรโมชั่นนอน 5 คน/ห้อง ต่ำถึง ¥9,800-10,800 - แต่ตัวเลขพวกนั้นเป็นราคาช่วงปกติ ส่วนวันนี้เป็นเรตพีค ให้เผื่อว่าจะอยู่ปลายบนของช่วงหรือสูงกว่า - ตัวเลือกอื่นในเมืองเดียวกัน: Aso Plaza Hotel (asoplaza.co.jp) เป็นโรงแรมเต็มตัวกว่า มีบ่อน้ำแร่ของตัวเอง 2 บ่อและออนเซนดาดฟ้า หรือ Aso Hotel (asohotel.jp/en) ถูกที่สุดในสามที่ แต่ห้องนอนได้ไม่เกิน 4 คน') } },

        { type: 'feature', time: '19:00', meridiem: 'Night', kind: 'Dining', imageId: 'a-d2-dinner',
          title: L('Aso akaushi dinner', 'มื้อค่ำเนื้ออาโซอากาอุชิ'),
          place: L('Yumeoisou buffet - drinks included', 'บุฟเฟ่ต์ยูเมโออิโซ - รวมเครื่องดื่ม'),
          blurb: L('Dinner at Yumeoisou is a buffet rather than a set kaiseki, and Aso akaushi is on it - the red wagyu raised on the caldera pastures, alongside sashimi shipped from Amakusa. The alcohol is all-you-can-drink and included, draught beer as well, which is worth knowing before anyone books a bar in town.',
                   'มื้อค่ำที่ยูเมโออิโซเป็นบุฟเฟ่ต์ ไม่ใช่ไคเซกิเซ็ต และมีเนื้ออาคาอุชิของอาโซ - วากิวแดงที่เลี้ยงบนทุ่งหญ้าปากปล่อง พร้อมซาชิมิส่งตรงจากอามาคุสะ - เครื่องดื่มแอลกอฮอล์ดื่มไม่อั้นรวมอยู่แล้ว มีเบียร์สดด้วย ควรรู้ไว้ก่อนจะไปจองบาร์ในเมือง'),
          refs: { map: 'https://maps.google.com/?q=Yumeoisou+Aso+Uchinomaki', official: 'https://yumeoisou.com/buffet/' } },

        { type: 'feature', time: '20:30', meridiem: 'Night', kind: 'Nightlife', imageId: 'a-d2-nightlife',
          title: L('A night out in Uchinomaki', 'ออกไปดื่มในเมืองอุจิโนมากิ'),
          place: L('Izakaya on the onsen-town street', 'ร้านเหล้าบนถนนเมืองออนเซน'),
          blurb: L('Uchinomaki is a real town, not a resort strip, so the drinking is small local izakaya rather than a bar scene - and it is all walkable from the inn. SHICHIFUKUJIN is the one the Aso City tourism association names: basashi, horse-liver sashimi, house-made karashi renkon and akaushi, with sake to go with it. OKAMOTO SAKE SHOP nearby stocks Aso-only sake, local ciders and its own liqueurs if you would rather carry something back to the room.',
                   'อุจิโนมากิเป็นเมืองจริงๆ ไม่ใช่ย่านรีสอร์ต การดื่มที่นี่จึงเป็นร้านเหล้าเล็กๆ ของคนท้องถิ่น ไม่ใช่ย่านบาร์ - และเดินจากที่พักได้หมด - ร้านที่สมาคมท่องเที่ยวเมืองอาโซแนะนำคือ SHICHIFUKUJIN (七福人): มีบะซาชิ ตับม้าดิบ คาราชิเรนคงทำเอง และเนื้ออาคาอุชิ กับสาเกดีๆ - ส่วน OKAMOTO SAKE SHOP (岡本酒店) ใกล้ๆ มีสาเทที่ซื้อได้เฉพาะที่อาโซ ไซเดอร์ท้องถิ่น และเหล้าสูตรของร้านเอง ถ้าอยากหิ้วกลับไปดื่มในห้อง'),
          refs: { map: 'https://maps.google.com/?q=%E4%B8%83%E7%A6%8F%E4%BA%BA%20%E9%98%BF%E8%98%87%E5%B8%82%E5%86%85%E7%89%A7', official: 'https://www.asocity-kanko.jp/gourmet_category/uchinomaki/',
                  notes: L('Two things to know. The buffet drinks are already included, so going out is for the atmosphere, not the cheaper beer - eat and drink at the inn first, then walk out for one. And this is a small country town: places are family-run, some shut on a Sunday, and last orders come early, so ask the front desk what is actually open tonight before you set off. There is a local guide to Uchinomaki after dark at flat-aso.com/night-gourmet.',
                           'มีสองเรื่องต้องรู้ - หนึ่ง บุฟเฟ่ต์รวมเครื่องดื่มอยู่แล้ว การออกไปข้างนอกจึงเป็นเรื่องบรรยากาศ ไม่ใช่เรื่องเบียร์ถูกกว่า - กินและดื่มที่ที่พักก่อน แล้วค่อยเดินออกไปสักแก้ว - สอง ที่นี่เป็นเมืองเล็กในชนบท ร้านเป็นแบบครอบครัว บางร้านปิดวันอาทิตย์ และรับออร์เดอร์สุดท้ายเร็ว ถามเคาน์เตอร์ที่พักก่อนว่าคืนนี้ร้านไหนเปิดจริง - มีไกด์ร้านกลางคืนของอุจิโนมากิที่ flat-aso.com/night-gourmet') } },

        { type: 'feature', time: '22:00', meridiem: 'Night', kind: 'View', imageId: 'a-d2-stars',
          title: L('Stars over the caldera', 'ดูดาวกลางปากปล่อง'),
          place: L('Walk back, look up', 'เดินกลับ แล้วแหงนหน้า'),
          blurb: L('Aso is one of the darkest skies in Kyushu and you are sleeping on the caldera floor with mountains blocking every city glow. Walk back from town, step away from the inn lights for a few minutes and let your eyes adjust. Clear late-autumn nights are the best of the year for it - and the coldest, so take a layer.',
                   'อาโซเป็นหนึ่งในที่ที่ฟ้ามืดที่สุดของคิวชู และคืนนี้เรานอนอยู่บนพื้นปากปล่องที่มีภูเขาบังแสงเมืองรอบด้าน - เดินกลับจากในเมือง เดินออกห่างไฟที่พักสักพัก แล้วรอให้ตาปรับ - คืนปลายฤดูใบไม้ร่วงที่ฟ้าใสคือช่วงที่ดีที่สุดของปี และหนาวที่สุดด้วย พกเสื้อกันหนาวไปด้วย'),
          refs: { map: 'https://maps.google.com/?q=Aso+Uchinomaki+Onsen',
                  notes: L('It drops to around 4 degrees overnight up here. If the inn baths are still open, the open-air one is the warm way to do this.', 'กลางคืนบนนี้ลงไปราว 4 องศา - ถ้าบ่อของที่พักยังเปิด แช่บ่อกลางแจ้งแล้วดูดาวเป็นวิธีที่อุ่นกว่า') } },
      ],
    },

        { type: 'step', time: '09:00', meridiem: 'Morning', kind: 'Transfer', icon: 'car',

                   'หนึ่งในเส้นทางขับรถที่สวยที่สุดของญี่ปุ่น - ออกจากปากปล่อง ผ่านเซโนโมโตะ ข้ามที่ราบสูงคุจูบนทุ่งภูเขาไฟลูกคลื่น แล้วลงสู่ชายฝั่งตะวันออก'),
          refs: { map: 'https://maps.google.com/?q=Yamanami+Highway',
                  notes: L('Optional detour: Takachiho Gorge, the best-timed foliage stop of the trip, peaking mid-to-late November with an evening light-up that runs to the end of the month. Starting from inside the caldera it is at least reachable - but it lies SOUTH while Beppu is north-east, so it means roughly 3 h of extra driving and giving up most of the Beppu day. Only if you are willing to trade the whole afternoon for it.', 'แวะเสริมได้: หุบเขาทาคาชิโฮะ เป็นจุดใบไม้เปลี่ยนสีที่ตรงช่วงที่สุดของทริป พีคกลางถึงปลายพฤศจิกายน มีไลต์อัพตอนเย็นถึงสิ้นเดือน - ออกจากในปากปล่องยังพอไปได้ - แต่มันอยู่ทางใต้ ส่วนเบปปุอยู่ทางตะวันออกเฉียงเหนือ แปลว่าขับเพิ่มราว 3 ชม. และต้องยอมทิ้งเวลาเบปปุเกือบทั้งวัน - เอาก็ต่อเมื่อยอมแลกทั้งบ่าย') } },

        { type: 'feature', time: '12:00', meridiem: 'Midday', kind: 'Dining', imageId: 'a-d5-lunch',

          blurb: L('Dango-jiru dumpling soup and local bento at a roadside station, near the Yufuin end of the Yamanami. Two hours from Aso is long enough that a proper break is welcome, and you will still reach Beppu around 11:00 - so eat here or push on and eat in Beppu, whichever the group wants.',
                   'ซุปดังโงะจิรุกับเบนโตะท้องถิ่นที่จุดพักรถ อยู่ปลายเส้นยามานามิฝั่งยูฟุอิน - ขับจากอาโซ 2 ชม. ถือว่านานพอที่จะอยากพักจริงๆ และยังถึงเบปปุราว 11:00 อยู่ดี - จะกินที่นี่หรือเลยไปกินที่เบปปุก็ได้ แล้วแต่กลุ่ม'),

        { type: 'feature', time: '13:30', meridiem: 'Afternoon', kind: 'View', imageId: 'a-d3-ropeway',
          title: L('Beppu Ropeway - Mt Tsurumi', 'กระเช้าเบปปุ - เขาสึรุมิ'),
          place: L('1,375 m summit - 10-min cable car', 'ยอดเขา 1,375 ม. - กระเช้า 10 นาที'),
          blurb: L('A 10-minute cable car up Mt Tsurumi for a panorama over Beppu Bay and the steaming town. Go for the view, not the leaves - the summit colours peak in late October and are finished by now; only the base station is still turning.',
                   'นั่งกระเช้า 10 นาทีขึ้นเขาสึรุมิ ชมวิวพาโนรามาอ่าวเบปปุและเมืองที่พ่นไอน้ำ - มาเพื่อวิว ไม่ใช่ใบไม้แดง - ยอดเขาพีคตั้งแต่ปลายตุลาคมและหมดแล้ว เหลือแค่แถวสถานีล่างที่ยังเปลี่ยนสีอยู่'),
          refs: { map: 'https://maps.google.com/?q=Beppu+Ropeway', official: 'https://www.beppu-ropeway.co.jp/',
                  parking: L('Free at the base station, reportedly around 200 spaces though the ropeway does not publish a number. The winter timetable starts 15 Nov (09:00-17:00, last car earlier) and 23 Nov is a holiday, so the queue for the cable car is more likely to cost you time than the parking.', 'จอดฟรีที่สถานีล่าง มีรายงานว่าราว 200 ช่อง แต่ทางกระเช้าไม่ได้ประกาศตัวเลข - ตารางฤดูหนาวเริ่ม 15 พ.ย. (09:00-17:00 เที่ยวสุดท้ายก่อนหน้านั้น) และ 23 พ.ย. เป็นวันหยุด คิวขึ้นกระเช้าน่าจะกินเวลามากกว่าการหาที่จอด'), booking: L('Round trip - ~¥1,800', 'ไป-กลับ - ~¥1,800') } },

        { type: 'feature', time: '14:30', meridiem: 'Afternoon', kind: 'View', imageId: 'a-d5-umijigoku',
          title: L('Umi Jigoku - the blue pond', 'อุมิจิโกกุ - บ่อฟ้า'),
          place: L('The cobalt-blue hell', 'บ่อนรกสีฟ้าโคบอลต์'),
          blurb: L('The prettiest of the Beppu hells - a steaming pond the colour of deep cobalt, hot enough to boil eggs. The one hell worth keeping.',
                   'สวยที่สุดในบรรดาบ่อนรกเบปปุ - บ่อพ่นไอน้ำสีฟ้าโคบอลต์เข้ม ร้อนพอต้มไข่ได้ - บ่อเดียวที่เก็บไว้'),
          refs: { map: 'https://maps.google.com/?q=Umi+Jigoku+Beppu', official: 'https://www.beppu-jigoku.com/',
                  parking: L('Free and included with admission - but each of the five Kannawa hells has its OWN lot rather than one shared one, so park at whichever you enter first and walk between them. If they are full, the city runs free public lots nearby (20, 45 and 20 spaces, 08:00-22:00) plus a paid 24-hour one at ¥100/hr.', 'จอดฟรี รวมอยู่ในค่าเข้า - แต่บ่อนรกทั้ง 5 แห่งย่านคันนาวะมีลานของใครของมัน ไม่ใช่ลานรวม จอดที่แห่งแรกที่เข้าแล้วเดินต่อ - ถ้าเต็ม เทศบาลมีลานสาธารณะฟรีใกล้ๆ (20, 45 และ 20 ช่อง เปิด 08:00-22:00) กับลานเสียเงินเปิด 24 ชม. ชม.ละ ¥100'), booking: L('Entry - ¥500 (single hell)', 'ค่าเข้า - ¥500 (บ่อเดียว)') } },

        { type: 'feature', time: '15:30', meridiem: 'Afternoon', kind: 'View', imageId: 'a-d3-monkey',
          title: L('Takasakiyama Monkey Park', 'สวนลิงทากาซากิยามะ'),
          place: L('~1,500 wild macaques', 'ลิงป่า ~1,500 ตัว'),

// -- reveal-on-scroll hook ----------------------------------------------
function useInView() {
  const ref = useRef(null);
  useEffect(() => {
    const el = ref.current;
    if (!el) return;
    const io = new IntersectionObserver(
      (entries) => entries.forEach((e) => { if (e.isIntersecting) el.classList.add('in'); }),
      { threshold: 0.16 }
    );
    io.observe(el);
    return () => io.disconnect();
  }, []);
  return ref;
}

  return window.KONBINI.areas.find((ar) => {
    const nums = (ar.days.en.match(/\d+/g) || []).map(Number);
    if (nums.length === 1) return nums[0] === n;
    if (nums.length >= 2) return n >= nums[0] && n <= nums[nums.length - 1];
    return false;
  }) || null;
}

// -- Clock - live dual-timezone (home <-> Japan), updates every second -----
function useNow() {
  const [now, setNow] = useState(() => new Date());
  useEffect(() => {
    const id = setInterval(() => setNow(new Date()), 1000);
    return () => clearInterval(id);
  }, []);
  return now;
}
function fmtTime(date, tz) {
  try {
    return new Intl.DateTimeFormat('en-GB', { hour: '2-digit', minute: '2-digit', second: '2-digit', hour12: false, timeZone: tz }).format(date);
  } catch (e) { return '--:--:--'; }
}
// Trip date range from the itinerary days, e.g. "21-29 Nov 2026" (take the part after "-")
function tripDateRange(x) {
  const days = (window.TRIP && window.TRIP.days) || [];
  if (!days.length) return '';
  const part = (d) => x(d.date).split('-').pop().trim();
  const a = part(days[0]), b = part(days[days.length - 1]);
  const am = a.replace(/^\d+\s*/, ''), bm = b.replace(/^\d+\s*/, '');
  const ad = (a.match(/^\d+/) || [''])[0], bd = (b.match(/^\d+/) || [''])[0];
  return am === bm ? (ad + '-' + bd + ' ' + bm) : (a.replace(/\s*\d{4}$/, '') + ' - ' + b);
}

function Clock({ variant = 'chrome' }) {
  const { x } = useT();
  const now = useNow();
  const jp = fmtTime(now, 'Asia/Tokyo');
  const bkk = fmtTime(now, 'Asia/Bangkok');
  if (variant === 'chrome') {
    const dateStr = now.toLocaleDateString('en-GB', { timeZone: 'Asia/Tokyo', day: 'numeric', month: 'short', year: 'numeric' });
    const jpHM = jp.split(':').slice(0, 2).join(':');
    return (

// -- RouteMap - animated multi-city route on the Overview screen ---------
function RouteMap({ route, onJump }) {
  const { x } = useT();
  const ref = useInView();
  // draw the route as a clean closed loop: order stops by angle around their centroid (no crossings)
  const cx = route.reduce((a, s) => a + s.mx, 0) / route.length;
  const cy = route.reduce((a, s) => a + s.my, 0) / route.length;
  const ring = route.slice().sort((a, b) => Math.atan2(a.my - cy, a.mx - cx) - Math.atan2(b.my - cy, b.mx - cx));
  const startAt = Math.max(0, ring.findIndex((s) => s.day === 0));
  const loop = ring.slice(startAt).concat(ring.slice(0, startAt));
  const d = loop.map((s, i) => (i === 0 ? 'M' : 'L') + s.mx + ',' + (s.my * 1.35).toFixed(2)).join(' ') + ' Z';
  return (
    <div className="jmap" ref={ref}>
      <div className="jmap-base">
        <svg className="jmap-geo" viewBox="0 0 100 135.1" preserveAspectRatio="none" aria-hidden="true">
          <path className="jmap-land" d={KYUSHU_GEO} />
        </svg>
        <span className="jmap-veil" aria-hidden="true"></span>
      </div>
      <svg className="jmap-svg" viewBox="0 0 100 135" preserveAspectRatio="none" aria-hidden="true">
        <path id="jmapRoute" className="jmap-path" d={d} pathLength="100" fill="none" />
        <circle className="jmap-comet" r="1.7">
          <animateMotion dur="6.5s" repeatCount="indefinite" calcMode="linear" rotate="0">
            <mpath href="#jmapRoute" />
          </animateMotion>
        </circle>
      </svg>
      {route.map((s, i) => (
        <button className={'jmap-node' + (s.day === 0 ? ' is-start' : '')} key={i} style={{ left: s.mx + '%', top: s.my + '%', '--i': i }}
          onClick={() => onJump(s.day)} aria-label={x(s.city)}>
          {s.day === 0 ? <span className="jmap-flag">{x({ en: 'Start \u00b7 End', th: '\u0e40\u0e23\u0e34\u0e48\u0e21 \u00b7 \u0e08\u0e1a' })}</span> : null}
          <span className="jmap-pin" aria-hidden="true"></span>
          <span className="jmap-label">
            <span className="jmap-city">{x(s.city)}</span>
            <span className="jmap-days">{x(s.days)}</span>
          </span>
        </button>
      ))}
    </div>
  );
}

// -- Travelers - the party grid ------------------------------------------
function Travelers({ data }) {
  const { x } = useT();
  const ref = useInView();
  const telHref = (p) => 'tel:' + p.replace(/[^+\d]/g, '');
  return (
    <section className="party" ref={ref}>
      <div className="party-head">
        <span className="ov-kicker">{x(data.subtitle)}</span>

          <article className="trav" key={i} style={{ '--i': i }}>

}

function Budget({ data }) {

      <div className="party-head">

          <div className="bud-row" key={i} style={{ '--i': i, '--p': (it.amount / max) }}>

  );
}

function DayNav({ days, current, onSelect, onHome, onBookings, onPhrases, onEmergency, lang, onLang }) {
  const { x } = useT();
  const railRef = useRef(null);
  // keep the active day chip in view as days change
  useEffect(() => {
    const rail = railRef.current;
    if (!rail) return;
    const active = rail.querySelector('.chrome-day.active');
    if (active) {
      const target = active.offsetLeft - rail.clientWidth / 2 + active.clientWidth / 2;
      rail.scrollTo({ left: Math.max(0, target), behavior: 'smooth' });
    }
  }, [current]);
  // short date for each chip, e.g. "14 Nov" - derived from the localized date string
  const shortDate = (d) => {
    const s = x(d.date);
    const m = s.match(/(\d{1,2})\s+([^\s-]+)/);

            <span className="chrome-now-date">{x(days[current].date)}</span>
          </span>
          <NowLine />
        </div>
        <span className="chrome-spacer" aria-hidden="true"></span>
      </div>

      <nav className="chrome-days" ref={railRef}>
        {days.map((d, i) => (
          <button
            key={d.label}
            className={'chrome-day' + (i === current ? ' active' : '')}
            onClick={() => onSelect(i)}
          >
            <span className="chrome-day-num">{String(i + 1).padStart(2, '0')}</span>
            <span className="chrome-day-info">
              <span className="chrome-day-name">{x(d.title)}</span>
              <span className="chrome-day-date">{shortDate(d)}</span>

          </button>
        ))}
      </nav>

  );
}

const BK_CATS = [
  { key: 'flight',  icon: 'plane', label: { en: 'Flights',        th: 'เที่ยวบิน' } },
  { key: 'stay',    icon: 'bed',   label: { en: 'Stays',          th: 'ที่พัก' } },
  { key: 'transit', icon: 'train', label: { en: 'Rail & Transit', th: 'รถไฟและการเดินทาง' } },
  { key: 'dining',  icon: 'bowl',  label: { en: 'Dining',         th: 'ร้านอาหาร' } },
];

function bkCategory(a) {
  const k = (a.kind || '').toLowerCase();
  if (k === 'flight' || k === 'departure' || a.icon === 'plane') return 'flight';
  if (k === 'check-in' || k === 'onsen') return 'stay';
  if (['train', 'shinkansen', 'journey', 'ferry', 'bus', 'transfer'].includes(k) || a.icon === 'train' || a.icon === 'car') return 'transit';
  if (['dining', 'coffee'].includes(k)) return 'dining';
  return 'entry';
}

function bkShortDate(dateObj, lang) {
  const s = window.tx(dateObj, lang);
  const m = s.match(/(\d{1,2})\s+([^\s-]+)/);
  return m ? m[1] + ' ' + m[2].slice(0, 3) : '';
}

function collectBookings(trip) {
  const reservations = [];
  const passes = [];
  trip.days.forEach((d, di) => {
    d.activities.forEach((a) => {
      if (!a.refs) return;
      if (a.refs.reservation) reservations.push({ a, di, day: d, cat: bkCategory(a) });
      else if (a.refs.booking) passes.push({ a, di, day: d });
    });
  });
  return { reservations, passes };
}

function BookingsList({ trip, lang }) {

// -- Expenses - shared-trip spending log (÷4) ----------------------------
function Expenses() {
  const { x } = useT();
  const [items, setItems] = useState(() => {
    try { return JSON.parse(localStorage.getItem('jp-expenses') || '[]'); } catch (e) { return []; }
  });
  const [amt, setAmt] = useState('');
  const [note, setNote] = useState('');
  const save = (list) => { setItems(list); try { localStorage.setItem('jp-expenses', JSON.stringify(list)); } catch (e) {} };
  const add = () => {
    const a = parseFloat((amt || '').toString().replace(/,/g, ''));
    if (!a || a <= 0) return;
    save([{ id: 'e' + Date.now(), a, n: (note || '').trim() || '-' }, ...items]);
    setAmt(''); setNote('');
  };
  const remove = (id) => save(items.filter((it) => it.id !== id));
  const total = items.reduce((s, it) => s + it.a, 0);
  const per = total / 4;
  const fmt = (v) => '฿' + v.toLocaleString('en-US', { maximumFractionDigits: 0 });
  return (
    <section className="party exp">
      <div className="party-head">
        <span className="ov-kicker">{x({ en: 'Expenses', th: 'ค่าใช้จ่าย', ja: '支出' })}</span>
        <h2 className="ov-h2">{x({ en: 'Trip spending', th: 'บันทึกค่าใช้จ่าย', ja: '支出メモ' })}</h2>
      </div>
      <div className="exp-totals">
        <div className="exp-tot"><span className="exp-tot-k">{x({ en: 'Total', th: 'รวมทั้งหมด', ja: '合計' })}</span><span className="exp-tot-v">{fmt(total)}</span></div>
        <div className="exp-tot exp-tot-split"><span className="exp-tot-k">{x({ en: 'Each ÷ 4', th: 'หาร 4 คน', ja: '1人 ÷4' })}</span><span className="exp-tot-v">{fmt(per)}</span></div>
      </div>
      <div className="exp-add">
        <input className="exp-in exp-amt" type="number" inputMode="numeric" placeholder="฿0" value={amt} onChange={(e) => setAmt(e.target.value)} aria-label="Amount" />
        <input className="exp-in exp-note" type="text" placeholder={x({ en: 'What for?', th: 'ค่าอะไร?', ja: '何に?' })} value={note} onChange={(e) => setNote(e.target.value)} onKeyDown={(e) => { if (e.key === 'Enter') add(); }} aria-label="Note" />
        <button className="exp-add-btn" onClick={add} aria-label="Add"><Icon name="plus" size={17} stroke={2} /></button>
      </div>
      {items.length ? (
        <ul className="exp-list">
          {items.map((it) => (
            <li className="exp-row" key={it.id}>
              <span className="exp-row-n">{it.n}</span>
              <span className="exp-row-a">{fmt(it.a)}</span>
              <button className="exp-row-x" onClick={() => remove(it.id)} aria-label="Remove"><Icon name="close" size={13} stroke={2} /></button>
            </li>
          ))}
        </ul>
      ) : (
        <p className="exp-empty">{x({ en: 'No expenses yet - add one above.', th: 'ยังไม่มีรายการ - เพิ่มด้านบนได้เลย', ja: 'まだ記録なし' })}</p>
      )}
    </section>
  );
}

  const [label, setLabel] = useState('');
  const [payers, setPayers] = useState(() => names.map((_, i) => i));

  const yenOf = (it) => it.cur === 'jpy' ? it.amt : it.amt / THB_PER_YEN;
  const thbOf = (it) => it.cur === 'thb' ? it.amt : it.amt * THB_PER_YEN;
  const fmtY = (v) => '¥' + Math.round(v).toLocaleString('en-US');
  const fmtB = (v) => '฿' + Math.round(v).toLocaleString('en-US');

  const togglePayer = (i) => setPayers((p) => p.includes(i) ? p.filter((k) => k !== i) : [...p, i].sort((a, b) => a - b));
  const add = () => {
    const a = parseFloat((amt || '').toString().replace(/,/g, ''));
    if (!a || a <= 0 || !payers.length) return;
    save([{ id: 'w' + Date.now(), amt: a, cur, label: (label || '').trim() || x({ en: 'Expense', th: 'รายการ', ja: '支出' }), payers: [...payers] }, ...items]);
    setAmt(''); setLabel('');
  };
  const remove = (id) => save(items.filter((it) => it.id !== id));

  const perPersonYen = names.map((_, i) => items.reduce((s, it) => s + (it.payers.includes(i) ? yenOf(it) / it.payers.length : 0), 0));
  const totalYen = items.reduce((s, it) => s + yenOf(it), 0);

  return (
    <div className="bookings">
      <Chrome onHome={onHome} />
      <main className="bk-stage">
        <section className="bk-hero">
          <span className="ov-kicker">{x({ en: 'Money', th: 'การเงิน', ja: 'お金' })}</span>
          <h1 className="bk-h1">{x({ en: 'Expenses', th: 'บันทึกรายจ่าย', ja: '費用' })}</h1>
          <p className="bk-lede">{x({
            en: 'Log spending in yen or baht, tag who shares it, and see each person\'s split - in both currencies.',
            th: 'บันทึกค่าใช้จ่ายเป็นเยนหรือบาท เลือกคนที่หารด้วย แล้วดูส่วนแบ่งของแต่ละคน - ทั้งสองสกุลเงิน',
            ja: '円かバーツで記録し、割り勘する人を選ぶと各自の負担がわかります。',
          })}</p>
        </section>
        <div className="bk-section wallet">
          <Converter />

          {names.length ? (
            <section className="party wal-sum">
              <div className="party-head"><span className="ov-kicker">{x({ en: 'Who owes what', th: 'ใครจ่ายเท่าไหร่', ja: '各自の負担' })}</span><h2 className="ov-h2">{x({ en: 'Per person', th: 'สรุปรายคน', ja: '一人ずつ' })}</h2></div>
              <div className="wal-people">
                {names.map((n, i) => (
                  <div className="wal-person" key={i}>
                    <span className="wal-person-name">{n}</span>
                    <span className="wal-person-thb">{fmtB(perPersonYen[i] * THB_PER_YEN)}</span>
                    <span className="wal-person-yen">{fmtY(perPersonYen[i])}</span>
                  </div>
                ))}
              </div>
              <div className="wal-total"><span>{x({ en: 'Trip total', th: 'รวมทั้งทริป', ja: '合計' })}</span><b>{fmtB(totalYen * THB_PER_YEN)} - {fmtY(totalYen)}</b></div>
            </section>
          ) : null}

          <section className="party wal-add-wrap">
            <div className="party-head"><span className="ov-kicker">{x({ en: 'Add', th: 'เพิ่ม', ja: '追加' })}</span><h2 className="ov-h2">{x({ en: 'New expense', th: 'รายการใหม่', ja: '新規' })}</h2></div>
            <div className="wal-cur-toggle">
              <button className={'wal-cur' + (cur === 'jpy' ? ' on' : '')} onClick={() => setCur('jpy')}>¥ {x({ en: 'Yen', th: 'เยน', ja: '円' })}</button>
              <button className={'wal-cur' + (cur === 'thb' ? ' on' : '')} onClick={() => setCur('thb')}>฿ {x({ en: 'Baht', th: 'บาท', ja: 'バーツ' })}</button>
            </div>
            <div className="wal-add">
              <input className="exp-in wal-amt" type="number" inputMode="numeric" placeholder={cur === 'jpy' ? '¥0' : '฿0'} value={amt} onChange={(e) => setAmt(e.target.value)} aria-label="Amount" />
              <input className="exp-in wal-label" type="text" placeholder={x({ en: 'What for?', th: 'ค่าอะไร?', ja: '何に?' })} value={label} onChange={(e) => setLabel(e.target.value)} onKeyDown={(e) => { if (e.key === 'Enter') add(); }} aria-label="Label" />
            </div>
            <div className="wal-payers">
              <span className="wal-payers-lb">{x({ en: 'Split between', th: 'หารกับใคร', ja: '割り勘する人' })}</span>
              <div className="wal-payer-chips">
                {names.map((n, i) => (
                  <button key={i} className={'wal-payer' + (payers.includes(i) ? ' on' : '')} onClick={() => togglePayer(i)} aria-pressed={payers.includes(i)}>{n}</button>
                ))}
              </div>
            </div>
            <button className="wal-add-btn" onClick={add}><Icon name="plus" size={16} stroke={2.2} /><span>{x({ en: 'Add expense', th: 'เพิ่มรายการ', ja: '追加' })}</span></button>
          </section>

          {items.length ? (
            <section className="party wal-list-wrap">
              <div className="party-head"><span className="ov-kicker">{x({ en: 'Log', th: 'รายการ', ja: '記録' })}</span><h2 className="ov-h2">{x({ en: 'All expenses', th: 'ทั้งหมด', ja: '一覧' })}</h2></div>
              <ul className="wal-list">
                {items.map((it) => (
                  <li className="wal-item" key={it.id}>
                    <div className="wal-item-top">
                      <span className="wal-item-label">{it.label}</span>
                      <span className="wal-item-amt">{fmtB(thbOf(it))}<span className="wal-item-yen"> - {fmtY(yenOf(it))}</span></span>
                      <button className="exp-row-x" onClick={() => remove(it.id)} aria-label="Remove"><Icon name="close" size={13} stroke={2} /></button>
                    </div>
                    <div className="wal-item-payers">
                      {it.payers.map((pi) => (
                        <span className="wal-item-payer" key={pi}>{names[pi] || '?'} <b>{fmtB(thbOf(it) / it.payers.length)}</b></span>
                      ))}
                    </div>
                  </li>
                ))}
              </ul>
            </section>
          ) : null}
        </div>
        <div className="ov-credit"><span className="ov-credit-rule" aria-hidden="true"></span><span className="ov-credit-text">{x(window.CREDIT)}</span></div>
      </main>
    </div>
  );
}

// -- More - hub linking Guides, Party, Emergency, Settings ---------------
function MorePage({ onHome, onSettings, onGuides, onEmergency, lang }) {
  const { x } = useT();
  const links = [
    { icon: 'gear', title: { en: 'Settings', th: 'ตั้งค่า', ja: '設定' }, desc: { en: 'Language - theme', th: 'ภาษา - ธีม', ja: '言語・テーマ' }, on: onSettings },
    { icon: 'globe', title: { en: 'Tips & Guides', th: 'คำแนะนำต่างๆ', ja: 'ガイド' }, desc: { en: 'Driving - phrases - etiquette', th: 'ขับรถ - ประโยค - มารยาท', ja: '運転・会話・マナー' }, on: onGuides },
    { icon: 'alert', title: { en: 'Emergency', th: 'เบอร์ติดต่อฉุกเฉิน', ja: '緊急連絡先' }, desc: { en: 'Police - ambulance - embassy', th: 'ตำรวจ - รถพยาบาล - สถานทูต', ja: '警察・救急・大使館' }, on: onEmergency, urgent: true },
  ];
  return (
    <div className="bookings">
      <Chrome onHome={onHome} />
      <main className="bk-stage">
        <section className="bk-hero">
          <span className="ov-kicker">{x({ en: 'Menu', th: 'เมนู', ja: 'メニュー' })}</span>
          <h1 className="bk-h1">{x({ en: 'More', th: 'อื่นๆ', ja: 'その他' })}</h1>
        </section>
        <div className="bk-section">
          <div className="more-list">
            {links.map((l, i) => (
              <button key={i} className={'more-link' + (l.urgent ? ' more-urgent' : '')} onClick={l.on} style={{ '--i': i }}>
                <span className="more-ic"><Icon name={l.icon} size={20} stroke={1.4} /></span>
                <span className="more-body">
                  <span className="more-title">{x(l.title)}</span>
                  <span className="more-desc">{x(l.desc)}</span>
                </span>
                <span className="more-go"><Icon name="chevronRight" size={18} stroke={1.6} /></span>
              </button>
            ))}
          </div>
        </div>
        <div className="ov-credit"><span className="ov-credit-rule" aria-hidden="true"></span><span className="ov-credit-text">{x(window.CREDIT)}</span></div>
      </main>
    </div>
  );
}

// -- Emergency - full page of contacts (reached from "More") -------------
function EmergencyPage({ onHome, onMore, lang }) {
  const { x } = useT();
  const data = window.EMERGENCY;
  const telHref = (v) => 'tel:' + v.replace(/[^+\d]/g, '');
  return (

      <Chrome onHome={onHome} onBack={onMore} />
      <main className="bk-stage">

          <span className="ov-kicker ov-kicker-alert">{x(data.subtitle)}</span>
          <h1 className="bk-h1">{x(data.title)}</h1>
        </section>
        <div className="bk-section">
          <div className="emg-page-grid">
            {data.items.map((it, i) => (
              <a className={'emg' + (it.urgent ? ' emg-urgent' : '')} key={i} href={telHref(it.value)} style={{ '--i': i }}>
                <span className="emg-ic"><Icon name={it.icon} size={18} stroke={1.4} /></span>
                <span className="emg-text">
                  <span className="emg-label">{x(it.label)}</span>
                  <span className="emg-value mono">{it.value}</span>
                </span>
                <span className="emg-go"><Icon name="phone" size={15} stroke={1.5} /></span>
              </a>
            ))}
          </div>
        </div>
        <div className="ov-credit">
          <span className="ov-credit-rule" aria-hidden="true"></span>
          <span className="ov-credit-text">{x(window.CREDIT)}</span>
        </div>
      </main>
    </div>
  );
}

Object.assign(window, {
  LangCtx, useT, LangToggle, ImageFrame, ReferenceDock,
  ActivityBlock, Timeline, Cover, DayNav, ActivityDetail,
  Clock, RouteMap, Travelers, Overview, Emergency, Budget, Bookings,
  Konbini, EmergencySheet, DayKonbini, OvEssentials, DayWeather, MobileTabBar,
  Packing, Phrases, SettingsPage,
  BookingsList, Converter, Expenses, MoneyTools, DrivingTips, VisitJapanBox,
  Chrome, GuidesPage, WalletPage, MorePage, ChecklistPage, EmergencyPage,
});
</script>
  <script type="text/babel">
// app.jsx - composition root: state, transitions, language, tweaks, embed params.
const FONT_STACKS = {
  trirong: '"Trirong", "Sukhumvit Set", "IBM Plex Sans Thai", Georgia, serif',
  sukhumvit: '"Sukhumvit Set", "IBM Plex Sans Thai", "Hanken Grotesk", system-ui, sans-serif',
  notoserif: '"Noto Serif Thai", "Trirong", Georgia, serif',
};

const TWEAK_DEFAULTS = /*EDITMODE-BEGIN*/{
  "display": "sukhumvit",
  "typeScale": 100,
  "density": "calm",
  "showImages": true,
  "motion": true
}/*EDITMODE-END*/;

const Q = new URLSearchParams(
  (typeof window !== 'undefined' && window.__EMBED) ? window.__EMBED : location.search.slice(1)
);
const PARAM = {
  view: Q.get('view'),
  day: parseInt(Q.get('day') || '0', 10),
  detail: Q.get('detail') != null ? parseInt(Q.get('detail'), 10) : null,
  theme: Q.get('theme'),
  display: Q.get('display'),
  density: Q.get('density'),
  scale: Q.get('scale') ? parseInt(Q.get('scale'), 10) : null,
  lang: Q.get('lang'),
  embed: Q.get('embed') === '1',
  flow: Q.get('flow') === '1',
};

function initialTweaks() {
  const t = { ...TWEAK_DEFAULTS };
  if (PARAM.display) t.display = PARAM.display;
  if (PARAM.density) t.density = PARAM.density;
  if (PARAM.scale) t.typeScale = PARAM.scale;
  return t;
}

function readLang() {
  if (PARAM.lang === 'th' || PARAM.lang === 'en' || PARAM.lang === 'ja') return PARAM.lang;
  try { const s = localStorage.getItem('lookbook-lang'); if (s) return s; } catch (e) {}
  return 'th';
}

function readMode() {
  try { const s = localStorage.getItem('lookbook-mode'); if (s) return s; } catch (e) {}
  return 'dark';
}

// has the user already tapped "Begin the journey" once? (then skip the overview on launch)
function readBegan() {
  try { return localStorage.getItem('lookbook-began') === 'yes'; } catch (e) { return false; }
}

// which day index does today fall on: before the trip -> 0, after -> last, during -> that day
function computeTodayDay() {
  const today = new Date(); today.setHours(0, 0, 0, 0);
  const dates = TRIP.days.map((d) => {
    const s = (d && d.date && d.date.en) || '';
    const m = s.match(/(\d{1,2})\s+([A-Za-z]{3,})\s+(\d{4})/);
    if (!m) return null;
    const dt = new Date(m[2] + ' ' + m[1] + ' ' + m[3]);
    return isNaN(dt.getTime()) ? null : dt;
  });
  let target = 0;
  const first = dates.find(Boolean);
  const last = [...dates].reverse().find(Boolean);
  if (first && today < first) target = 0;
  else if (last && today > last) target = TRIP.days.length - 1;
  else {
    for (let i = dates.length - 1; i >= 0; i--) {
      if (dates[i] && today >= dates[i]) { target = i; break; }
    }
  }
  return target;
}

function App() {
  const [t, setTweak] = useTweaks(initialTweaks());
  const [lang, setLang] = React.useState(readLang());
  const began = PARAM.view !== 'day' && readBegan();
  const [view, setView] = React.useState((PARAM.view === 'day' || began) ? 'itinerary' : 'overview');
  const [day, setDay] = React.useState(PARAM.view === 'day' ? PARAM.day : (began ? computeTodayDay() : 0));
  const [dayKey, setDayKey] = React.useState(0);
  const [detail, setDetail] = React.useState(
    PARAM.detail != null ? TRIP.days[PARAM.day || 0].activities[PARAM.detail] : null
  );
  const [emgOpen, setEmgOpen] = React.useState(false);
  const scrollRef = React.useRef(null);

  const changeLang = (l) => { setLang(l); try { localStorage.setItem('lookbook-lang', l); } catch (e) {} };

  const [mode, setMode] = React.useState(readMode());
  const changeMode = (m) => { setMode(m); try { localStorage.setItem('lookbook-mode', m); } catch (e) {} };
  const [sysDark, setSysDark] = React.useState(() => {
    try { return window.matchMedia('(prefers-color-scheme: dark)').matches; } catch (e) { return true; }
  });
  React.useEffect(() => {
    let mq;
    try { mq = window.matchMedia('(prefers-color-scheme: dark)'); } catch (e) { return; }
    const on = (e) => setSysDark(e.matches);
    mq.addEventListener ? mq.addEventListener('change', on) : mq.addListener(on);
    return () => { mq.removeEventListener ? mq.removeEventListener('change', on) : mq.removeListener(on); };
  }, []);
  const resolvedMode = mode === 'system' ? (sysDark ? 'dark' : 'light') : mode;

  React.useEffect(() => { if (window.__hideSplash) window.__hideSplash(); }, []);

  React.useEffect(() => {
    if (!PARAM.flow) return;
    const post = () => window.parent.postMessage(
      { type: 'lookbook-height', name: window.name, h: document.documentElement.scrollHeight }, '*');
    post();
    const ro = new ResizeObserver(post);
    ro.observe(document.documentElement);
    window.addEventListener('load', post);
    const iv = setInterval(post, 400);
    const stop = setTimeout(() => clearInterval(iv), 5000);
    return () => { ro.disconnect(); clearInterval(iv); clearTimeout(stop); };
  }, [day, view, lang]);

  const rootStyle = {
    '--serif': FONT_STACKS[t.display] || FONT_STACKS.trirong,
    '--scale': (t.typeScale || 100) / 100,
  };

  const begin = () => { setView('itinerary'); };
  // "Begin the journey" - jump to today's day: before the trip -> first day,
  // after it -> last day, during it -> the matching day.
  const beginJourney = () => {
    try { localStorage.setItem('lookbook-began', 'yes'); } catch (e) {}
    setDay(computeTodayDay()); setDayKey((k) => k + 1); setView('itinerary');
  };
  const home = () => { setDetail(null); setView('overview'); };
  const openBookings = () => { setDetail(null); setView('bookings'); };
  const openChecklist = () => { setDetail(null); setView('checklist'); };
  const openWallet = () => { setDetail(null); setView('wallet'); };
  const openMore = () => { setDetail(null); setView('more'); };
  const openGuides = () => { setDetail(null); setView('guides'); };
  const openSettings = () => { setDetail(null); setView('settings'); };
  const openEmergency = () => { setDetail(null); setView('emergency'); };
  const openPhrases = openGuides;
  const ovTop = () => { const s = document.querySelector('.ov-stage'); if (s) s.scrollTo({ top: 0, behavior: 'smooth' }); };
  const jumpTo = (i) => { setDay(i); setDayKey((k) => k + 1); setView('itinerary'); };
  const selectDay = (i) => {
    if (i === day) return;
    setDay(i);
    setDayKey((k) => k + 1);
    if (scrollRef.current) scrollRef.current.scrollTo({ top: 0, behavior: 'auto' });
  };

  const cls = ['lookbook', 'density-' + t.density, 'lang-' + lang];
  if (!t.showImages) cls.push('no-images');
  if (!t.motion) cls.push('no-bgfx');
  if (PARAM.embed) cls.push('embed', 'no-anim');
  if (PARAM.flow) cls.push('flow');

  // Cover & overview borrow Day 1's palette; itinerary uses the active day's.
  const activeTheme = PARAM.theme || (view === 'itinerary' ? TRIP.days[day].theme : TRIP.days[0].theme);

  // Paint the page CANVAS (html/body) with the active theme's --paper so the iOS
  // home-indicator strip - which shows the canvas background, NOT any fixed layer -
  // matches the content instead of leaving a dark dead-zone band.
  React.useEffect(() => {
    const lb = document.querySelector('.lookbook');
    if (!lb) return;
    const paper = getComputedStyle(lb).getPropertyValue('--paper').trim();
    if (!paper) return;
    document.documentElement.style.backgroundColor = paper;
    document.body.style.backgroundColor = paper;
    const meta = document.querySelector('meta[name="theme-color"]');
    if (meta) meta.setAttribute('content', paper);
  }, [activeTheme, resolvedMode]);

  // Page-swap direction: deeper views (the More sub-pages) slide IN from the right;
  // navigating back (shallower) slides in from the left. Depth drives the direction.
  const VIEW_DEPTH = { overview: 0, itinerary: 1, bookings: 1, checklist: 1, wallet: 1, more: 1, guides: 2, settings: 2, emergency: 2 };
  const depthOf = (v) => (Object.prototype.hasOwnProperty.call(VIEW_DEPTH, v) ? VIEW_DEPTH[v] : 1);
  const prevViewRef = React.useRef(view);
  const dCur = depthOf(view), dPrev = depthOf(prevViewRef.current);
  // Slide ONLY the "More" sub-pages (depth 2): entering one slides in from the right, going back
  // from the left. Plain bottom-tab switches (depth 0/1) stay instant - no slide.
  const navDir = (dCur < 2 && dPrev < 2) ? 'none' : (dCur >= dPrev ? 'fwd' : 'back');
  React.useEffect(() => { prevViewRef.current = view; }, [view]);

  return (
    <LangCtx.Provider value={lang}>
      <div className={cls.join(' ')} data-theme={activeTheme} data-mode={resolvedMode} data-lang={lang} style={rootStyle}>
        <div className="bg-fx" aria-hidden="true">
          <span className="orb orb-1"></span>
          <span className="orb orb-2"></span>
          <span className="orb orb-3"></span>
          <span className="bg-grain"></span>
        </div>
        <div className={'view-swap swap-' + navDir} key={view}>
        {view === 'overview' ? (
          <div className="view-overview">
            <Overview trip={TRIP} dest={DESTINATION} travelers={TRAVELERS}
              onBegin={beginJourney} onJump={jumpTo} onHome={ovTop} onBookings={openBookings} onPhrases={openPhrases} onEmergency={openEmergency}
              lang={lang} onLang={changeLang} />
          </div>
        ) : view === 'bookings' ? (
          <div className="view-bookings">
            <Bookings trip={TRIP} onHome={home} lang={lang} />
          </div>
        ) : view === 'checklist' ? (
          <div className="view-checklist">
            <ChecklistPage onHome={home} lang={lang} />
          </div>
        ) : view === 'wallet' ? (
          <div className="view-wallet">
            <WalletPage onHome={home} lang={lang} />
          </div>
        ) : view === 'more' ? (
          <div className="view-more">
            <MorePage onHome={home} onSettings={openSettings} onGuides={openGuides} onEmergency={openEmergency} lang={lang} />
          </div>
        ) : view === 'guides' ? (
          <div className="view-guides">
            <GuidesPage onHome={home} onMore={openMore} lang={lang} />
          </div>
        ) : view === 'settings' ? (
          <div className="view-settings">
            <SettingsPage onHome={home} onMore={openMore} lang={lang} onLang={changeLang} mode={mode} onMode={changeMode} />
          </div>
        ) : view === 'emergency' ? (
          <div className="view-emergency">
            <EmergencyPage onHome={home} onMore={openMore} lang={lang} />
          </div>
        ) : (
          <div className="view-itinerary">
            <DayNav days={TRIP.days} current={day} onSelect={selectDay} onHome={home} onBookings={openBookings} onPhrases={openPhrases} onEmergency={openEmergency} lang={lang} onLang={changeLang} />
            <main className="stage" ref={scrollRef}>
              <div className="stage-inner" key={dayKey + '-' + lang}>
                <Timeline day={TRIP.days[day]} onOpen={setDetail} />
                <Footer trip={TRIP} day={day} lang={lang} onPrev={() => selectDay(Math.max(0, day - 1))} first={day === 0} onNext={() => selectDay(Math.min(TRIP.days.length - 1, day + 1))} last={day === TRIP.days.length - 1} />
              </div>
            </main>
          </div>
        )}
        </div>

        {detail ? <ActivityDetail a={detail} onClose={() => setDetail(null)} /> : null}

        {['itinerary', 'bookings', 'checklist', 'wallet', 'more'].includes(view) ? (
          <MobileTabBar view={view} onItinerary={begin} onBookings={openBookings} onChecklist={openChecklist} onWallet={openWallet} onMore={openMore} />
        ) : null}

        {false ? (
          <TweaksPanel title="Tweaks">
            <TweakSection label="Atmosphere" />
            <TweakToggle label="Ambient motion" value={t.motion} onChange={(v) => setTweak('motion', v)} />
            <TweakSelect
              label="Display font"
              value={t.display}
              options={[{ value: 'sukhumvit', label: 'Sukhumvit - all sans' }, { value: 'trirong', label: 'Trirong - elegant serif' }, { value: 'notoserif', label: 'Noto Serif - classic' }]}
              onChange={(v) => setTweak('display', v)}
            />
            <TweakSection label="Composition" />
            <TweakSlider label="Type scale" value={t.typeScale} min={88} max={116} step={2} unit="%" onChange={(v) => setTweak('typeScale', v)} />
            <TweakRadio label="Rhythm" value={t.density} options={[{ value: 'compact', label: 'Compact' }, { value: 'calm', label: 'Calm' }]} onChange={(v) => setTweak('density', v)} />
            <TweakToggle label="Show imagery" value={t.showImages} onChange={(v) => setTweak('showImages', v)} />
          </TweaksPanel>
        ) : null}
      </div>
    </LangCtx.Provider>
  );
}

function Footer({ trip, day, onPrev, onNext, first, last, lang }) {
  const x = (v) => window.tx(v, lang);
  return (
    <footer className="stage-foot">
      <div className="stage-foot-line" aria-hidden="true"></div>
      <div className="stage-foot-nav">
        {!first ? (
          <button className="stage-prev" onClick={onPrev}>
            <span className="stage-prev-i"><Icon name="chevronLeft" size={18} stroke={1.4} /></span>
            <span className="stage-prev-txt">
              <span className="stage-prev-k">{x({ en: 'Previous', th: 'ก่อนหน้า' })}</span>
              <span className="stage-prev-t">{(lang === 'th' ? trip.days[day - 1].labelTh : trip.days[day - 1].label)}</span>
            </span>
          </button>
        ) : <span className="stage-foot-spacer"></span>}
        {last ? (
          <div className="stage-foot-end">
            <Icon name="compass" size={20} stroke={1.1} />
            <p>{x({ en: 'Journey complete - nine days across Kyushu.', th: 'การเดินทางสิ้นสุดลง - เก้าวันทั่วคิวชู' })}</p>
          </div>
        ) : (
          <button className="stage-next" onClick={onNext}>
            <span className="stage-next-txt">
              <span className="stage-next-k">{x({ en: 'Next', th: 'ถัดไป' })}</span>
              <span className="stage-next-t">{(lang === 'th' ? trip.days[day + 1].labelTh : trip.days[day + 1].label)}</span>
            </span>
            <Icon name="arrowRight" size={18} stroke={1.4} />
          </button>
        )}
      </div>
      <div className="stage-credit">{x(window.CREDIT)}</div>
    </footer>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App />);

</script>
<script>
  /* PWA: capture the install prompt (Chrome/Android) for the in-app install tip */
  window.__bip = null;
  window.addEventListener('beforeinstallprompt', function (e) { e.preventDefault(); window.__bip = e; window.dispatchEvent(new Event('bip-ready')); });
  window.addEventListener('appinstalled', function () { window.__bip = null; try { localStorage.setItem('wwn-install-tip', 'off'); } catch (e) {} });
  /* PWA: register the offline service worker + self-cache this page (any filename) */
  if ('serviceWorker' in navigator) {
    window.addEventListener('load', function () {
      navigator.serviceWorker.register('sw.js').catch(function () {});
      if (window.caches) caches.open('wwn-kyushu-v76').then(function (c) {
        c.add(new Request(location.href, { cache: 'reload' })).catch(function () {});
      });
    });
  }
</script>
</body>
