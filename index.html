          place: L('Check-out is ten', 'เช็คเอาท์สิบโมง'),
          blurb: L('Tap off, rubbish sorted, keypad locked. From tonight the trip is a city and a subway line, so this is the last time the car is packed.',
                   'ปิดก๊อก แยกขยะ ล็อกประตูรหัส ตั้งแต่คืนนี้ทริปเหลือแค่เมืองกับรถไฟใต้ดินสายเดียว นี่จึงเป็นครั้งสุดท้ายที่ต้องจัดของขึ้นรถ'),
          refs: {} },

        { type: 'step', time: '10:00', meridiem: 'Morning', kind: 'Transfer', icon: 'car',
          title: L('Drive to the Mameda west car park - Hita', 'ขับไปลานจอดมาเมดะฝั่งตะวันตกที่ฮิตะ'),
          place: L('Beppu IC to Hita IC on the Oita Expressway - about 85 km, 1 h 10', 'จากเบปปุไอซีถึงฮิตะไอซีบนทางด่วนโออิตะ ระยะประมาณ 85 กิโลเมตร ใช้เวลาประมาณ 1 ชั่วโมง 10 นาที'),
          blurb: L('Beppu IC is ten minutes below the house. West on the Oita Expressway, back past the Yufuin exit and out of the mountains into the river basin. Hita is a little past halfway home, which is why lunch is there.',
                   'เบปปุไอซีอยู่ห่างลงไปจากบ้านสิบนาที วิ่งไปทางตะวันตกบนทางด่วนโออิตะ ผ่านทางออกยูฟุอินอีกครั้ง แล้วลงจากภูเขาเข้าสู่ที่ราบลุ่มแม่น้ำ ฮิตะอยู่เลยกึ่งกลางทางกลับมาหน่อย จึงเป็นจุดกินข้าวเที่ยง'),
          refs: { map: 'https://maps.google.com/?q=%E8%B1%86%E7%94%B0%E8%A5%BF%E9%A7%90%E8%BB%8A%E5%A0%B4+%E6%97%A5%E7%94%B0%E5%B8%82',
                  parking: L('Mameda west car park, Minatomachi 8-54 - 47 spaces, free.', 'ลานจอดมาเมดะฝั่งตะวันตก มินาโตะมาจิ 8-54 มี 47 ช่อง จอดฟรี') } },

        { type: 'feature', time: '11:15', meridiem: 'Late morning', kind: 'Wander', imageId: 'a-d7-lunch',
          title: L('Hita Mameda-machi', 'ฮิตะ ย่านมาเมดะมาจิ'),
          place: L('Edo merchant streets - on foot', 'ย่านพ่อค้าสมัยเอโดะ เดินชม'),
          blurb: L('Hita was run directly by the shogunate, and Mameda-machi is the merchant quarter that survived it - white-walled storehouses, lattice fronts and a canal, all on a flat grid you can walk in half an hour.',
                   'ฮิตะเคยอยู่ใต้การปกครองของรัฐบาลโชกุนโดยตรง และมาเมดะมาจิคือย่านพ่อค้าที่เหลือรอดมา มีโกดังผนังขาว หน้าบ้านไม้ระแนง และลำคลอง ทั้งหมดอยู่บนผังตารางพื้นราบที่เดินจบในครึ่งชั่วโมง'),
          refs: { map: 'https://maps.google.com/?q=Mameda+machi+Hita',
                  parking: L('47 free spaces at the Mameda west lot.', 'ลานตะวันตกของมาเมดะจอดฟรี 47 คัน'),
                  notes: L('Forty-five minutes is enough to walk it - then take the car five minutes south to lunch.',
                           'เดินชมสี่สิบห้านาทีก็พอ แล้วขับรถลงใต้ไปอีกห้านาทีเพื่อกินข้าวเที่ยง') } },

        { type: 'feature', time: '12:05', meridiem: 'Midday', kind: 'Dining', imageId: 'a-hita-sofuren',
          title: L('Sofuren Sohonten - Hita yakisoba', 'โซฟุเร็นสาขาใหญ่ ฮิตะยากิโซบะ'),
          place: L('Wakamiyamachi - the shop that set the style', 'ย่านวากามิยะมาจิ ร้านที่วางแบบฉบับของเมนูนี้'),
          blurb: L('Hita yakisoba is fried hard on an iron griddle until the noodles crisp and brown on both sides, then tossed with pork, a heap of bean sprouts and green onion, so every forkful is half soft and half crunch. Sofuren has made it that way for more than half a century, and its noodles, meat and vegetables still come out of its own kitchens. Order the yakisoba and nothing else the first time.',
                   'ฮิตะยากิโซบะคือบะหมี่ผัดบนกระทะเหล็กจนเส้นกรอบและเกรียมทั้งสองด้าน แล้วคลุกกับหมู ถั่วงอกกองโต และต้นหอม ทุกคำจึงนุ่มครึ่งหนึ่งและกรอบอีกครึ่ง โซฟุเร็นทำแบบนี้มามากกว่าครึ่งศตวรรษ และยังผลิตเส้น เนื้อ และผักในครัวของตัวเองทั้งหมด ครั้งแรกให้สั่งยากิโซบะอย่างเดียวพอ'),
          refs: { map: 'https://maps.google.com/?q=%E6%83%B3%E5%A4%AB%E6%81%8B+%E7%B7%8F%E6%9C%AC%E5%BA%97+%E6%97%A5%E7%94%B0', official: 'https://www.sofuren.com/stores/souhonten',
                  parking: L('About 50 spaces at the shop.', 'มีลานจอดของร้านราว 50 ช่อง'),
                  notes: L('Wakamiyamachi 416-1, tel 0973-24-3188. Open 11:00-22:00, last orders 21:30, closed only on 1 January and the odd staff-training day. Get back on the road by one - Nanzoin stops letting people in at half past four.',
                           'ที่อยู่วากามิยะมาจิ 416-1 โทร 0973-24-3188 เปิด 11:00 ถึง 22:00 รับออร์เดอร์สุดท้าย 21:30 หยุดแค่วันที่ 1 มกราคมกับวันอบรมพนักงานบางวัน ควรออกเดินทางต่อภายในบ่ายโมง เพราะวัดนันโซอินปิดรับเข้าสี่โมงครึ่ง') } },

        { type: 'step', time: '13:00', meridiem: 'Afternoon', kind: 'Transfer', icon: 'car',
          title: L('Drive to the Nanzoin car park - Sasaguri', 'ขับไปลานจอดวัดนันโซอินที่ซาซากุริ'),
          place: L('Oita and Kyushu Expressways, then Route 201 - about 95 km, 1 h 20', 'ทางด่วนโออิตะและทางด่วนคิวชู แล้วต่อถนนหมายเลข 201 ระยะประมาณ 95 กิโลเมตร ใช้เวลาประมาณ 1 ชั่วโมง 20 นาที'),
          blurb: L('Back onto the Oita Expressway to Tosu, north on the Kyushu Expressway to Fukuoka IC, then east along Route 201 into the hills of Sasaguri. Nanzoin sits about twenty-five minutes short of Hakata, so it is a detour of under an hour on the way home rather than a separate trip.',
                   'กลับขึ้นทางด่วนโออิตะไปโทสุ แล้วขึ้นเหนือบนทางด่วนคิวชูไปลงที่ฟุกุโอกะไอซี จากนั้นไปทางตะวันออกตามถนนหมายเลข 201 เข้าสู่เนินเขาซาซากุริ วัดนันโซอินอยู่ห่างจากฮากาตะราวยี่สิบห้านาที จึงเป็นการอ้อมไม่ถึงหนึ่งชั่วโมงระหว่างทางกลับ ไม่ต้องแยกมาอีกวัน'),
          refs: { map: 'https://maps.google.com/?q=%E5%8D%97%E8%94%B5%E9%99%A2+%E9%A7%90%E8%BB%8A%E5%A0%B4+%E7%AF%A0%E6%A0%97',
                  parking: L('Three free car parks at the temple. They fill up at weekends; today is a weekday.', 'วัดมีลานจอดฟรีสามลาน เสาร์อาทิตย์มักเต็ม แต่วันนี้เป็นวันธรรมดา') } },

        { type: 'feature', time: '14:20', meridiem: 'Afternoon', kind: 'Temple', imageId: 'a-sasaguri-nanzoin',
          title: L('Nanzoin - the reclining Buddha', 'วัดนันโซอิน พระนอนองค์ใหญ่'),
          place: L('Sasaguri - 41 metres of bronze on the hillside', 'ซาซากุริ พระนอนทองสัมฤทธิ์ยาว 41 เมตรบนเนินเขา'),
          blurb: L('The head temple of the Sasaguri pilgrimage, a Shingon temple in the wooded hills east of Fukuoka, and home to one of the largest bronze statues in the world: a reclining Buddha 41 metres long, 11 metres high and 300 tonnes, stretched out at the top of the grounds. The way up passes rows of stone Buddhas and goes through the Seven Lucky Gods tunnel, which you walk through making a wish. Give it an hour and a quarter.',
                   'วัดหลักของเส้นทางแสวงบุญซาซากุริ เป็นวัดนิกายชินงนบนเนินเขาที่มีป่าล้อมทางตะวันออกของฟุกุโอกะ และเป็นที่ประดิษฐานรูปหล่อทองสัมฤทธิ์ที่ใหญ่ที่สุดแห่งหนึ่งของโลก คือพระนอนยาว 41 เมตร สูง 11 เมตร หนัก 300 ตัน ทอดองค์อยู่ด้านบนสุดของวัด ทางเดินขึ้นผ่านพระพุทธรูปหินเรียงราย และลอดอุโมงค์เทพเจ้าโชคลาภทั้งเจ็ดที่เดินผ่านพร้อมอธิษฐานขอพร เผื่อเวลาราวหนึ่งชั่วโมงสิบห้านาที'),
          refs: { map: 'https://maps.google.com/?q=Nanzoin+Temple+Sasaguri',
                  booking: L('Y500 each for overseas visitors since March 2026 - Japanese residents and under-19s free', 'ผู้มาเยือนจากต่างประเทศคนละ 500 เยน ตั้งแต่มีนาคม 2026 ส่วนผู้มีถิ่นพำนักในญี่ปุ่นและอายุต่ำกว่า 19 ปีเข้าฟรี'),
                  notes: L('Sasaguri 1035, tel 092-947-7195. The reclining Buddha area is open 09:00-17:00 with last entry at 16:30, and its gate is locked from 16:30 until the next morning, so do not arrive late. Photography is not allowed in some places, including inside the halls - follow the signs. Wear shoes for slopes and steps, dress modestly and keep voices down; it is a working temple.',
                           'ที่อยู่ซาซากุริ 1035 โทร 092-947-7195 โซนพระนอนเปิด 09:00 ถึง 17:00 ปิดรับเข้า 16:30 และประตูทางเข้าพระนอนล็อกตั้งแต่ 16:30 จนถึงเช้าวันรุ่งขึ้น ห้ามมาช้า บางจุดห้ามถ่ายรูป รวมถึงในวิหาร ให้ดูป้าย ใส่รองเท้าที่เดินทางลาดและบันไดได้ แต่งกายสุภาพ และพูดเบาๆ เพราะเป็นวัดที่ยังประกอบพิธีจริง') } },

        { type: 'step', time: '15:35', meridiem: 'Afternoon', kind: 'Transfer', icon: 'car',
          title: L('Drive to the car return - Hakata Station', 'ขับไปจุดคืนรถที่สถานีฮากาตะ'),
          place: L('Route 201 into Hakata - about 20 km, 40 min', 'ถนนหมายเลข 201 เข้าฮากาตะ ระยะประมาณ 20 กิโลเมตร ใช้เวลาประมาณ 40 นาที'),
          blurb: L('Down out of the hills and into the city from the east, to the Toyota branch on the Chikushi side of Hakata Station. Everyone and everything goes to the station together: the house has no parking, so the car is returned first and the last leg is nine minutes on the subway.',
                   'ลงจากเนินเขาเข้าเมืองทางตะวันออก ตรงไปสาขาโตโยต้าฝั่งชิคุชิของสถานีฮากาตะ ทุกคนและของทุกชิ้นไปสถานีพร้อมกัน เพราะบ้านพักไม่มีที่จอดรถ จึงคืนรถก่อน แล้วช่วงสุดท้ายนั่งรถไฟใต้ดินเก้านาที'),
          refs: { map: 'https://maps.google.com/?q=%E3%83%88%E3%83%A8%E3%82%BF%E3%83%AC%E3%83%B3%E3%82%BF%E3%82%AB%E3%83%BC+%E5%8D%9A%E5%A4%9A%E9%A7%85%E5%89%8D%E5%BA%97',
                  parking: L('Return bay at the branch, Hakata-eki Higashi 1-12-8.', 'ช่องคืนรถที่สาขา ฮากาตะเอกิฮิงาชิ 1-12-8'),
                  notes: L('Traffic into Hakata builds after four, so leaving Nanzoin by half past three matters more than ten extra minutes at the temple. Fill the tank on Route 201 before the city - a rental comes back full.',
                           'รถเข้าฮากาตะเริ่มติดหลังสี่โมง การออกจากวัดภายในบ่ายสามโมงครึ่งจึงสำคัญกว่าการอยู่ที่วัดนานขึ้นอีกสิบนาที เติมน้ำมันบนถนนหมายเลข 201 ก่อนเข้าเมือง เพราะรถเช่าต้องคืนแบบเต็มถัง') } },

        { type: 'step', time: '16:15', meridiem: 'Afternoon', kind: 'Transfer', icon: 'car',
          title: L('Return the car - Hakata Station', 'คืนรถที่สถานีฮากาตะ'),
          place: L('Toyota Rent a Car Hakata Ekimae - the Chikushi side of the station', 'โตโยต้าเร้นท์อะคาร์ สาขาหน้าสถานีฮากาตะ ฝั่งชิคุชิของสถานี'),
          blurb: L('Four days and about 550 km, one way round the island with nothing driven twice, and no car needed for the last five days. The branch is on the Chikushi side of Hakata Station, opposite the Oriental Hotel, so the giant tree on the station plaza is a five-minute walk through the concourse, and the subway to the house is under it.',
                   'รวมสี่วัน ราว 550 กิโลเมตร วนรอบเกาะทางเดียวไม่มีช่วงไหนขับซ้ำ และห้าวันสุดท้ายไม่ต้องใช้รถเลย สาขานี้อยู่ฝั่งชิคุชิของสถานีฮากาตะ ตรงข้ามโรงแรมโอเรียนทัล ต้นไฟยักษ์ที่ลานหน้าสถานีจึงเดินทะลุตัวสถานีไปแค่ห้านาที และรถไฟใต้ดินไปบ้านพักก็อยู่ใต้สถานีนั่นเอง'),
          refs: { map: 'https://maps.google.com/?q=%E3%83%88%E3%83%A8%E3%82%BF%E3%83%AC%E3%83%B3%E3%82%BF%E3%82%AB%E3%83%BC+%E5%8D%9A%E5%A4%9A%E9%A7%85%E5%89%8D%E5%BA%97',
                  reservation: { time: '16:15', code: 'CAR-FUK-4D', party: L('Return - end of loop', 'คืนรถ จบเส้นทางขับรถ') },
                  notes: L('Hakata-eki Higashi 1-12-8, tel 092-441-0100, open 08:00-20:00. This is a one-way rental - collected at the international branch, dropped here - so it has to be on the booking; check the drop fee. The old Hakata-guchi branch stopped taking cars in January 2026, so ignore any old pin that points there. Nishijin, the branch nearest the house, does not take one-way returns, and the Akasaka branch closed in January 2026 - this is the right one.',
                           'ที่อยู่ฮากาตะเอกิฮิงาชิ 1-12-8 โทร 092-441-0100 เปิด 08:00 ถึง 20:00 นี่เป็นการเช่าแบบคืนต่างสาขา รับที่สาขาระหว่างประเทศแล้วมาคืนที่นี่ ต้องระบุไว้ในการจองและเช็กค่าคืนรถต่างสาขาด้วย ส่วนสาขาฝั่งฮากาตะกุจิเดิมหยุดรับรถตั้งแต่มกราคม 2026 ถ้าเจอหมุดเก่าที่ชี้ไปที่นั่นไม่ต้องสนใจ สาขานิชิจินที่ใกล้บ้านพักที่สุดไม่รับคืนรถต่างสาขา และสาขาอากาซากะปิดไปตั้งแต่มกราคม 2026 สาขานี้จึงเป็นสาขาที่ถูกต้อง') } },

        { type: 'step', time: '16:50', meridiem: 'Afternoon', kind: 'Train', icon: 'train',
          title: L('Subway to Ohori-koen - Kuko Line', 'นั่งรถไฟใต้ดินสายคูโควไปสถานีโอโฮริโคเอ็น'),
          place: L('Hakata to Ohori-koen - five stops, nine minutes', 'จากฮากาตะถึงโอโฮริโคเอ็น ห้าสถานี เก้านาที'),
          blurb: L('The Kuko Line from under Hakata Station runs straight through Tenjin to Ohori-koen: five stops, nine minutes, Y260, with the luggage. Come up on the north side of Meiji-dori and the house is five minutes on foot.',
                   'สายคูโควจากใต้สถานีฮากาตะวิ่งตรงผ่านเท็นจินไปโอโฮริโคเอ็น ห้าสถานี เก้านาที 260 เยน พร้อมกระเป๋า ขึ้นมาฝั่งเหนือของถนนเมจิโดริ แล้วเดินไปบ้านพักห้านาที'),
          refs: { map: 'https://maps.google.com/?q=Ohorikoen+Station+Fukuoka',
                  booking: L('Y260 a head - IC cards work', 'คนละ 260 เยน ใช้บัตร IC ได้'),
                  notes: L('The same line runs on to the airport in the other direction, which is the last morning sorted. Trains every few minutes.', 'สายเดียวกันวิ่งต่อไปสนามบินในทิศตรงข้าม เช้าวันสุดท้ายจึงจบเรื่องไปในตัว รถมาทุกไม่กี่นาที') } },

        { type: 'step', time: '17:15', meridiem: 'Evening', kind: 'Check-in', icon: 'bed',
          title: L('Check in - Cobaco Ohoru', 'เช็คอิน Cobaco Ohoru'),
          place: L('Arato, Chuo-ku - a house five minutes from Ohori Park', 'อาราโตะ เขตชูโอ บ้านห่างสวนโอโฮริห้านาที'),
          blurb: L('The last five nights in one place, and a whole house rather than hotel rooms: three bedrooms with two queen beds, a queen and six futons, a kitchen with a gas hob, a free washing machine, air conditioning in every room and a projector in the living room. Arato is the quiet grid between Ohori Park and the harbour, five minutes on foot from Ohori-koen Station and three minutes by subway from Tenjin - so the park is the morning run, and Tenjin, Hakata and the airport are all on one line from the door.',
                   'ห้าคืนสุดท้ายอยู่ที่เดียว และเป็นบ้านทั้งหลังแทนที่จะเป็นห้องโรงแรม มีสามห้องนอน เป็นเตียงควีนสองเตียง เตียงควีนอีกหนึ่ง และฟูกหกชุด ครัวมีเตาแก๊ส เครื่องซักผ้าใช้ฟรี แอร์ทุกห้อง และโปรเจกเตอร์ในห้องนั่งเล่น ย่านอาราโตะคือตารางถนนเงียบๆ ระหว่างสวนโอโฮริกับท่าเรือ เดินจากสถานีโอโฮริโคเอ็นห้านาที และนั่งรถไฟใต้ดินจากเท็นจินสามนาที สวนจึงเป็นที่วิ่งตอนเช้า ส่วนเท็นจิน ฮากาตะ และสนามบินอยู่บนสายเดียวกันจากหน้าบ้าน'),
          refs: { map: 'https://maps.google.com/?q=33.5907973,130.3745958', official: 'https://th.airbnb.com/rooms/1137265566469118417',
                  reservation: { time: '17:15', code: 'FUK-COBACO', party: L('Base nights 4-8 - to book', 'คืนที่ 4-8 ห้าคืน ยังไม่ได้จอง') },
                  notes: L('NOT BOOKED YET. Airbnb listing 1137265566469118417, host Airstar, eight years hosting. Check-in 16:00 to 23:00, check-out 10:00 - and a late check-out costs Y5,000 for every half hour, so the last morning is not the one to oversleep. NO PARKING at the house, which is why the car went back at Hakata; there are coin lots nearby if it is ever needed. No smoking anywhere, with a Y50,000 fine, no noise after 22:00, guests eighteen and over. The listing spells its name Ohoru; the park is Ohori.',
                           'ยังไม่ได้จอง ประกาศ Airbnb หมายเลข 1137265566469118417 เจ้าของบ้านชื่อแอร์สตาร์ เป็นโฮสต์มาแปดปี เช็คอิน 16:00 ถึง 23:00 เช็คเอาท์ 10:00 และเช็คเอาท์สายคิดเพิ่ม 5,000 เยนทุกครึ่งชั่วโมง เช้าวันสุดท้ายจึงห้ามตื่นสาย บ้านไม่มีที่จอดรถ ซึ่งคือเหตุผลที่ไปคืนรถที่ฮากาตะ มีลานหยอดเหรียญใกล้ๆ ถ้าจำเป็น ห้ามสูบบุหรี่ทุกจุด ปรับ 50,000 เยน งดเสียงดังหลัง 22:00 และผู้เข้าพักต้องอายุสิบแปดปีขึ้นไป ประกาศสะกดชื่อว่า Ohoru ส่วนชื่อสวนคือ Ohori') } },

        { type: 'step', time: '18:00', meridiem: 'Evening', kind: 'Train', icon: 'train',
          title: L('Subway to Tenjin - Kuko Line', 'นั่งรถไฟใต้ดินสายคูโควไปเท็นจิน'),
          place: L('Ohori-koen to Tenjin - two stops, three minutes', 'จากโอโฮริโคเอ็นถึงเท็นจิน สองสถานี สามนาที'),
          blurb: L('Two stops back down the line. The Christmas market is on the plaza in front of City Hall, five minutes from the station.',
                   'ย้อนกลับไปตามสายเดิมสองสถานี ตลาดคริสต์มาสอยู่ที่ลานหน้าศาลาว่าการเมือง เดินจากสถานีห้านาที'),
          refs: { map: 'https://maps.google.com/?q=Tenjin+Station+Fukuoka' } },

        { type: 'feature', time: '18:15', meridiem: 'Evening', kind: 'View', imageId: 'a-d1-illum',
          title: L('Illuminations & Christmas Market - Tenjin', 'ไฟประดับและคริสต์มาสมาร์เก็ต ที่เท็นจิน'),
          place: L('City Hall plaza and Watanabe-dori', 'ลานหน้าศาลาว่าการเมืองและถนนวาตานาเบะโดริ'),
          blurb: L('Fukuoka lights up from mid-November, so the whole trip falls inside the season - the Christmas market with its wooden huts and mulled wine on the plaza in front of City Hall, and a belt of light down Watanabe-dori to Canal City. Hakata Station\'s giant tree is the other one, right beside the car return, so look at it as you leave the branch.',
                   'ฟุกุโอกะเปิดไฟประดับตั้งแต่กลางพฤศจิกายน ทริปนี้เลยอยู่ในช่วงพอดีทั้งทริป มีคริสต์มาสมาร์เก็ตที่มีซุ้มไม้และไวน์อุ่นที่ลานหน้าศาลาว่าการเมือง และไฟประดับยาวต่อเนื่องตามถนนวาตานาเบะโดริถึงคาแนลซิตี้ ส่วนต้นไฟยักษ์หน้าสถานีฮากาตะอยู่ข้างจุดคืนรถพอดี ดูตอนเดินออกจากสาขาได้เลย'),
          refs: { map: 'https://maps.google.com/?q=Fukuoka+Christmas+Market+Tenjin', notes: L('Lights switch on around 17:00. In the 2025 season Hakata Station ran from 1 Nov and Tenjin / Canal City from 13 Nov - 2026 dates are usually published in the autumn, so re-check nearer the time. Leave the market by ten past seven and walk south down Watanabe-dori under the lights - Yakuin is about eighteen minutes on foot, or two stops on the Nanakuma Line from Tenjin-Minami to Yakuin-odori.', 'ไฟเปิดประมาณ 17:00 ปี 2025 ฝั่งสถานีฮากาตะเริ่ม 1 พ.ย. ส่วนเท็นจินและคาแนลซิตี้เริ่ม 13 พ.ย. วันที่ของปี 2026 มักประกาศช่วงใกล้ฤดู เช็กอีกครั้งก่อนไป ออกจากตลาดตอนทุ่มสิบนาที แล้วเดินลงใต้ตามถนนวาตานาเบะโดริใต้แนวไฟ ถึงยาคุอินราวสิบแปดนาที หรือนั่งสายนานาคุมะจากเท็นจินมินามิไปยาคุอินโอโดริสองสถานี') } },

        { type: 'feature', time: '19:30', meridiem: 'Evening', kind: 'Dining', imageId: 'a-d9-yakiniku',
          title: L('Yakuin Yakiniku NIKUICHI', 'ยาคุอิน ยากินิคุ NIKUICHI'),
          place: L('Wagyu over charcoal - Yakuin 3-chome, booked for 19:30', 'เนื้อวากิวย่างถ่าน ยาคุอิน 3 โจเมะ จองไว้ 19:30'),
          blurb: L('A booked table, the first of the trip: a hideaway yakiniku in the back streets of Yakuin that has run since 2015 on top-grade kuroge wagyu at prices well under what the cuts would cost in Tokyo. Order by the plate rather than a course - tongue first, then harami, then whatever the blackboard says came in - and let the table settle in after four days on the road.',
                   'โต๊ะที่จองไว้ โต๊ะแรกของทริป ร้านเนื้อย่างที่ซ่อนอยู่ในซอยหลังย่านยาคุอิน เปิดมาตั้งแต่ปี 2015 ด้วยเนื้อคุโรเงะวากิวเกรดสูงในราคาที่ต่ำกว่าโตเกียวมาก สั่งเป็นจานดีกว่าสั่งคอร์ส เริ่มจากลิ้น ต่อด้วยฮารามิ แล้วค่อยดูกระดานดำว่าวันนี้มีอะไรเข้ามา นั่งยาวๆ ได้เลยหลังจากอยู่บนถนนมาสี่วัน'),
          refs: { map: 'https://maps.google.com/?q=%E8%96%AC%E9%99%A2%E7%84%BC%E8%82%89NIKUICHI+%E7%A6%8F%E5%B2%A1%E5%B8%82%E4%B8%AD%E5%A4%AE%E5%8C%BA%E8%96%AC%E9%99%A23-16-34', official: 'https://www.tablecheck.com/en/yakiniku-nikuichi',
                  booking: L('About Y4,000 to 6,000 a head with drinks', 'ราวคนละ 4,000 ถึง 6,000 เยนรวมเครื่องดื่ม'),
                  reservation: { time: '19:30', code: 'NIKUICHI-01', party: L('Dinner for 5 - BOOKED for 19:30', 'มื้อค่ำ 5 ที่ จองแล้ว 19:30') },
                  notes: L('Yakuin 3-16-34, Yamato Building 1F, tel 092-522-4129. Open from 17:00 to late, last orders about half past midnight, irregular closing days. Three minutes from Yakuin-odori on the Nanakuma Line, five from Nishitetsu Yakuin. The table is BOOKED for 19:30 - the shop is popular enough that it will not hold a late table, so be there on time. Home afterwards is a twenty-minute walk north to Tenjin for the Kuko Line, or a short taxi.',
                           'ที่อยู่ยาคุอิน 3-16-34 อาคารยามาโตะ ชั้น 1 โทร 092-522-4129 เปิด 17:00 ถึงดึก ปิดรับออร์เดอร์ราวเที่ยงคืนครึ่ง หยุดไม่แน่นอน ห่างสถานียาคุอินโอโดริสายนานาคุมะสามนาที และห่างสถานียาคุอินของนิชิเท็ตสึห้านาที โต๊ะจองไว้แล้ว 19:30 ร้านคนเยอะจนไม่รอโต๊ะที่มาช้า ควรไปให้ตรงเวลา ขากลับเดินขึ้นเหนือไปเท็นจินยี่สิบนาทีเพื่อขึ้นสายคูโคว หรือนั่งแท็กซี่ระยะสั้น') } },

        { type: 'feature', time: '21:45', meridiem: 'Night', kind: 'Dining', imageId: 'a-d2-yatai',
          title: L('Nakasu yatai stalls', 'แผงยาไต นากาสึ'),
          place: L('Riverside food carts', 'รถเข็นอาหารริมแม่น้ำ'),
          blurb: L('Squeeze onto a stool at a lantern-lit cart on the Naka river bank for a beer and a skewer or two - the image of Fukuoka at night, and the right way to close the first evening back in the city. After the yakiniku this is a nightcap, not a meal.',
                   'เบียดนั่งสตูลที่รถเข็นแขวนโคมไฟริมแม่น้ำนากะ สั่งเบียร์กับไม้ย่างสักไม้สองไม้ เป็นภาพจำของฟุกุโอกะยามค่ำ และเป็นวิธีปิดค่ำคืนแรกที่กลับเข้าเมืองได้ถูกทาง หลังเนื้อย่างแล้วนี่คือรอบปิดท้าย ไม่ใช่มื้ออาหาร'),
          refs: { map: 'https://maps.google.com/?q=Nakasu+Yatai+Fukuoka',
                  notes: L('Nakasu is on the way home from Yakuin - about twenty-five minutes on foot up through Tenjin, or a taxi. Most stalls are cash only and run to around midnight or one. Tables are tiny, so a group of five may have to split across two carts, and if everyone is full from the yakiniku, skip it and go straight home. Home is the subway from Nakasu-Kawabata to Ohori-koen, three stops and about seven minutes, or a short taxi; trains run past midnight.',
                           'นากาสึอยู่บนทางกลับบ้านจากยาคุอิน เดินขึ้นผ่านเท็นจินราวยี่สิบห้านาที หรือนั่งแท็กซี่ ส่วนใหญ่รับเงินสดเท่านั้น และเปิดถึงราวเที่ยงคืนถึงตีหนึ่ง โต๊ะเล็กมาก กลุ่มห้าคนอาจต้องแยกนั่งสองแผง และถ้าอิ่มจากเนื้อย่างแล้วให้ข้ามไปกลับบ้านเลย กลับบ้านด้วยรถไฟใต้ดินจากนากาสึคาวาบาตะไปโอโฮริโคเอ็น สามสถานี ราวเจ็ดนาที หรือนั่งแท็กซี่ระยะสั้น รถไฟมีถึงหลังเที่ยงคืน') } },
      ],
    },
    {
      label: 'Day 05', labelTh: 'วันที่ 05', theme: 'sumi',
      date: L('Wednesday - 25 Nov 2026', 'พุธ 25 พฤศจิกายน 2026'),
      title: L('Fukuoka', 'ฟุกุโอกะ'),
      subtitle: L('A Whole Day in the City', 'หนึ่งวันเต็มในเมือง'),
      note: L(
        'No car, no check-out, and a late first call. The first of two clear days in the city starts with a dawn run from the front door round Ohori Park and up through Maizuru Park, ending at the Starbucks on the lake shore. Then the morning goes west to the sea: FUK COFFEE Seaside when it opens at ten, and Fukuoka Tower and the Momochi seafront until it is time for lunch. The afternoon is Tenjin - tsukemen at Menya Kanetora, the donut shop two minutes away, and the shopping streets until evening - and the night runs from the motsunabe shop that claims to have invented it to craft beer in Daimyo.',
        'ไม่มีรถ ไม่ต้องเช็คเอาท์ และมีนัดแรกค่อนข้างสาย นี่คือวันแรกจากสองวันเต็มในเมือง เริ่มด้วยวิ่งเช้าจากหน้าบ้านรอบสวนโอโฮริและขึ้นสวนไมซุรุ จบที่สตาร์บัคส์ริมบึง จากนั้นช่วงเช้าไปทางตะวันตกถึงทะเล แวะ FUK COFFEE Seaside ตอนเปิดสิบโมง แล้วเดินฟุกุโอกะทาวเวอร์กับริมหาดโมโมจิจนถึงมื้อเที่ยง ช่วงบ่ายเป็นของเท็นจิน กินซึเคเมงที่เมนยะ คาเนโทระ แวะร้านโดนัทที่อยู่ห่างสองนาที และเดินช้อปตามถนนจนถึงเย็น ค่ำคืนเริ่มในร้านโมทสึนาเบะที่อ้างว่าตัวเองเป็นคนคิดค้นมันขึ้นมา แล้วปิดท้ายด้วยคราฟต์เบียร์ที่ไดเมียว'
      ),
      coverId: 'day5-cover',
      activities: [
        { type: 'feature', time: '06:30', meridiem: 'Dawn', kind: 'Run', imageId: 'a-d2-cityrun',
          title: L('Morning run - Ohori Park and Maizuru Park', 'วิ่งเช้า สวนโอโฮริและสวนไมซุรุ'),
          place: L('The lake, the island bridges and the castle - 4.1 km', 'บึง สะพานเกาะกลางบึง และปราสาท ระยะ 4.1 กิโลเมตร'),
          blurb: L('A 4.1 km dawn loop that starts at the front door and stays inside the two parks. Down to Ohori Park along the old moat, round the west shore as the sky lightens, over the chain of island bridges past the Ukimido pavilion, then down the east shore and out into Maizuru Park for the stone keep base of Fukuoka Castle, with the sun coming up over it, before coming back to the Starbucks on the lake shore, which opens at 07:00. One short climb, otherwise flat, with the park still nearly empty.',
                   'ลูปวิ่งยามเช้า 4.1 กิโลเมตร เริ่มจากหน้าประตูบ้านและอยู่ในสองสวนเท่านั้น ลงไปสวนโอโฮริตามคูเมืองเก่า วนฝั่งตะวันตกของบึงตอนฟ้าเริ่มสว่าง ข้ามสะพานเกาะกลางบึงผ่านศาลาอุกิมิโดะ แล้ววิ่งลงฝั่งตะวันออกเข้าสวนไมซุรุไปที่ฐานหินของหอปราสาทฟุกุโอกะตอนพระอาทิตย์ขึ้นเหนือเนิน ก่อนกลับมาจบที่สตาร์บัคส์ริมบึงซึ่งเปิดเจ็ดโมง มีเนินสั้นๆ ช่วงเดียว ที่เหลือทางราบ และสวนยังแทบว่าง'),
          refs: { map: 'https://maps.google.com/?q=33.5907973,130.3745958', notes: L('Leave the house at 06:30, half an hour before sunrise. At an easy pace with photo stops the loop takes about 40 minutes, which lands you at Starbucks around 07:10 - it opens at 07:00, so the doors are open and the lakeside terrace is empty. From there it is thirteen minutes\' walk home, or five to Ohori-koen Station. FUK COFFEE Seaside does not open until ten and is a 22-minute walk from the house, so there is time for a second cup, a shower and breakfast first. Tap the map below to see the route, and tap a pin or a step for its photo and directions.', 'ออกจากบ้าน 06:30 ก่อนพระอาทิตย์ขึ้นครึ่งชั่วโมง วิ่งสบายๆ รวมแวะถ่ายรูปใช้เวลาราว 40 นาที จะถึงสตาร์บัคส์ราว 07:10 ร้านเปิด 07:00 ประตูจึงเปิดแล้วและระเบียงริมบึงยังว่าง จากร้านเดินกลับบ้านสิบสามนาที หรือไปสถานีโอโฮริโคเอ็นห้านาที FUK COFFEE Seaside เปิดสิบโมงและอยู่ห่างจากบ้านเดิน 22 นาที จึงมีเวลานั่งต่อแก้วที่สอง อาบน้ำ และกินมื้อเช้าก่อน แตะแผนที่ด้านล่างเพื่อดูเส้นทาง และแตะหมุดหรือแต่ละช่วงเพื่อดูรูปกับเส้นทาง') } },

        { type: 'feature', time: '10:00', meridiem: 'Morning', kind: 'Coffee', imageId: 'a-fuk-fukseaside',
          title: L('FUK COFFEE Seaside', 'FUK COFFEE Seaside'),
          place: L('BOSS E-ZO FUKUOKA food hall - terrace seats by the Dome', 'ฟู้ดฮอลล์ BOSS E-ZO FUKUOKA มีที่นั่งเทอร์เรซข้างโดม'),
          blurb: L('The seaside branch of the Fuk Coffee stand, on the third floor of the food hall at BOSS E-ZO FUKUOKA beside the Dome, with terrace seats. The order is the cafe latte and the pudding. It opens at ten, so this is the first stop of the Momochi morning, and the tower is a walk along the shore from here.',
                   'สาขาริมทะเลของร้านกาแฟ Fuk Coffee อยู่ชั้น 3 ของฟู้ดฮอลล์ BOSS E-ZO FUKUOKA ข้างโดม มีที่นั่งเทอร์เรซ เมนูแนะนำคือคาเฟ่ลาเต้กับพุดดิ้ง ร้านเปิดสิบโมง จึงเป็นจุดแรกของเช้าที่โมโมจิ และจากที่นี่เดินเลียบชายฝั่งไปหอคอยได้'),
          refs: { map: 'https://maps.google.com/?q=FUK%20COFFEE%20Seaside%20%E7%A6%8F%E5%B2%A1%E5%B8%82%E4%B8%AD%E5%A4%AE%E5%8C%BA%E5%9C%B0%E8%A1%8C%E6%B5%9C2-2-6%20BOSS%20E%E3%83%BBZO%20FUKUOKA', official: 'https://fuk-coffee.com/',
                  booking: L('Latte and pudding, a few hundred yen each', 'ลาเต้และพุดดิ้ง อย่างละไม่กี่ร้อยเยน'),
                  notes: L('Jigyohama 2-2-6, BOSS E-ZO FUKUOKA 3F (The FOODHALL), tel 092-844-1500. Open 10:00-21:00, with changes on Dome event days. From the house it is about 22 minutes on foot - leave at half past nine - or a four-minute taxi; the nearest station is Tojinmachi, twelve minutes away on foot. From here to Fukuoka Tower is 1.25 km, about seventeen minutes along the shore.',
                           'ที่อยู่จิเงียวฮามะ 2-2-6 BOSS E-ZO FUKUOKA ชั้น 3 (The FOODHALL) โทร 092-844-1500 เปิด 10:00 ถึง 21:00 และเปลี่ยนได้ในวันที่โดมมีงาน จากบ้านเดินราว 22 นาที ออกจากบ้านเก้าโมงครึ่ง หรือนั่งแท็กซี่สี่นาที สถานีที่ใกล้ที่สุดคือโทจินมาจิ เดินสิบสองนาที จากที่นี่ไปฟุกุโอกะทาวเวอร์ 1.25 กิโลเมตร เดินเลียบชายฝั่งราวสิบเจ็ดนาที') } },

        { type: 'feature', time: '10:50', meridiem: 'Morning', kind: 'View', imageId: 'a-d9-tower',
          title: L('Fukuoka Tower & Momochi', 'ฟุกุโอกะทาวเวอร์และย่านโมโมจิ'),
          place: L('Seaside tower and the Momochi shore - the morning on the bay', 'หอคอยริมทะเลและริมหาดโมโมจิ ช่วงเช้าริมอ่าว'),
          blurb: L('Japan\'s tallest seaside tower, all mirrored glass, with a 123 m observation deck over Hakata Bay and the Momochi seafront round its foot. Walk over from the cafe along the shore, go up while the morning light is clear over the bay and the city, then take the rest of the hour on the sand and the promenade below before the bus back to Tenjin.',
                   'หอคอยริมทะเลที่สูงที่สุดในญี่ปุ่น ผิวกระจกเงาทั้งหลัง มีจุดชมวิวที่ความสูง 123 เมตรเหนืออ่าวฮากาตะ และมีริมหาดโมโมจิอยู่รอบตีนหอ เดินมาจากคาเฟ่ตามริมทะเล ขึ้นไปตอนแสงเช้าใสเหนืออ่าวและตัวเมือง แล้วใช้เวลาที่เหลือเดินเล่นริมหาดและทางเดินด้านล่างก่อนขึ้นรถเมล์กลับเท็นจิน'),
          refs: { map: 'https://maps.google.com/?q=Fukuoka+Tower', official: 'https://www.fukuokatower.co.jp/english/',
                  booking: L('Observation deck - about Y1,000 for adults', 'ขึ้นจุดชมวิว ผู้ใหญ่ราว 1,000 เยน'),
                  notes: L('Open 09:30-22:00 with last entry at 21:30, so in the morning the deck should be quiet. Check the current ticket price on the official site. The Fukuoka City Museum next door is due to close for renovation from about October 2026, so do not plan on it. For lunch a bus runs straight from the tower to Tenjin in about 25 minutes - leave by 11:50 to reach Kanetora at half past twelve.',
                           'เปิด 09:30 ถึง 22:00 ปิดรับเข้า 21:30 ตอนเช้าจุดชมวิวจึงควรเงียบ ราคาตั๋วล่าสุดเช็กได้ที่เว็บทางการ พิพิธภัณฑ์เมืองฟุกุโอกะที่อยู่ติดกันมีกำหนดปิดปรับปรุงตั้งแต่ราวเดือนตุลาคม 2026 จึงไม่ควรวางแผนเข้า มื้อเที่ยงมีรถเมล์ตรงจากหอคอยไปเท็นจินราว 25 นาที ออกก่อน 11:50 จะถึงคาเนโทระตอนครึ่งชั่วโมงหลังเที่ยงพอดี') } },

        { type: 'feature', time: '12:30', meridiem: 'Midday', kind: 'Dining', imageId: 'a-fuk-kanetora',
          title: L('Menya Kanetora - Tenjin honten', 'เมนยะ คาเนโทระ สาขาใหญ่เท็นจิน'),
          place: L('Rich tsukemen - eight minutes south of Tenjin Station', 'ซึเคเมงเข้มข้น เดินจากสถานีเท็นจินลงใต้แปดนาที'),
          blurb: L('One of Fukuoka\'s best-known tsukemen shops, and one that queues even on weekdays. The dipping broth is cooked down from pork bones, chicken bones, vegetables and dried fish until it is thick, with a strong seafood edge, and the extra-thick noodles are dipped in as you eat. It is the day\'s only lunch, so have the plain rich tsukemen with the medium portion, which costs nothing extra.',
                   'หนึ่งในร้านซึเคเมงที่ดังที่สุดของฟุกุโอกะ และเป็นร้านที่คนต่อคิวแม้ในวันธรรมดา น้ำซุปจิ้มเคี่ยวจากกระดูกหมู กระดูกไก่ ผัก และปลาแห้งจนข้น รสอาหารทะเลชัดเจน ส่วนเส้นหนาพิเศษใช้จิ้มกินไปทีละคำ ที่นี่เป็นมื้อเที่ยงมื้อเดียวของวัน สั่งซึเคเมงเข้มข้นธรรมดากับเส้นไซส์กลางที่ไม่คิดเงินเพิ่มก็พอ'),
          refs: { map: 'https://maps.google.com/?q=%E9%BA%BA%E3%82%84%E5%85%BC%E8%99%8E%20%E5%A4%A9%E7%A5%9E%E6%9C%AC%E5%BA%97%20%E7%A6%8F%E5%B2%A1%E5%B8%82%E4%B8%AD%E5%A4%AE%E5%8C%BA%E6%B8%A1%E8%BE%BA%E9%80%9A4-9-18', official: 'https://www.kanetora.co.jp/shop',
                  booking: L('Tsukemen about Y900 to 1,000 - cash only', 'ซึเคเมงราว 900 ถึง 1,000 เยน รับเงินสดเท่านั้น'),
                  notes: L('Watanabe-dori 4-9-18, Fukusake Building 1F, tel 092-726-6700. Open 10:00-22:00 on weekdays and never closed, with only 16 seats and no parking. Buy a ticket at the machine - rich tsukemen about Y900, Y1,000 with the marinated egg, the spicy one Y950, a large portion Y150 more - and note it is CASH ONLY. Oil, strength, garlic and spring onion can be set at the machine. Expect a queue at this hour; if it is hopeless, the newer branch at Daimyo 1-14-45 (Qiz Tenjin 1F, tel 092-406-2202, 11:00-21:00 on weekdays, cards accepted) is in the shopping lane, and Fukuoka PARCO has one on B1F. From Fukuoka Tower the bus to Tenjin takes about 25 minutes, so leave the tower by 11:50.',
                           'วาตานาเบะโดริ 4-9-18 อาคารฟุกุซาเกะ ชั้น 1 โทร 092-726-6700 วันธรรมดาเปิด 10:00 ถึง 22:00 ไม่มีวันหยุด มีแค่ 16 ที่นั่งและไม่มีที่จอดรถ ซื้อตั๋วจากตู้ ซึเคเมงเข้มข้นราว 900 เยน ใส่ไข่ต้มซีอิ๊วเป็น 1,000 เยน แบบเผ็ด 950 เยน เส้นใหญ่พิเศษเพิ่ม 150 เยน และรับเงินสดเท่านั้น ที่ตู้ปรับความมัน ความเข้ม กระเทียม และต้นหอมได้ ช่วงนี้มีคิวแน่นอน ถ้ายาวเกินรับไหวให้ไปสาขาใหม่ที่ไดเมียว 1-14-45 (อาคาร Qiz Tenjin ชั้น 1 โทร 092-406-2202 วันธรรมดา 11:00 ถึง 21:00 รับบัตร) ซึ่งอยู่ในซอยช้อปปิ้ง หรือสาขาที่ฟุกุโอกะพาร์โกะชั้นใต้ดิน 1 จากฟุกุโอกะทาวเวอร์นั่งรถเมล์ไปเท็นจินราว 25 นาที จึงควรออกจากหอคอยก่อน 11:50') } },

        { type: 'feature', time: '13:30', meridiem: 'Afternoon', kind: 'Sweets', imageId: 'a-d1-imdonut',
          title: L('I\'m Donut?', 'I\'m Donut?'),
          place: L('Watanabe-dori 5-chome - two minutes from Kanetora', 'วาตานาเบะโดริ 5 โจเมะ ห่างจากคาเนโทระเดินสองนาที'),
          blurb: L('The fluffy raised donut born in Fukuoka. It sells out and the line runs all day, so it comes straight after lunch rather than waiting for later in the afternoon.',
                   'โดนัทเนื้อนุ่มสไตล์ raised ที่เกิดที่ฟุกุโอกะ ขายหมดเร็วและคิวยาวทั้งวัน จึงมาต่อจากมื้อเที่ยงทันทีแทนที่จะรอถึงบ่ายแก่'),
          refs: { map: 'https://maps.google.com/?q=I%27m%20donut%3F%20%E7%A6%8F%E5%B2%A1%E5%BA%97%20%E7%A6%8F%E5%B2%A1%E5%B8%82%E4%B8%AD%E5%A4%AE%E5%8C%BA%E6%B8%A1%E8%BE%BA%E9%80%9A5-24-30',
                  notes: L('Watanabe-dori 5-24-30, near Tenjin-Minami Station. Listed hours are 10:00-20:00 with last orders at 19:30, but it closes when the donuts run out. Two minutes on foot from Kanetora, then eight to Tenjin Station. Cash and cards.',
                           'ที่อยู่วาตานาเบะโดริ 5-24-30 ใกล้สถานีเท็นจินมินามิ เวลาที่ลงไว้คือ 10:00 ถึง 20:00 รับออร์เดอร์สุดท้าย 19:30 แต่ปิดเมื่อโดนัทหมด เดินจากคาเนโทระสองนาที แล้วไปสถานีเท็นจินอีกแปดนาที รับเงินสดและบัตร') } },

        { type: 'feature', time: '14:00', meridiem: 'Afternoon', kind: 'Wander', imageId: 'a-d1-canalcity',
          title: L('Shopping in Tenjin', 'ช้อปปิ้งย่านเท็นจิน'),
          place: L('Malls and shops around Tenjin Station - the afternoon', 'ห้างและร้านค้ารอบสถานีเท็นจิน ช่วงบ่าย'),
          blurb: L('An easy stretch of the day around Tenjin & Daimyo, all within a few minutes of the station - from UNIQLO/GU to department stores, character goods, homeware and Don Quijote. Tap for the shop list.',
                   'ช่วงสบายๆ ของวันกับการเดินช้อปย่านเท็นจินและไดเมียว ซึ่งอยู่รอบสถานีทั้งหมด มีตั้งแต่ UNIQLO และ GU ห้างสรรพสินค้า ของคาแรกเตอร์ ของแต่งบ้าน ไปจนถึง Don Quijote แตะดูรายชื่อร้านด้านล่างได้'),
          refs: { map: 'https://maps.google.com/?q=Tenjin+Fukuoka', notes: L('All about 5-12 min on foot from Tenjin Station (Tenjin/Daimyo) - from the house it is the Kuko line from Ohori-koen, two stops. Don Quijote & the department stores are tax-free with your passport.', 'ทั้งหมดเดินประมาณ 5 ถึง 12 นาทีจากสถานีเท็นจิน ย่านเท็นจินและไดเมียว จากบ้านพักนั่งรถไฟใต้ดินสายคูโคจากสถานีโอโฮริโคเอ็นไปสองสถานี โดย Don Quijote และห้างสรรพสินค้าซื้อปลอดภาษีได้ด้วยพาสปอร์ต') } },

        { type: 'feature', time: '19:00', meridiem: 'Night', kind: 'Dining', imageId: 'a-d1-motsunabe',
          title: L('Motsunabe Rakutenchi', 'โมทสึนาเบะ ราคุเท็นจิ'),
          place: L('The originator - Imaizumi So-Honten', 'ต้นตำรับโมทสึนาเบะ สาขาใหญ่ย่านอิมาอิซูมิ'),
          blurb: L('Finish the day at the shop that says it invented motsunabe - a 40-year secret soy broth heaped with a tower of garlic chives and fresh beef offal, on the 2nd floor of the Rakutenchi building in Imaizumi. Cheap, lively and very Hakata.',
                   'ปิดวันที่ร้านต้นตำรับผู้ให้กำเนิดโมทสึนาเบะ ใช้น้ำซุปซีอิ๊วสูตรลับกว่า 40 ปี โปะใบกุยช่ายเป็นภูเขากับเครื่องในวัวสด ชั้น 2 ตึกราคุเท็นจิ ย่านอิมาอิซุมิ ราคาเป็นกันเอง บรรยากาศคึกคักสไตล์ฮากาตะ'),
          refs: { map: 'https://maps.google.com/?q=元祖もつ鍋楽天地+天神今泉総本店', official: 'https://rakutenti.com/',
                  notes: L('"Manzoku" course = motsunabe (1.5 servings) + tofu + a small dish + all-you-can-eat champon shime. Soy is the classic broth; miso is also available. 2F Rakutenchi Bldg, 1-19-18 Imaizumi. Book ahead on a weekend.', 'คอร์ส Manzoku ประกอบด้วยโมทสึนาเบะ 1.5 ที่ เต้าหู้ กับแกล้ม และจัมปงเติมไม่อั้น สูตรคลาสสิกคือน้ำซีอิ๊ว และมีแบบมิโซะด้วย ร้านอยู่ชั้น 2 ตึกราคุเท็นจิ เลขที่ 1-19-18 อิมาอิซูมิ วันหยุดควรจองล่วงหน้า'),
                  reservation: { time: '19:00', code: 'MOTSU-01', party: L('Dinner - book ahead', 'มื้อค่ำ ควรจองล่วงหน้า') } } },

        { type: 'feature', time: '21:30', meridiem: 'Night', kind: 'Nightlife', imageId: 'a-d1-nightlife',

          refs: { map: 'https://maps.google.com/?q=FUKUOKA+CRAFT+by+El+Borracho+Daimyo', official: 'https://www.fukuoka-now.com/en/food/fukuoka-craft/', notes: L('Daimyo - open to 24:00 (Fri/Sat to 01:00) - on-site brewery.', 'อยู่ย่านไดเมียว เปิดถึงเที่ยงคืน วันศุกร์และเสาร์ถึงตีหนึ่ง และมีโรงเบียร์อยู่ในร้าน') } },

    {
      label: 'Day 06', labelTh: 'วันที่ 06', theme: 'kohaku',
      date: L('Thursday - 26 Nov 2026', 'พฤหัสบดี 26 พฤศจิกายน 2026'),
      title: L('Hakata Old Town', 'ย่านเมืองเก่าฮากาตะ'),
      subtitle: L('Nishi-dori Shops, Old Shrines, the Canal and Skewers', 'ช้อปถนนนิชิโดริ ศาลเจ้าเก่า ห้างริมคลอง และไม้ย่างหนังไก่'),
      note: L(
        'The second city day starts in the shops and ends at the skewers. The morning belongs to Daimyo, the fashion quarter just west of Tenjin Station, in the lanes round the Human Made flagship, and at eleven the day sits down to gyukatsu five minutes away. After lunch it crosses the river to old Hakata: the shrine the city grew up around, the first Zen temple built in Japan, a covered arcade that has traded for a century, the wagashi house at the end of it, and a walled tea garden almost nobody finds. Canal City comes next as the light goes, then the foamiest tonkotsu in the city on the east side of Hakata Station, and the day finishes on the same block with chicken-skin skewers, which Fukuoka invented and which are far better than they sound.',
        'วันในเมืองวันที่สองเริ่มที่ร้านค้าและจบที่ไม้ย่าง ช่วงเช้าเป็นของไดเมียว ย่านแฟชั่นทางตะวันตกของสถานีเท็นจิน ในซอยรอบร้านฮิวแมนเมด แล้วสิบเอ็ดโมงนั่งกินกิวคัตสึที่ร้านซึ่งอยู่ห่างไปห้านาที บ่ายข้ามแม่น้ำไปฮากาตะเมืองเก่า ศาลเจ้าที่เมืองเติบโตขึ้นรอบๆ วัดเซนแห่งแรกที่สร้างในญี่ปุ่น ถนนมีหลังคาที่ค้าขายมาร้อยปี ร้านขนมญี่ปุ่นที่ปลายถนนนั้น และสวนน้ำชาในกำแพงที่แทบไม่มีใครหาเจอ จากนั้นเป็นคาแนลซิตี้ตอนแสงเริ่มหมด แล้วทงคตสึฟองนุ่มที่สุดในเมืองฝั่งตะวันออกของสถานีฮากาตะ ปิดวันในบล็อกเดียวกันด้วยไม้ย่างหนังไก่ ซึ่งเป็นของที่ฟุกุโอกะคิดขึ้นเอง และอร่อยกว่าที่ชื่อบอกมาก'
      ),
      coverId: 'day6-cover',
      activities: [
        { type: 'feature', time: '09:00', meridiem: 'Morning', kind: 'Coffee', imageId: 'a-fuk-fukparks',
          title: L('FUK COFFEE Parks', 'FUK COFFEE Parks'),
          place: L('Arato - 200 m from Ohori-koen Station', 'อาราโตะ ห่างสถานีโอโฮริโคเอ็น 200 เมตร'),
          blurb: L('The Ohori Park branch of Fuk Coffee, in the same quiet grid as the house and open from eight, so it is a slow first coffee before the shops. The Ohori pudding, a cream puff and a latte are the order, and it sits on the way to the Kuko Line.',
                   'สาขาสวนโอโฮริของ Fuk Coffee อยู่ในตารางถนนเงียบๆ เดียวกับบ้านพักและเปิดตั้งแต่แปดโมง จึงเป็นกาแฟแรกแบบไม่รีบก่อนไปช้อป เมนูแนะนำคือพุดดิ้งโอโฮริ ครีมพัฟ และลาเต้ และร้านอยู่ระหว่างทางไปสายคูโค'),
          refs: { map: 'https://maps.google.com/?q=FUK%20COFFEE%20Parks%20%E7%A6%8F%E5%B2%A1%E5%B8%82%E4%B8%AD%E5%A4%AE%E5%8C%BA%E8%8D%92%E6%88%B81-4-20', official: 'https://fuk-coffee.com/shop/fuk-coffee-parks/',
                  booking: L('Latte Y650, Ohori pudding Y550', 'ลาเต้ 650 เยน พุดดิ้งโอโฮริ 550 เยน'),
                  notes: L('Arato 1-4-20, tel 092-741-6600. The shop\'s own page gives 08:00-20:00, and some listings show an earlier close on weekdays. Three minutes on foot from Ohori-koen Station exit 2 and about ten from the house. Leave by 09:45: Tenjin is two stops and three minutes on the Kuko Line, and the shopping lane is five minutes on foot from there. The menu changes, and the shop posts on Instagram at fuk.coffee.parks.',
                           'ที่อยู่อาราโตะ 1-4-20 โทร 092-741-6600 หน้าเว็บของร้านระบุ 08:00 ถึง 20:00 บางแหล่งข้อมูลลงเวลาปิดเร็วกว่านั้นในวันธรรมดา เดินจากสถานีโอโฮริโคเอ็นทางออก 2 สามนาที และจากบ้านราวสิบนาที ออกจากร้านก่อน 09:45 เพราะเท็นจินอยู่ห่างสองสถานี สามนาทีบนสายคูโค แล้วเดินไปซอยช้อปปิ้งอีกห้านาที เมนูเปลี่ยนได้ และร้านโพสต์ในอินสตาแกรม fuk.coffee.parks') } },

        { type: 'feature', time: '10:00', meridiem: 'Morning', kind: 'Wander', imageId: 'a-fuk-nishidori',
          title: L('Tenjin Nishi-dori - the Human Made lane', 'ถนนเท็นจินนิชิโดริ ซอยร้านฮิวแมนเมด'),
          place: L('Daimyo - the shopping lanes west of Tenjin Station', 'ไดเมียว ซอยช้อปปิ้งทางตะวันตกของสถานีเท็นจิน'),
          blurb: L('The morning is for the lanes round Tenjin Nishi-dori in Daimyo, the fashion quarter just west of the station, where Human Made opened its first Kyushu flagship in April 2024. Browse the lane and the streets around it, then at eleven walk five minutes to the gyukatsu.',
                   'ช่วงเช้าเป็นของซอยรอบถนนเท็นจินนิชิโดริในไดเมียว ย่านแฟชั่นทางตะวันตกของสถานี ที่ฮิวแมนเมดเปิดแฟลกชิปแห่งแรกของคิวชูเมื่อเมษายน 2024 เดินเล่นในซอยและถนนรอบๆ แล้วสิบเอ็ดโมงเดินห้านาทีไปกินกิวคัตสึ'),
          refs: { map: 'https://maps.google.com/?q=HUMAN%20MADE%20FUKUOKA%20%E7%A6%8F%E5%B2%A1%E5%B8%82%E4%B8%AD%E5%A4%AE%E5%8C%BA%E5%A4%A7%E5%90%8D2-1-13', official: 'https://humanmade.co.jp/news/20240426/',
                  notes: L('HUMAN MADE FUKUOKA is at Daimyo 2-1-13, tel 092-753-6825, open 11:00 to 19:00 - so it is shut for the first hour of this stop and opens just as the gyukatsu is due. The practical order is to browse from ten, eat at eleven, then call in at Human Made on the way back: it is five minutes on foot from the gyukatsu and five from Tenjin Station for the Kuko Line. Other shops on the lane keep their own hours, so look them up as you go. From the house it is Ohori-koen to Tenjin, two stops and three minutes, then about five minutes on foot west.',
                           'ฮิวแมนเมด ฟุกุโอกะ อยู่ที่ไดเมียว 2-1-13 โทร 092-753-6825 เปิด 11:00 ถึง 19:00 ช่วงชั่วโมงแรกของจุดนี้ร้านจึงยังปิด และเปิดพอดีตอนที่ถึงเวลากินกิวคัตสึ ลำดับที่เหมาะคือเดินดูร้านอื่นตั้งแต่สิบโมง กินข้าวสิบเอ็ดโมง แล้วแวะฮิวแมนเมดตอนเดินกลับ ห่างจากร้านกิวคัตสึเดินห้านาที และห่างสถานีเท็นจินเดินห้านาทีสำหรับขึ้นสายคูโค ร้านอื่นในซอยมีเวลาเปิดของตัวเอง ควรเช็กไปทีละร้าน จากบ้านพักนั่งจากโอโฮริโคเอ็นไปเท็นจินสองสถานี สามนาที แล้วเดินไปทางตะวันตกราวห้านาที') } },

        { type: 'feature', time: '11:00', meridiem: 'Late morning', kind: 'Dining', imageId: 'a-d1-gyukatsu',
          title: L('Gyukatsu Motomura - Tenjin Nishi-dori', 'กิวคัตสึ โมโตมูระ สาขาเท็นจินนิชิโดริ'),
          place: L('Crisp panko beef - grill-your-own, open at 11:00', 'เนื้อชุบเกล็ดขนมปังทอดกรอบ ย่างเองที่โต๊ะ เปิด 11:00'),
          blurb: L('Rare beef in a crisp panko crust, sliced and seared - finish each piece yourself on a little hot stone, with miso soup, barley rice and grated yam. The Nishi-dori branch opens at eleven, so the door on the hour is the shortest queue you will get.',
                   'เนื้อแดงชุบเกล็ดขนมปังทอดกรอบ หั่นเป็นชิ้น เสิร์ฟพร้อมหินร้อนให้ย่างเองทีละชิ้น กินคู่ซุปมิโซะ ข้าวบาร์เลย์ และมันภูเขาขูด สาขานิชิโดริเปิดสิบเอ็ดโมง การไปยืนหน้าร้านตอนเปิดจึงเป็นคิวที่สั้นที่สุดที่จะได้'),
          refs: { map: 'https://maps.google.com/?q=%E7%89%9B%E3%81%8B%E3%81%A4%E3%82%82%E3%81%A8%E6%9D%91%20%E7%A6%8F%E5%B2%A1%E5%A4%A9%E7%A5%9E%E8%A5%BF%E9%80%9A%E3%82%8A%E5%BA%97%20%E7%A6%8F%E5%B2%A1%E5%B8%82%E4%B8%AD%E5%A4%AE%E5%8C%BA%E5%A4%A7%E5%90%8D1-14-5',
                  booking: L('Sets from about Y1,400', 'เซ็ตเริ่มราว 1,400 เยน'),
                  notes: L('Daimyo 1-14-5, tel 092-716-3420. Open 11:00 to 22:00 with no regular closing day, about twenty seats and usually a queue - five minutes on foot from Tenjin Station. Sit down unhurried: nothing else is booked until the shrine at quarter to one. Human Made is five minutes away on foot and has been open since eleven, so call in on the way to the station.',
                           'ที่อยู่ไดเมียว 1-14-5 โทร 092-716-3420 เปิด 11:00 ถึง 22:00 ไม่มีวันหยุดประจำ มีราว 20 ที่นั่งและมักมีคิว เดินจากสถานีเท็นจินห้านาที นั่งกินได้ไม่ต้องรีบ เพราะไม่มีอะไรจองไว้จนถึงศาลเจ้าตอนเที่ยงสี่สิบห้า ฮิวแมนเมดอยู่ห่างเดินห้านาทีและเปิดตั้งแต่สิบเอ็ดโมงแล้ว แวะได้ระหว่างเดินไปสถานี') } },

        { type: 'step', time: '12:30', meridiem: 'Midday', kind: 'Train', icon: 'train',
          title: L('Subway to Nakasu-Kawabata - Kuko Line', 'นั่งรถไฟใต้ดินสายคูโคไปสถานีนากาสึคาวาบาตะ'),
          place: L('Tenjin to Nakasu-Kawabata - one stop, two minutes', 'จากเท็นจินถึงนากาสึคาวาบาตะ หนึ่งสถานี สองนาที'),
          blurb: L('One stop east on the Kuko Line, across the Naka river and into old Hakata. The Kawabata arcade starts beside the station, and Kushida Shrine is five minutes along it.',
                   'นั่งสายคูโคไปทางตะวันออกหนึ่งสถานี ข้ามแม่น้ำนากะเข้าสู่ฮากาตะเมืองเก่า ถนนมีหลังคาคาวาบาตะเริ่มต้นข้างสถานี และเดินไปศาลเจ้าคุชิดะตามถนนนั้นห้านาที'),
          refs: { map: 'https://maps.google.com/?q=Nakasu-Kawabata+Station+Fukuoka',
                  booking: L('IC cards work', 'ใช้บัตร IC ได้') } },

        { type: 'feature', time: '12:45', meridiem: 'Afternoon', kind: 'Shrine', imageId: 'a-hakata-kushida',
          title: L('Kushida Shrine & Hakata Old Town', 'ศาลเจ้าคุชิดะและย่านเมืองเก่าฮากาตะ'),
          place: L('Gion - one subway stop from Hakata', 'ย่านกิอง ห่างจากฮากาตะหนึ่งสถานี'),
          blurb: L('The shrine Hakata grew up around, and the home of the Yamakasa festival. One of the giant decorated floats stands under cover in the grounds all year, so you get to see the thing up close without being here in July. The lanes behind it are the oldest streets in the city.',
                   'ศาลเจ้าที่ย่านฮากาตะเติบโตขึ้นรอบๆ และเป็นบ้านของเทศกาลยามาคาสะ ในบริเวณศาลเจ้ามีเกี้ยวประดับขนาดยักษ์ตั้งอยู่ใต้หลังคาตลอดทั้งปี จึงได้เห็นของจริงใกล้ๆ โดยไม่ต้องมาเดือนกรกฎาคม ส่วนตรอกด้านหลังคือถนนที่เก่าแก่ที่สุดของเมือง'),
          refs: { map: 'https://maps.google.com/?q=Kushida+Shrine+Fukuoka',
                  booking: L('Free - the float hall is a few hundred yen', 'เข้าฟรี ส่วนโถงเกี้ยวเสียไม่กี่ร้อยเยน'),
                  notes: L('The grounds are free and open all day; the float hall is the only part that costs. Five minutes on foot from Nakasu-Kawabata along the end of the Kawabata arcade, or four from Gion station exit 2.',
                           'ลานศาลเจ้าเข้าฟรีและเปิดทั้งวัน มีแค่ห้องจัดแสดงรถแห่ที่เสียค่าเข้า เดินจากสถานีนากาสึคาวาบาตะห้านาทีตามปลายถนนมีหลังคาคาวาบาตะ หรือเดินจากสถานีกิองทางออก 2 สี่นาที') } },

        { type: 'feature', time: '13:30', meridiem: 'Afternoon', kind: 'Temple', imageId: 'a-hakata-tochoji',
          title: L('Tochoji & Shofukuji', 'วัดโทโชจิและวัดโชฟุกุจิ'),
          place: L('Five minutes apart, both in Gion', 'สองวัดห่างกันห้านาที อยู่ในย่านกิองทั้งคู่'),
          blurb: L('Tochoji holds the largest seated wooden Buddha in Japan - 10.8 metres of carved cypress, with a gilded halo behind it rising to 16 metres and five thousand small Buddhas set into the back wall. A dark passage runs underneath it that you feel your way through in total blackness. Shofukuji, five minutes north, is the first Zen temple ever built in Japan and almost nobody goes: a walled precinct of gravel, pines and silence.',
                   'วัดโทโชจิประดิษฐานพระพุทธรูปไม้ปางประทับนั่งที่ใหญ่ที่สุดในญี่ปุ่น แกะจากไม้ฮิโนกิสูง 10.8 เมตร ด้านหลังมีประภามณฑลปิดทองสูงถึง 16 เมตร และผนังด้านหลังประดิษฐานพระพุทธรูปองค์เล็กห้าพันองค์ ใต้ฐานพระมีทางเดินมืดสนิทให้คลำทางผ่านไป ส่วนวัดโชฟุกุจิที่อยู่ถัดขึ้นไปห้านาทีคือวัดเซนแห่งแรกที่สร้างขึ้นในญี่ปุ่น และแทบไม่มีคนเข้า เป็นเขตกำแพงที่มีแต่ลานกรวด ต้นสน และความเงียบ'),
          refs: { map: 'https://maps.google.com/?q=Tochoji+Temple+Fukuoka',
                  booking: L('Buddha hall about 50-100 yen - Shofukuji grounds free', 'วิหารพระใหญ่ราว 50 ถึง 100 เยน ส่วนลานวัดโชฟุกุจิเข้าฟรี'),
                  notes: L('No photography inside the Buddha hall. Shofukuji opens its grounds only, the halls stay shut, and it closes at dusk.',
                           'ห้ามถ่ายรูปในวิหารพระใหญ่ ส่วนโชฟุกุจิเปิดเฉพาะลานวัด ตัววิหารไม่เปิดให้เข้า และปิดตอนพลบค่ำ') } },

        { type: 'feature', time: '14:40', meridiem: 'Afternoon', kind: 'Market', imageId: 'a-hakata-kawabata',
          title: L('Kawabata Arcade', 'ถนนมีหลังคาคาวาบาตะ'),
          place: L('The oldest shopping street in Fukuoka', 'ถนนช้อปปิ้งที่เก่าแก่ที่สุดของฟุกุโอกะ'),
          blurb: L('Four hundred metres of covered arcade that has been trading for over a century - old sweet shops, tea, knives, dried fish, secondhand kimono. Halfway along is a hall that serves nothing but Hakata zenzai, a thick sweet red bean soup with grilled mochi dropped into it.',
                   'ถนนมีหลังคายาวสี่ร้อยเมตรที่ค้าขายมากว่าร้อยปี มีทั้งร้านขนมเก่าแก่ ร้านชา ร้านมีด ปลาแห้ง และกิโมโนมือสอง ตรงกลางถนนมีโถงที่ขายอย่างเดียวคือเซนไซแบบฮากาตะ ซุปถั่วแดงหวานข้นใส่โมจิย่าง'),
          refs: { map: 'https://maps.google.com/?q=Kawabata+Shopping+Arcade+Fukuoka',
                  booking: L('Zenzai about 600 yen a bowl', 'เซนไซราวถ้วยละ 600 เยน'),
                  notes: L('The arcade trades every day, but the zenzai hall opens Friday to Sunday and on public holidays only - today is a Thursday, so expect it shut and take the arcade for what it is.',
                           'ตัวถนนเปิดขายทุกวัน แต่โถงเซนไซเปิดเฉพาะวันศุกร์ถึงวันอาทิตย์และวันหยุดนักขัตฤกษ์ วันนี้เป็นวันพฤหัสบดีจึงน่าจะปิด ให้เดินชมตัวถนนไปตามปกติ') } },

        { type: 'feature', time: '15:05', meridiem: 'Afternoon', kind: 'Sweets', imageId: 'a-hakata-suzukake',
          title: L('Suzukake Honten - Hakata wagashi', 'ซูซูกาเกะสาขาใหญ่ ขนมญี่ปุ่นแบบฮากาตะ'),
          place: L('Kamikawabata - a tea room beside the sweet shop', 'คามิคาวาบาตะ ห้องน้ำชาข้างร้านขนม'),
          blurb: L('The Hakata wagashi house locals take as a gift when it matters - small seasonal sweets and the bell-shaped suzu-no-monaka wafers filled with bean paste - with a tea room beside the shop where you can sit down with a sweet and a pot of tea, or one of its Japanese parfaits. It is by the Kawabata arcade, a minute from Nakasu-Kawabata station, so it follows straight on from the arcade.',
                   'ร้านขนมญี่ปุ่นของฮากาตะที่คนท้องถิ่นซื้อเป็นของฝากในโอกาสสำคัญ มีขนมตามฤดูชิ้นเล็กๆ และซูซุโนะโมนากะ ขนมแป้งกรอบรูปกระดิ่งไส้ถั่วแดง ข้างร้านมีห้องน้ำชาให้นั่งกินขนมกับชาร้อน หรือสั่งพาร์เฟต์แบบญี่ปุ่นของร้าน ตัวร้านอยู่ข้างถนนคาวาบาตะ ห่างสถานีนากาสึคาวาบาตะหนึ่งนาที จึงต่อจากถนนมีหลังคาได้เลย'),
          refs: { map: 'https://maps.google.com/?q=%E9%88%B4%E6%87%B8+%E6%9C%AC%E5%BA%97+%E4%B8%8A%E5%B7%9D%E7%AB%AF%E7%94%BA',
                  notes: L('Tel 092-291-0050, Nakasu-Kawabata station exit 5. The shop is open 09:00-19:00 and the tea room 11:00-19:00, last orders for sweets 18:30; closed only on 1 and 2 January. The tea room queues at lunchtime, which is why it comes mid-afternoon. The boxed sweets keep for a few days, so this is the place to buy gifts to take home.',
                           'โทร 092-291-0050 สถานีนากาสึคาวาบาตะทางออก 5 ร้านขนมเปิด 09:00 ถึง 19:00 ห้องน้ำชาเปิด 11:00 ถึง 19:00 รับออร์เดอร์ขนมสุดท้าย 18:30 หยุดแค่วันที่ 1 และ 2 มกราคม ห้องน้ำชามีคิวช่วงเที่ยง จึงวางไว้ช่วงบ่ายแก่ๆ ขนมแบบกล่องเก็บได้หลายวัน ที่นี่จึงเหมาะซื้อเป็นของฝากกลับบ้าน') } },

        { type: 'feature', time: '16:00', meridiem: 'Afternoon', kind: 'Garden', imageId: 'a-hakata-rakusuien',
          title: L('Rakusuien & Sumiyoshi Shrine', 'สวนราคุซุยเอนและศาลเจ้าสุมิโยชิ'),
          place: L('A walled tea garden behind Hakata', 'สวนน้ำชาในกำแพงหลังย่านฮากาตะ'),
          blurb: L('A Meiji merchant villa garden kept behind a wall of Hakata clay, with a pond, a tea house and matcha served on the tatami looking out at it. Sumiyoshi Shrine is a couple of minutes away through the trees - one of the oldest Sumiyoshi shrines in the country, and on a weekday afternoon you will have it to yourselves.',
                   'สวนในบ้านพักของพ่อค้าสมัยเมจิ ล้อมด้วยกำแพงดินแบบฮากาตะ ข้างในมีบ่อน้ำ เรือนน้ำชา และมัทฉะที่เสิร์ฟบนเสื่อทาทามิให้นั่งมองสวน ส่วนศาลเจ้าสุมิโยชิอยู่ห่างออกไปสองนาทีผ่านดงไม้ เป็นศาลเจ้าสุมิโยชิที่เก่าแก่ที่สุดแห่งหนึ่งของประเทศ และบ่ายวันธรรมดาแทบจะมีกันอยู่กลุ่มเดียว'),
          refs: { map: 'https://maps.google.com/?q=Rakusuien+Fukuoka',
                  booking: L('Garden 100 yen - matcha with a sweet about 500 yen', 'ค่าเข้าสวน 100 เยน ส่วนมัทฉะพร้อมขนมราว 500 เยน'),
                  notes: L('Open 09:00 to 17:00 with last entry at 16:30, closed Tuesdays. Shoes off for the tea house, so wear socks. It is fourteen minutes on foot from the Kawabata arcade and the garden shuts at 17:00, so do not linger over the sweets before it - Canal City is six minutes on.',
                           'เปิดเวลา 09:00 ถึง 17:00 ปิดรับเข้า 16:30 หยุดวันอังคาร เข้าเรือนน้ำชาต้องถอดรองเท้า ควรใส่ถุงเท้าไปด้วย สวนนี้อยู่ห่างจากถนนคาวาบาตะเดินราว 14 นาที และปิด 17:00 จึงไม่ควรนั่งกินขนมนานก่อนมาที่นี่ ส่วนคาแนลซิตี้อยู่ห่างไปอีกหกนาที') } },

        { type: 'feature', time: '17:15', meridiem: 'Evening', kind: 'Wander', imageId: 'a-d10-canal',
          title: L('Canal City Hakata', 'คาแนลซิตี้ ฮากาตะ'),
          place: L('Curved mall with a canal through it', 'ห้างทรงโค้งที่มีคลองผ่ากลาง'),
          blurb: L('A curved, coloured mall built around an actual canal, with a fountain show on the hour against the building.',

        { type: 'feature', time: '18:45', meridiem: 'Evening', kind: 'Dining', imageId: 'a-d10-ramen',
          title: L('Hakata Issou - the foam bowl, Hakata-eki Higashi', 'ฮากาตะ อิสโซ ราเมงฟองนุ่ม ย่านฮากาตะเอกิฮิงาชิ'),
          place: L('Cappuccino-style tonkotsu - by Hakata Station, open to midnight', 'ทงคตสึฟองนุ่มแบบคาปูชิโน ข้างสถานีฮากาตะ เปิดถึงเที่ยงคืน'),
          blurb: L('The bowl the city queues hardest for. Issou boils its pork bones so hard the broth comes out capped in a fine foam, thick as a cappuccino, over firm thin noodles - the shop that made the awa-kei style famous. On the east side of Hakata Station with the torikawa on the same block, so the ramen goes first and the skewers close the day.',

        { type: 'feature', time: '19:45', meridiem: 'Night', kind: 'Dining', imageId: 'a-hakata-torikawa',
          title: L('Hakata Torikawa Daijin', 'ฮากาตะ โทริคาวะ ไดจิน'),
          place: L('Chicken-skin skewers - the Fukuoka speciality', 'ไม้ย่างหนังไก่ ของขึ้นชื่อประจำฟุกุโอกะ'),
          blurb: L('Torikawa is Fukuoka\'s own yakitori: chicken skin wound tight around a skewer and turned over the coals again and again across several days until the fat has rendered away and the outside is lacquered and crisp. They arrive in tens, sweet or salt, and the first ten go faster than you expect. Order the rest of the yakitori while you wait.',

function ResValue({ value }) {
  const { x, r } = useT();
  return (
    <div className="dock-res">
      <div className="dock-res-row"><span className="dock-res-k">{r('Time')}</span><span className="dock-res-v">{value.time}</span></div>
      <div className="dock-res-row"><span className="dock-res-k">{r('Confirmation')}</span><span className="dock-res-v mono">{value.code}</span></div>
      <div className="dock-res-row"><span className="dock-res-k">{r('Party')}</span><span className="dock-res-v">{x(value.party)}</span></div>
    </div>
  );
}

function RefValue({ type, value }) {
  const { x } = useT();
  if (type.kind === 'reservation') return <ResValue value={value} />;
  if (type.kind === 'link') {
    let host = value;
    try { host = new URL(value).hostname.replace(/^www\./, ''); } catch (e) {}
    return (
      <a className="dock-link" href={value} target="_blank" rel="noopener noreferrer">
        <span className="dock-link-url">{host}</span>
        <Icon name="arrowUpRight" size={14} stroke={1.4} />
      </a>
    );
  }
  if (type.key === 'notes') return <p className="dock-notes">{x(value)}</p>;
  return <p className="dock-text">{x(value)}</p>;
}

function ReferenceDock({ refs, variant = 'inline' }) {
  const { x } = useT();
  const present = REF_TYPES.filter((t) => refs && refs[t.key] != null);
  const [active, setActive] = useState(null);
  if (!present.length) return null;

  if (variant === 'expanded') {
    return (
      <div className="dock dock-expanded">
        {present.map((t) => (
          <div className="dock-card" key={t.key}>
            <div className="dock-card-hd">
              <Icon name={t.icon} size={16} stroke={1.3} />
              <span className="dock-card-label">{x(t.label)}</span>
            </div>
            <div className="dock-card-body"><RefValue type={t} value={refs[t.key]} /></div>
          </div>
        ))}
      </div>
    );
  }

  const activeType = present.find((t) => t.key === active);
  return (
    <div className={'dock' + (active ? ' is-open' : '')}>
      <div className="dock-rail">
        {present.map((t) => (
          <button
            key={t.key}
            type="button"
            className={'dock-chip' + (active === t.key ? ' active' : '')}
            onClick={() => setActive(active === t.key ? null : t.key)}
          >
            <Icon name={t.icon} size={15} stroke={1.3} />
            <span className="dock-chip-label">{x(t.label)}</span>
          </button>
        ))}
      </div>
      <div className="dock-drawer" style={{ gridTemplateRows: active ? '1fr' : '0fr' }}>
        <div className="dock-drawer-inner">
          {activeType ? (
            <div className="dock-detail" key={activeType.key}>
              <RefValue type={activeType} value={refs[activeType.key]} />
            </div>
          ) : null}
        </div>
      </div>
    </div>
  );
}

// -- reveal-on-scroll hook ----------------------------------------------
function useInView() {
  const ref = useRef(null);
  useEffect(() => {
    const el = ref.current;
    if (!el) return;
    const io = new IntersectionObserver(
      (entries) => entries.forEach((e) => { if (e.isIntersecting) el.classList.add('in'); }),
      { threshold: 0.16 }
    );
    io.observe(el);
    return () => io.disconnect();
  }, []);
  return ref;
}

// -- Per-day konbini - nearest store to that night's stay ----------------
function konbiniForDay(day) {
  if (!window.KONBINI || !window.KONBINI.areas) return null;
  const n = parseInt((day.label.match(/\d+/) || [])[0], 10);
  if (!n) return null;
  return window.KONBINI.areas.find((ar) => {
    const nums = (ar.days.en.match(/\d+/g) || []).map(Number);
    if (nums.length === 1) return nums[0] === n;
    if (nums.length >= 2) return n >= nums[0] && n <= nums[nums.length - 1];
    return false;
  }) || null;
}

function DayKonbini({ area }) {
  const { x } = useT();
  if (!area) return null;
  const cats = [

// A day may carry `plans` (Plan A / Plan B): the chosen plan decides which activities and which overview note show.
// The choice is remembered per day in localStorage, so reopening the app lands on the plan you were using.
function readPlan(day) {
  try { return localStorage.getItem('jp-plan-' + day.label) || 'A'; } catch (e) { return 'A'; }
}

function Timeline({ day, onOpen }) {
  const { x, lang } = useT();
  const [picked, setPicked] = React.useState({});
  const plan = day.plans
    ? (day.plans.find((p) => p.id === (picked[day.label] || readPlan(day))) || day.plans[0])
    : null;
  const choosePlan = (id) => {
    setPicked(Object.assign({}, picked, { [day.label]: id }));
    try { localStorage.setItem('jp-plan-' + day.label, id); } catch (e) { /* private mode: the choice just will not stick */ }
  };
  const acts = plan ? plan.activities : day.activities;
  const note = plan && plan.note ? plan.note : day.note;
  return (
    <section className="day" key={day.label}>
      <header className="day-head">
        <div className="day-head-row">
          <span className="day-label">{lang === 'th' ? day.labelTh : day.label}</span>
          <span className="day-rule" aria-hidden="true"></span>
          <span className="day-date">{x(day.date)}</span>
          <DayWeather wx={weatherForDay(day)} note={window.WEATHER && window.WEATHER.note} />
        </div>
        <h2 className="day-title">{x(day.title)}</h2>
        <p className="day-sub">{x(day.subtitle)}</p>
        <p className="day-note">{x(note)}</p>
        {plan ? (
          <div className="plan-switch" role="tablist" aria-label={x({ en: 'Choose a plan for this day', th: 'เลือกแผนของวันนี้' })}>
            {day.plans.map((p) => (
              <button key={p.id} type="button" role="tab" aria-selected={p.id === plan.id}
                className={'plan-btn' + (p.id === plan.id ? ' on' : '')} onClick={() => choosePlan(p.id)}>
                <span className="plan-btn-k">{x(p.label)}</span>
                <span className="plan-btn-s">{x(p.tag)}</span>
              </button>
            ))}
          </div>
        ) : null}
      </header>

      {day.visitJapan ? <VisitJapanBox /> : null}

      <DayKonbini area={konbiniForDay(day)} />

      <div className="timeline">
        {acts.map((a, i) => (
          <ActivityBlock key={(plan ? plan.id + '-' : '') + (a.imageId || (a.kind + a.time))} a={a} index={i} onOpen={onOpen} />
        ))}
      </div>
    </section>
  );
}

// -- Clock - live dual-timezone (home <-> Japan), updates every second -----
function useNow() {
  const [now, setNow] = useState(() => new Date());
  useEffect(() => {
    const id = setInterval(() => setNow(new Date()), 1000);
    return () => clearInterval(id);
  }, []);
  return now;
}
function fmtTime(date, tz) {
  try {
    return new Intl.DateTimeFormat('en-GB', { hour: '2-digit', minute: '2-digit', second: '2-digit', hour12: false, timeZone: tz }).format(date);
  } catch (e) { return '--:--:--'; }
}
// Day/month/year out of a localized date line, e.g. "Saturday - 21 Nov 2026"
// or the Thai "เสาร์ 21 พฤศจิกายน 2026".
const TH_MONTH_SHORT = {
  'มกราคม': 'ม.ค.', 'กุมภาพันธ์': 'ก.พ.', 'มีนาคม': 'มี.ค.', 'เมษายน': 'เม.ย.',
  'พฤษภาคม': 'พ.ค.', 'มิถุนายน': 'มิ.ย.', 'กรกฎาคม': 'ก.ค.', 'สิงหาคม': 'ส.ค.',
  'กันยายน': 'ก.ย.', 'ตุลาคม': 'ต.ค.', 'พฤศจิกายน': 'พ.ย.', 'ธันวาคม': 'ธ.ค.',
};
function dateParts(s) {
  const m = String(s || '').match(/(\d{1,2})\s+(\S+)\s+(\d{4})/);
  return m ? { day: m[1], month: m[2], year: m[3] } : null;
}
function shortMonth(m) { return TH_MONTH_SHORT[m] || String(m).slice(0, 3); }

// Trip date range from the itinerary days, e.g. "21-29 Nov 2026" / "21-29 พ.ย. 2026"
function tripDateRange(x) {
  const days = (window.TRIP && window.TRIP.days) || [];
  if (!days.length) return '';
  const a = dateParts(x(days[0].date)), b = dateParts(x(days[days.length - 1].date));
  if (!a || !b) return '';
  return a.month === b.month
    ? a.day + '-' + b.day + ' ' + shortMonth(a.month) + ' ' + b.year
    : a.day + ' ' + shortMonth(a.month) + ' - ' + b.day + ' ' + shortMonth(b.month) + ' ' + b.year;
}

function Clock({ variant = 'chrome' }) {
  const { x } = useT();
  const now = useNow();
  const jp = fmtTime(now, 'Asia/Tokyo');
  const bkk = fmtTime(now, 'Asia/Bangkok');
  if (variant === 'chrome') {
    const dateStr = now.toLocaleDateString('en-GB', { timeZone: 'Asia/Tokyo', day: 'numeric', month: 'short', year: 'numeric' });
    const jpHM = jp.split(':').slice(0, 2).join(':');
    return (
      <div className="clock-chrome" title="Trip dates - now (JST)">
        <span className="clock-trip">{tripDateRange(x)}</span>
        <span className="clock-now mono">{dateStr} - <span className="clock-zone">JP</span>{jpHM}</span>
      </div>
    );
  }
  // 'panel' - the larger dual clock used on the Overview screen
  return (
    <div className="clock-panel">
      <div className="clock-cell">
        <span className="clock-cell-zone">{x({ en: 'Japan - Tokyo', th: 'ญี่ปุ่น - โตเกียว' })}</span>
        <span className="clock-cell-time mono">{jp}</span>
      </div>
      <span className="clock-div" aria-hidden="true"></span>
      <div className="clock-cell">
        <span className="clock-cell-zone">{x({ en: 'Home - Bangkok', th: 'บ้าน - กรุงเทพฯ' })}</span>
        <span className="clock-cell-time mono">{bkk}</span>
      </div>
    </div>
  );
}

// One-line live local date + time (JST) - sits beneath the trip date in the centered nav block
function NowLine() {
  const now = useNow();
  const dateStr = now.toLocaleDateString('en-GB', { timeZone: 'Asia/Tokyo', day: 'numeric', month: 'short', year: 'numeric' });
  const jp = fmtTime(now, 'Asia/Tokyo');
  const jpHM = jp.split(':').slice(0, 2).join(':');
  return <span className="chrome-now-live mono">{dateStr} - <span className="clock-zone">JP</span>{jpHM}</span>;

// -- RouteMap - animated multi-city route on the Overview screen ---------
function RouteMap({ route, onJump }) {
  const { x } = useT();
  const ref = useInView();
  // draw the route as a clean closed loop: order stops by angle around their centroid (no crossings)
  const cx = route.reduce((a, s) => a + s.mx, 0) / route.length;
  const cy = route.reduce((a, s) => a + s.my, 0) / route.length;
  const ring = route.slice().sort((a, b) => Math.atan2(a.my - cy, a.mx - cx) - Math.atan2(b.my - cy, b.mx - cx));
  const startAt = Math.max(0, ring.findIndex((s) => s.start));
  const loop = ring.slice(startAt).concat(ring.slice(0, startAt));
  const d = loop.map((s, i) => (i === 0 ? 'M' : 'L') + s.mx + ',' + (s.my * 1.35).toFixed(2)).join(' ') + ' Z';
  return (
    <div className="jmap" ref={ref}>
      <div className="jmap-base">
        <svg className="jmap-geo" viewBox="0 0 100 135.1" preserveAspectRatio="none" aria-hidden="true">
          <path className="jmap-land" d={KYUSHU_GEO} />
        </svg>
        <span className="jmap-veil" aria-hidden="true"></span>
      </div>
      <svg className="jmap-svg" viewBox="0 0 100 135" preserveAspectRatio="none" aria-hidden="true">
        <path id="jmapRoute" className="jmap-path" d={d} pathLength="100" fill="none" />
        <circle className="jmap-comet" r="1.7">
          <animateMotion dur="6.5s" repeatCount="indefinite" calcMode="linear" rotate="0">
            <mpath href="#jmapRoute" />
          </animateMotion>
        </circle>
      </svg>
      {route.map((s, i) => (
        <button className={'jmap-node' + (s.start ? ' is-start' : '')} key={i} style={{ left: s.mx + '%', top: s.my + '%', '--i': i }}
          onClick={() => onJump(s.day)} aria-label={x(s.city)}>
          {s.start ? <span className="jmap-flag">{x({ en: 'Start \u00b7 End', th: '\u0e40\u0e23\u0e34\u0e48\u0e21 \u00b7 \u0e08\u0e1a' })}</span> : null}
          <span className="jmap-pin" aria-hidden="true"></span>
          <span className="jmap-label">
            <span className="jmap-city">{x(s.city)}</span>
            <span className="jmap-days">{x(s.days)}</span>
          </span>
        </button>
      ))}
    </div>
  );
}

// -- Morning run route map ------------------------------------------------
// The map geometry travels with the data (RUNROUTE.map): SVG path strings
// projected from OpenStreetMap into a 0 0 100 76 viewBox. Stop `x`/`y` are
// percentages of the same canvas, so the pins land on the route line.
function RunRouteMap({ data }) {
  const { x } = useT();
  const ref = useInView();
  const [active, setActive] = React.useState(null);
  const stops = data.stops || [];
  const map = data.map || {};
  const total = parseFloat(data.distance) || 1;
  // elevation profile from each stop's height in metres
  const elev = stops.map((s) => ({ km: parseFloat(s.km), m: s.m || 0 }));
  const elevPts = elev.map((e) => (e.km / total) * 100 + ',' + (26 - (e.m / 40) * 22).toFixed(1)).join(' ');
  // keep tooltips inside the canvas near its edges
  const tipClass = (s) => (s.y < 24 ? ' tip-down' : '') + (s.x < 24 ? ' tip-left' : s.x > 76 ? ' tip-right' : '');

  return (
    <div className="runmap" ref={ref}>
      <div className="runmap-stats">
        {(data.stats || []).map((s, i) => (
          <div className="runstat" key={i} style={{ '--i': i }}>
            <span className="runstat-ic"><Icon name={s.icon} size={14} stroke={1.5} /></span>
            <span className="runstat-v">{x(s.v)}</span>
            <span className="runstat-k">{x(s.k)}</span>
          </div>
        ))}
      </div>

      <div className="runmap-canvas">
        <svg viewBox="0 0 100 76" className="runmap-svg" role="img" aria-label={x(data.title)}>
          <defs>
            <linearGradient id="runWater" x1="0" y1="0" x2="0" y2="1">
              <stop offset="0%" stopColor="var(--accent)" stopOpacity="0.30" />
              <stop offset="100%" stopColor="var(--accent)" stopOpacity="0.12" />
            </linearGradient>
          </defs>
          {map.roads ? <path className="runmap-road" d={map.roads} fill="none" /> : null}
          {map.rail ? <path className="runmap-rail" d={map.rail} fill="none" /> : null}
          {map.green ? <path className="runmap-park" d={map.green} /> : null}
          {(map.rivers || []).map((r, i) => (
            <path key={i} className="runmap-river" d={r.d} fill="none" style={{ strokeWidth: r.w }} />
          ))}
          {map.water ? <path className="runmap-lake" d={map.water} fill="url(#runWater)" /> : null}
          {(map.labels || []).map((l, i) => (
            <text key={i} className="runmap-name" x={l.x} y={l.y}>{x(l.t)}</text>
          ))}
          <path className="runmap-line-case" d={map.route} fill="none" />
          <path id="runRoute" className="runmap-line" d={map.route} pathLength="100" fill="none" />
          <circle className="runmap-dot" r="1.5">
            <animateMotion dur={Math.round(total * 1.6) + 's'} repeatCount="indefinite" calcMode="linear" rotate="0">
              <mpath href="#runRoute" />
            </animateMotion>
          </circle>
        </svg>
        {stops.map((s, i) => (
          <button key={i} type="button"
            className={'runpin is-' + s.kind + (active === i ? ' is-on' : '') + tipClass(s) + (s.flagSide ? ' flag-' + s.flagSide : '')}
            style={{ left: s.x + '%', top: s.y + '%', '--i': i }}
            onClick={() => { const n = active === i ? null : i; setActive(n);
              if (n !== null) setTimeout(() => { const el = document.querySelectorAll('.runsteps > li')[n]; if (el) el.scrollIntoView({ behavior: 'smooth', block: 'center' }); }, 60); }}
            aria-label={x(s.name)}>
            {s.flag ? <span className="runpin-flag">{x(s.flag)}</span> : null}
            <span className="runpin-dot">{s.kind === 'finish' ? <Icon name="bowl" size={11} stroke={1.8} /> : i + 1}</span>
            <span className="runpin-tip">{x(s.name)}<b>{s.km} {x(data.unit)}</b></span>
          </button>
        ))}
      </div>

      <div className="runmap-elev">
        <svg viewBox="0 0 100 28" preserveAspectRatio="none" aria-hidden="true">
          <polyline className="runelev-line" points={elevPts} fill="none" />
          <polygon className="runelev-fill" points={'0,28 ' + elevPts + ' 100,28'} />
        </svg>
        <div className="runmap-elev-ax">
          <span>0 {x(data.unit)}</span>
          <span>{x(data.elevNote || '')}</span>
          <span>{data.distance} {x(data.unit)}</span>
        </div>
      </div>

      <ol className="runsteps">
        {stops.map((s, i) => (
          <li key={i} className={active === i ? 'is-on' : ''}>
            <button type="button" className="runstep" onClick={() => setActive(active === i ? null : i)}>
              <span className={'runstep-n is-' + s.kind}>{s.kind === 'finish' ? <Icon name="bowl" size={13} stroke={1.7} /> : i + 1}</span>
              <span className="runstep-body">

    const onReady = function () { setBip(window.__bip); };
    window.addEventListener('bip-ready', onReady);

  }, []);
  const standalone = (typeof window !== 'undefined') && ((window.matchMedia && window.matchMedia('(display-mode: standalone)').matches) || window.navigator.standalone === true);
  if (standalone || off) return null;

function bkCategory(a) {
  const k = (a.kind || '').toLowerCase();
  if (k === 'flight' || k === 'departure' || a.icon === 'plane') return 'flight';
  if (k === 'check-in' || k === 'onsen') return 'stay';
  if (['train', 'shinkansen', 'journey', 'ferry', 'bus', 'transfer'].includes(k) || a.icon === 'train' || a.icon === 'car') return 'transit';
  if (['dining', 'coffee'].includes(k)) return 'dining';
  return 'entry';
}

function bkShortDate(dateObj, lang) {
  const p = dateParts(window.tx(dateObj, lang));
  return p ? p.day + ' ' + shortMonth(p.month) : '';
}

function collectBookings(trip) {
  const reservations = [];
  const passes = [];
  trip.days.forEach((d, di) => {
    d.activities.forEach((a) => {
      if (!a.refs) return;
      if (a.refs.reservation) reservations.push({ a, di, day: d, cat: bkCategory(a) });
      else if (a.refs.booking) passes.push({ a, di, day: d });
    });
  });
  return { reservations, passes };
}

// -- BookingsList - reservations + passes (Bookings -> "Bookings" tab) ----
function BookingsList({ trip, lang }) {
  const { x } = useT();
  const { reservations, passes } = collectBookings(trip);
  const [booked, setBooked] = useState(() => {
    try { return JSON.parse(localStorage.getItem('jp-booked') || '{}'); } catch (e) { return {}; }
  });
  const toggle = (code) => setBooked((prev) => {
    const n = { ...prev, [code]: !prev[code] };
    try { localStorage.setItem('jp-booked', JSON.stringify(n)); } catch (e) {}
    return n;
  });
  const total = reservations.length;
  const doneCount = reservations.filter((it) => booked[it.a.refs.reservation.code]).length;
  const pct = total ? doneCount / total : 0;
  return (
    <div className="bk-list">
      <div className="bk-progress" style={{ '--p': pct }}>
        <div className="bk-progress-top">
          <span className="bk-progress-k">{x({ en: 'Booking progress', th: 'ความคืบหน้าการจอง' })}</span>
          <span className="bk-progress-v"><b>{doneCount}</b> / {total} {x({ en: 'confirmed', th: 'จองแล้ว' })}</span>
        </div>
        <span className="bk-progress-bar"><span className="bk-progress-fill"></span></span>
      </div>
      {BK_CATS.map((cat) => {
        const items = reservations.filter((it) => it.cat === cat.key);
        if (!items.length) return null;
        return (
          <section className="bk-sec" key={cat.key}>
            <div className="bk-sec-head">
              <span className="bk-sec-ic"><Icon name={cat.icon} size={18} stroke={1.3} /></span>
              <h2 className="bk-sec-title">{x(cat.label)}</h2>
              <span className="bk-sec-count">{items.length}</span>
            </div>
            <div className="bk-grid">
              {items.map((it, i) => (
                <BookingCard key={it.a.refs.reservation.code + i} item={it} booked={booked} onToggle={toggle} lang={lang} />

            </div>

        );
      })}

        <section className="bk-sec">
          <div className="bk-sec-head">

            <span className="bk-sec-count">{passes.length}</span>

// -- Expenses - shared-trip spending log (÷4) ----------------------------
function Expenses() {
  const { x } = useT();
  const [items, setItems] = useState(() => {
    try { return JSON.parse(localStorage.getItem('jp-expenses') || '[]'); } catch (e) { return []; }
  });
  const [amt, setAmt] = useState('');
  const [note, setNote] = useState('');
  const save = (list) => { setItems(list); try { localStorage.setItem('jp-expenses', JSON.stringify(list)); } catch (e) {} };
  const add = () => {
    const a = parseFloat((amt || '').toString().replace(/,/g, ''));
    if (!a || a <= 0) return;
    save([{ id: 'e' + Date.now(), a, n: (note || '').trim() || '-' }, ...items]);
    setAmt(''); setNote('');
  };
  const remove = (id) => save(items.filter((it) => it.id !== id));
  const total = items.reduce((s, it) => s + it.a, 0);
  const per = total / 4;
  const fmt = (v) => '฿' + v.toLocaleString('en-US', { maximumFractionDigits: 0 });
  return (
    <section className="party exp">
      <div className="party-head">
        <span className="ov-kicker">{x({ en: 'Expenses', th: 'ค่าใช้จ่าย', ja: '支出' })}</span>
        <h2 className="ov-h2">{x({ en: 'Trip spending', th: 'บันทึกค่าใช้จ่าย', ja: '支出メモ' })}</h2>
      </div>
      <div className="exp-totals">
        <div className="exp-tot"><span className="exp-tot-k">{x({ en: 'Total', th: 'รวมทั้งหมด', ja: '合計' })}</span><span className="exp-tot-v">{fmt(total)}</span></div>
        <div className="exp-tot exp-tot-split"><span className="exp-tot-k">{x({ en: 'Each ÷ 4', th: 'หาร 4 คน', ja: '1人 ÷4' })}</span><span className="exp-tot-v">{fmt(per)}</span></div>
      </div>
      <div className="exp-add">
        <input className="exp-in exp-amt" type="number" inputMode="numeric" placeholder="฿0" value={amt} onChange={(e) => setAmt(e.target.value)} aria-label="Amount" />
        <input className="exp-in exp-note" type="text" placeholder={x({ en: 'What for?', th: 'ค่าอะไร?', ja: '何に?' })} value={note} onChange={(e) => setNote(e.target.value)} onKeyDown={(e) => { if (e.key === 'Enter') add(); }} aria-label="Note" />
        <button className="exp-add-btn" onClick={add} aria-label="Add"><Icon name="plus" size={17} stroke={2} /></button>
      </div>
      {items.length ? (
        <ul className="exp-list">
          {items.map((it) => (
            <li className="exp-row" key={it.id}>
              <span className="exp-row-n">{it.n}</span>
              <span className="exp-row-a">{fmt(it.a)}</span>
              <button className="exp-row-x" onClick={() => remove(it.id)} aria-label="Remove"><Icon name="close" size={13} stroke={2} /></button>
            </li>
          ))}
        </ul>
      ) : (
        <p className="exp-empty">{x({ en: 'No expenses yet - add one above.', th: 'ยังไม่มีรายการ เพิ่มด้านบนได้เลย', ja: 'まだ記録なし' })}</p>
      )}
    </section>
  );
}

// -- Wallet - converter + shared-expense splitter (by traveller) ---------
const THB_PER_YEN = 22.6 / 100;

function WalletPage({ onHome, lang }) {
  const { x } = useT();
  const people = (window.TRAVELERS && window.TRAVELERS.people) || [];
  const names = people.map((p) => x(p.name));

  const [items, setItems] = useState(() => { try { return JSON.parse(localStorage.getItem('jp-wallet') || '[]'); } catch (e) { return []; } });
  const save = (list) => { setItems(list); try { localStorage.setItem('jp-wallet', JSON.stringify(list)); } catch (e) {} };

  const [amt, setAmt] = useState('');
  const [cur, setCur] = useState('jpy');
  const [label, setLabel] = useState('');
  const [payers, setPayers] = useState(() => names.map((_, i) => i));

  const yenOf = (it) => it.cur === 'jpy' ? it.amt : it.amt / THB_PER_YEN;
  const thbOf = (it) => it.cur === 'thb' ? it.amt : it.amt * THB_PER_YEN;
  const fmtY = (v) => '¥' + Math.round(v).toLocaleString('en-US');
  const fmtB = (v) => '฿' + Math.round(v).toLocaleString('en-US');

  const togglePayer = (i) => setPayers((p) => p.includes(i) ? p.filter((k) => k !== i) : [...p, i].sort((a, b) => a - b));
  const add = () => {
    const a = parseFloat((amt || '').toString().replace(/,/g, ''));
    if (!a || a <= 0 || !payers.length) return;
    save([{ id: 'w' + Date.now(), amt: a, cur, label: (label || '').trim() || x({ en: 'Expense', th: 'รายการ', ja: '支出' }), payers: [...payers] }, ...items]);
    setAmt(''); setLabel('');
  };
  const remove = (id) => save(items.filter((it) => it.id !== id));

  const perPersonYen = names.map((_, i) => items.reduce((s, it) => s + (it.payers.includes(i) ? yenOf(it) / it.payers.length : 0), 0));
  const totalYen = items.reduce((s, it) => s + yenOf(it), 0);

  return (
    <div className="bookings">
      <Chrome onHome={onHome} />
      <main className="bk-stage">
        <section className="bk-hero">
          <span className="ov-kicker">{x({ en: 'Money', th: 'การเงิน', ja: 'お金' })}</span>
