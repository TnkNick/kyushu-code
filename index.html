        { type: 'feature', time: '20:00', meridiem: 'Night', kind: 'Dining', imageId: 'a-d4-basashi',
          title: L('Izakaya Revolution Yotteba - Shimotori', 'อิซากายะเรฟโวลูชัน โยตเตบะ สาขาชิโมโทริ'),
          place: L('Chicken wings, basashi and a long sit', 'ปีกไก่ บาซาชิ และนั่งยาวๆ'),
          blurb: L('A 171-seat Kumamoto izakaya built for staying put. Its tebasaki at Y290 a plate took gold at the 2024 Tebasaki Summit, the gyoza run with juice, and basashi is on the menu - the raw horse Kumamoto is genuinely known for - so you get the local dish without a second booking. There is a two-hour all-you-can-eat wings and all-you-can-drink course at roughly Y2,980 at weekends.',
                   'อิซากายะคุมาโมโตะขนาด 171 ที่นั่งที่ทำมาให้นั่งยาว ปีกไก่ทะบะซากิจานละ 290 เยนของร้านได้เหรียญทองจากงาน Tebasaki Summit ปี 2024 เกี๊ยวฉ่ำน้ำ และมีบาซาชิหรือเนื้อม้าดิบที่คุมาโมโตะขึ้นชื่อจริงๆ อยู่ในเมนู จึงได้กินของประจำถิ่นโดยไม่ต้องจองอีกร้าน มีคอร์สปีกไก่ไม่อั้นพร้อมเครื่องดื่มไม่อั้นสองชั่วโมง ราคาราว 2,980 เยนในวันหยุดสุดสัปดาห์'),
          refs: { map: 'https://maps.google.com/?q=%E9%85%94%E3%81%A3%E6%89%8B%E7%BE%BD+%E7%86%8A%E6%9C%AC%E4%B8%8B%E9%80%9A%E5%BA%97',
                  booking: L('All-you-can-eat wings with drinks, 2 h, about Y2,980 at weekends', 'คอร์สปีกไก่ไม่อั้นพร้อมเครื่องดื่ม 2 ชั่วโมง ราว 2,980 เยนในวันหยุด'),
                  reservation: { time: '20:00', code: 'YOTTEBA-01', party: L('Dinner for 5 - book ahead', 'มื้อค่ำ 5 ที่ ควรจองล่วงหน้า') },
                  notes: L('In the Shimotori arcade, five minutes from Hanabatacho. Open 11:00 to 05:00, and around the clock at weekends, so nothing closes to push you out. Tatami seating exists and the place allows smoking, which is worth knowing before booking. There is a second Shimotori branch if the first is full.',
                           'อยู่ในถนนชิโมโทริ ห่างจากฮานาบาตะโจห้านาที เปิด 11:00 ถึงตีห้า และวันหยุดสุดสัปดาห์เปิดตลอด 24 ชั่วโมง จึงไม่มีเวลาปิดมาไล่ มีที่นั่งแบบเสื่อทาทามิ และร้านอนุญาตให้สูบบุหรี่ ควรรู้ก่อนจอง ถ้าสาขาแรกเต็มยังมีสาขาสองในชิโมโทริอีกร้าน') } },

        { type: 'feature', time: '23:00', meridiem: 'Night', kind: 'Dining', imageId: 'a-kmm-oppeshan',
          title: L('Oppeshan - the shime bowl', 'โอ๊ปเปะชัง ราเมงปิดท้าย'),

          blurb: L('The bowl you have after the drinking, which in Kyushu is rather the point of the bowl. Oppeshan does a thicker, heavier reading of Kumamoto ramen than the 1957 template, and it stands on the same covered street as the izakaya, so the only walk left after it is the twenty minutes home up Kamitori to the river - or a short taxi if nobody is up to it.',
                   'ชามที่กินหลังดื่ม ซึ่งในคิวชูคือเหตุผลของชามนี้อยู่แล้ว โอ๊ปเปะชังตีความราเมงคุมาโมโตะให้เข้มข้นและหนักกว่าสูตรดั้งเดิมปี 1957 และตั้งอยู่บนถนนมีหลังคาเส้นเดียวกับอิซากายะ หลังชามนี้จึงเหลือแค่เดินกลับบ้านพักยี่สิบนาทีขึ้นไปตามคามิโทริจนถึงริมแม่น้ำ หรือนั่งแท็กซี่ระยะสั้นถ้าไม่มีใครไหวแล้ว'),
          refs: { map: 'https://maps.google.com/?q=%E3%82%89%E3%83%BC%E3%82%81%E3%82%93+%E3%81%8A%E3%81%A3%E3%81%BA%E3%81%97%E3%82%83%E3%82%93+%E7%86%8A%E6%9C%AC%E6%9C%AC%E5%BA%97',
                  booking: L('About Y800 to 1,100 a bowl', 'ราวชามละ 800 ถึง 1,100 เยน'),
                  notes: L('Shinshigai 5-11, tel 096-342-4978. Open 13:00 to midnight with last orders at 23:40, every day of the year - so this one waits, however long the izakaya runs.',
                           'ชินชิไก 5-11 โทร 096-342-4978 เปิด 13:00 ถึงเที่ยงคืน ปิดรับออร์เดอร์ 23:40 เปิดทุกวันตลอดปี ร้านนี้จึงรอได้ ไม่ว่าจะนั่งอิซากายะยาวแค่ไหน') } },

    {
      label: 'Day 02', labelTh: 'วันที่ 02', theme: 'hisui',

      note: L(
        'The longest day of the trip and the best of them for driving. The morning stays down on the caldera floor: the two-thousand-year-old shrine and its spring-water street, then a queue ticket at Imakin and two unhurried hours at the dairy while the wait burns down, then the red beef bowl the town is known for. The crater itself is shut at Level 3 and the inner-caldera stops go with it, and that is exactly what buys the afternoon - up onto the north rim at twenty to two, three viewpoints along the Milk Road, finishing at Daikanbo. Leave there at five past four and the low sun falls on the Yamanami Highway instead, with Yufuin at a quarter to six - a whole house on the slope above the valley with its own open-air spring, Bungo beef over rice by the station, and the stars from the bath.',
        'วันที่ยาวที่สุดของทริป และเป็นวันที่ขับสนุกที่สุด ช่วงเช้ายังอยู่บนพื้นปากปล่อง เริ่มที่ศาลเจ้าอายุสองพันปีกับถนนน้ำผุดหน้าศาลเจ้า แล้วไปรับบัตรคิวที่อิมาคิน ใช้เวลารอสองชั่วโมงแบบไม่ต้องรีบที่ร้านนมของฟาร์มอาเบะ ก่อนกลับมากินข้าวหน้าเนื้อแดงที่เมืองนี้ขึ้นชื่อ ตัวปากปล่องปิดอยู่ในระดับเตือนภัย 3 จุดเที่ยวในแอ่งด้านในจึงตัดออกไปด้วย และนั่นแหละคือสิ่งที่ซื้อเวลาช่วงบ่ายกลับมาให้ คือขึ้นสันเขาด้านเหนือตอนบ่ายโมงสี่สิบ แวะจุดชมวิวสามจุดตลอดมิลค์โร้ด ไปจบที่ไดคันโบ ออกจากไดคันโบสี่โมงห้านาที แสงเย็นจะไปตกบนยามานามิไฮเวย์แทน แล้วถึงยูฟุอินราวห้าโมงสี่สิบห้า เข้าบ้านทั้งหลังบนเนินเหนือหุบเขาที่มีบ่อน้ำพุร้อนกลางแจ้งของตัวเอง กินข้าวหน้าเนื้อบุงโงะแถวสถานี แล้วดูดาวจากในบ่อ'
      ),

          refs: { map: 'https://maps.google.com/?q=%E7%86%8A%E6%9C%AC%E7%9C%8C%E9%98%BF%E8%98%87%E5%B8%82%E4%B8%80%E3%81%AE%E5%AE%AE%E7%94%BA%E5%AE%AE%E5%9C%B01945-3',
                  booking: L('¥300 first 3 h, then ¥100/h, ¥1,000 cap', '300 เยน 3 ชั่วโมงแรก แล้ว 100 เยนต่อชั่วโมง สูงสุด 1,000 เยน'),
                  notes: L('CHECK YOUR VAN HEIGHT: this lot has a 2.40 m limit. Most 8-seaters are well under it, but a high-roof Hiace can be close - measure at the rental desk. Over 2.40 m you are charged the large-vehicle rate instead: ¥2,000 for 3 h, then ¥1,000/h, ¥5,000 cap. Pick this lot over the shrine own ones - the city page and the national roadside database disagree about whether those are paid or free. It is the only paid parking of the morning.', 'เช็กความสูงรถตู้ก่อน เพราะลานนี้จำกัดความสูงไว้ที่ 2.40 เมตร รถ 8 ที่นั่งส่วนใหญ่ต่ำกว่านี้สบายๆ แต่ไฮเอซหลังคาสูงอาจเฉียด ควรวัดที่ร้านเช่ารถก่อน ถ้าเกิน 2.40 เมตรจะโดนเรตรถใหญ่แทน คือ 2,000 เยนสำหรับ 3 ชั่วโมง แล้วชั่วโมงละ 1,000 เยน สูงสุด 5,000 เยน ควรเลือกลานนี้แทนลานของศาลเจ้า เพราะเว็บเทศบาลกับฐานข้อมูลจุดจอดของกรมทางหลวงบอกไม่ตรงกันว่าลานศาลเจ้าเก็บเงินหรือฟรี และนี่เป็นที่เดียวของช่วงเช้าที่ต้องเสียค่าจอด') } },

        { type: 'feature', time: '09:05', meridiem: 'Morning', kind: 'Shrine', imageId: 'a-d2-asojinja',
          title: L('Aso Shrine & Monzenmachi', 'ศาลเจ้าอาโซและถนนมนเซนมาจิ'),
          place: L('Ichinomiya - the restored romon gate', 'อิจิโนมิยะ กับประตูโรมงที่บูรณะเสร็จแล้ว'),
          blurb: L('Over 2,000 years old, with one of the three great two-storey romon gates in Japan. The gate collapsed in the 2016 earthquake and only reopened in December 2023 after a seven-and-a-half year rebuild that reused about 72% of the original timbers. The street in front, Monzenmachi, has fifteen spring-water fountains and is made for eating your way along it - which is exactly what you want first thing.',
                   'ศาลเจ้าอายุกว่า 2,000 ปี มีประตูโรมงสองชั้นที่ถือเป็นหนึ่งในสามประตูศาลเจ้ายิ่งใหญ่ที่สุดของญี่ปุ่น ประตูพังลงตอนแผ่นดินไหวปี 2016 และเพิ่งเปิดใหม่ธันวาคม 2023 หลังบูรณะ 7 ปีครึ่ง โดยใช้ไม้เดิมกลับมาได้ราว 72% ส่วนถนนหน้าศาลเจ้าชื่อมนเซนมาจิ มีจุดน้ำผุด "มิซุกิ" 15 จุด และเป็นถนนสำหรับเดินกินโดยเฉพาะ ซึ่งเหมาะกับการเริ่มวันมาก'),
          refs: { map: 'https://maps.google.com/?q=Aso+Shrine+Ichinomiya', official: 'https://asojinja.or.jp/',
                  booking: L('Shrine entry free', 'เข้าศาลเจ้าฟรี'),
                  notes: L('This replaces the Nakadake crater, which is shut at Level 3. About 9 km east of Uchinomaki, ten minutes by road. Doing it now, before the Imakin ticket, means the Monzenmachi shops are open - most start around 09:00 and shut about 17:00 - and nobody is watching a queue number.',
                           'จุดนี้มาแทนปล่องนากาดาเกะที่ปิดอยู่ในระดับเตือนภัย 3 อยู่ห่างอุจิโนมากิไปทางตะวันออกราว 9 กิโลเมตร ขับสิบนาที การมาช่วงนี้ก่อนไปรับบัตรคิว ทำให้ร้านบนถนนมนเซนมาจิเปิดพอดี ส่วนใหญ่เริ่มเปิดราว 09:00 และปิดราว 17:00 และไม่ต้องคอยพะวงเลขคิวด้วย') } },

        { type: 'step', time: '10:10', meridiem: 'Morning', kind: 'Parking', icon: 'car',
          title: L('Park at Uchinomaki - take a queue ticket', 'จอดที่ลานอุจิโนมากิแล้วไปรับบัตรคิว'),
          place: L('Uchinomaki Parking Lot - free', 'ลานจอดอุจิโนมากิ จอดฟรี'),
          blurb: L('Put the van in the free Uchinomaki visitor lot on the Kumamoto Bank side, then walk the five minutes to Imakin and take a ticket before anything else. Imakin has two lots of its own but both are tiny - six spaces opposite the shop and about ten marked bays in front of the bank - so neither is any use to a van. Tell the staff on the door how many you are and they hand you a number.',
                   'เอารถตู้เข้าลานจอดนักท่องเที่ยวอุจิโนมากิฝั่งธนาคารคุมาโมโตะ จอดฟรี แล้วเดินห้านาทีไปรับบัตรคิวที่อิมาคินก่อนทำอย่างอื่น อิมาคินมีลานของร้านเองสองจุดแต่เล็กมากทั้งคู่ คือหกช่องตรงข้ามร้าน กับช่องที่ตีเส้นไว้ราวสิบช่องหน้าธนาคาร ใช้กับรถตู้ไม่ได้สักที่ ไปถึงแล้วบอกพนักงานหน้าร้านว่ามากี่คน เขาจะให้เบอร์คิวมา'),
          refs: { map: 'https://maps.google.com/?q=%E5%86%85%E7%89%A7%E9%A7%90%E8%BB%8A%E5%A0%B4+%E9%98%BF%E8%98%87%E5%B8%82',
                  parking: L('Free. Overflow at the Aso Gymnasium if it is full.', 'จอดฟรี ถ้าเต็มให้ไปโรงยิมอาโซ'),
                  notes: L('Tickets go out from around 10:00, earlier on a busy day, and they CAN run out - keep a fallback in mind, there are other akaushi places in Uchinomaki and along Monzenmachi. Ask what time your number is likely to be called before you drive off to the dairy. Coming back around 12:20 on a holiday Sunday the free lot may well be full, which is what the gymnasium is for.',
                           'แจกบัตรคิวตั้งแต่ราว 10:00 วันที่คนเยอะอาจเร็วกว่านั้น และบัตรหมดได้จริง ควรมีแผนสำรองไว้ เพราะในอุจิโนมากิและตลอดถนนมนเซนมาจิยังมีร้านอากาอุชิอื่นอีก ก่อนขับไปร้านนมให้ถามร้านว่าเบอร์เราน่าจะถูกเรียกกี่โมง และตอนกลับมาราว 12:20 ในวันอาทิตย์กลางวันหยุดยาว ลานฟรีมีโอกาสเต็ม นั่นคือเหตุผลที่ต้องรู้จักโรงยิมอาโซไว้') } },

        { type: 'feature', time: '10:35', meridiem: 'Morning', kind: 'Sweets', imageId: 'a-d3-sweets',
          title: L('ASO MILK FACTORY', 'ASO MILK FACTORY'),
          place: L('Abe Farm\'s own shop - 1.1 km from Imakin', 'ร้านของฟาร์มอาเบะ ห่างจากอิมาคิน 1.1 กิโลเมตร'),
          blurb: L('Aso is grazing country, and this is the farm shop of the dairy behind ASO MILK - thick soft serve, gelato, cheese, baked things and proper coffee, with a restaurant attached. The same site is Hana Asobi, so the rose garden is not a separate stop: a glasshouse dome of 1,320 sq m, the largest in western Japan, holding around 750 varieties and 4,500 plants.',
                   'อาโซคือเมืองทุ่งเลี้ยงวัว และที่นี่คือร้านของฟาร์มที่อยู่เบื้องหลังนม ASO MILK มีทั้งซอฟต์ครีมเข้มข้น เจลาโต ชีส ของอบ และกาแฟจริงจัง พร้อมร้านอาหารในตัว ที่เดียวกันนี้คือ はな阿蘇美 สวนกุหลาบจึงไม่ใช่จุดแวะแยก เป็นโดมกระจกขนาด 1,320 ตารางเมตร ใหญ่ที่สุดในญี่ปุ่นฝั่งตะวันตก มีกุหลาบราว 750 สายพันธุ์ 4,500 ต้น'),
          refs: { map: 'https://maps.google.com/?q=ASO+MILK+FACTORY+Aso',
                  parking: L('About 200 shared spaces with room for coaches - the easiest parking of the whole day. No fee is published and nothing suggests there is one.', 'ลานรวมราว 200 ช่อง รับรถบัสได้ จอดง่ายที่สุดของทั้งวัน และไม่มีข้อมูลว่าเก็บเงิน และไม่มีอะไรบ่งชี้ว่าต้องจ่าย'),
                  official: 'https://asomilkfactory.com/about/',
                  notes: L('Open 09:30-18:00 daily, restaurant 11:00-15:00, rose garden 09:30-17:00 with the dome closing to entry at 16:30. This is ASO MILK FACTORY in Uchinomaki, NOT Aso Milk Farm in Nishihara village, which is 20 km away on the far side of the caldera. The two hours here are the Imakin wait, so there is no rush at all.', 'เปิด 09:30 ถึง 18:00 ทุกวัน ร้านอาหาร 11:00 ถึง 15:00 สวนกุหลาบ 09:30 ถึง 17:00 โดมปิดรับเข้า 16:30 ที่นี่คือ ASO MILK FACTORY ในอุจิโนมากิ ไม่ใช่ 阿蘇ミルク牧場 ที่หมู่บ้านนิชิฮาระ ซึ่งอยู่ไกลออกไป 20 กิโลเมตรคนละฝั่งปากปล่อง สองชั่วโมงที่นี่คือเวลารอคิวอิมาคินพอดี จึงไม่ต้องรีบเลย') } },

        { type: 'feature', time: '12:30', meridiem: 'Midday', kind: 'Dining', imageId: 'a-d3-lunch',
          title: L('Imakin Shokudo - Akaushi-don', 'อิมาคินโชคุโด ข้าวหน้าเนื้ออากาอุชิ'),
          place: L('Aso-shi Uchinomaki 290 - the shop that started it', 'อาโซชิ อุจิโนมากิ 290 ร้านต้นตำรับ'),
          blurb: L('The Aso specialty, from the shop that invented it around 2005 - grass-fed akaushi red wagyu, seared and piled over rice with a soft egg. Eat whenever your number is called; the time here is an estimate, not a booking.',
                   'ของขึ้นชื่อของอาโซ จากร้านที่คิดค้นเมนูนี้ขึ้นมาเมื่อราวปี 2005 เป็นเนื้ออากาอุชิวากิวแดงเลี้ยงปล่อย ย่างวางบนข้าวกับไข่ลวก กินตอนที่เขาเรียกคิว เวลาตรงนี้เป็นการประมาณ ไม่ใช่เวลาจอง'),
          refs: { map: 'https://maps.google.com/?q=Imakin+Shokudo+Aso', official: 'http://aso-imakin.com/',
                  booking: L('About 2,000 yen for the akaushi-don', 'ข้าวหน้าอากาอุชิราว 2,000 เยน'),
                  notes: L('No reservations of any kind, only same-day numbers taken at the door, and it is closed Wednesdays. Waits run 1-2 hours on a weekday and 2-3 hours or more on a holiday, and today is the Sunday of a three-day weekend. DECISION POINT: if the number has not been called by 13:30, eat somewhere else - Uchinomaki has to be behind you by 13:40 to reach Beppu at six.', 'ไม่รับจองทุกช่องทาง ใช้บัตรคิวหน้าร้านของวันนั้นอย่างเดียว และปิดวันพุธ วันธรรมดารอ 1 ถึง 2 ชั่วโมง วันหยุดรอ 2 ถึง 3 ชั่วโมงขึ้นไป และวันนี้เป็นวันอาทิตย์ของวันหยุดยาวสามวัน จุดตัดสินใจคือ ถ้าถึง 13:30 แล้วยังไม่ถูกเรียก ให้ไปกินร้านอื่น เพราะต้องออกจากอุจิโนมากิภายใน 13:40 ถึงจะถึงเบปปุหกโมงเย็น') } },

        { type: 'feature', time: '13:40', meridiem: 'Afternoon', kind: 'View', imageId: 'a-d2-milkroad',
          title: L('Milk Road', 'มิลค์โร้ด'),
          place: L('Up from Uchinomaki onto the north rim - 25 min', 'ไต่จากอุจิโนมากิขึ้นสันเขาด้านเหนือ 25 นาที'),
          blurb: L('The scenic ridge road along the Aso outer rim - wide pasture, grazing cattle and the caldera opening up on your right. The drive itself is the first sight of the day, and from up here you see more of the volcano than you would from the floor.',
                   'ถนนสันเขาวิวสวยที่ทอดยาวบนขอบนอกปากปล่องอาโซ สองข้างทางเป็นทุ่งเลี้ยงสัตว์กว้าง วัวเล็มหญ้า และแอ่งปากปล่องค่อยๆ เปิดออกทางขวามือ ตัวเส้นทางเองนี่แหละคือวิวแรกของวัน และจากบนนี้จะเห็นภูเขาไฟได้มากกว่าตอนอยู่ข้างล่าง'),
          refs: { map: 'https://maps.google.com/?q=Milk+Road+Aso', notes: L('Allow about two and a half hours from leaving Uchinomaki to leaving Daikanbo, taking in all three viewpoints. Late November is peak susuki (pampas grass) along the ridge - low sun late in the day lights the plumes up silver. The high ridge can drop near freezing at dawn, so watch for ice early.', 'เผื่อเวลาราวสองชั่วโมงครึ่ง นับจากออกจากอุจิโนมากิถึงตอนออกจากไดคันโบ รวมแวะครบทั้งสามจุดชมวิว ปลายพฤศจิกายนเป็นช่วงหญ้าซูซูกิสวยที่สุดตลอดสันเขา แสงเย็นจะส่องให้ปุยหญ้าเป็นสีเงิน ส่วนตอนเช้ามืดสันเขาสูงใกล้จุดเยือกแข็ง ระวังน้ำแข็ง') } },

        { type: 'feature', time: '14:05', meridiem: 'Afternoon', kind: 'View', imageId: 'a-aso-kabutoiwa',
          title: L('Kabutoiwa Observatory', 'จุดชมวิวคาบุโตอิวะ'),
          place: L('First pull-in once the road tops out', 'จุดจอดแรกหลังถนนไต่ขึ้นถึงสันเขา'),
          blurb: L('The first proper pull-in after the climb, named for the helmet-shaped rock beside it. A free lot, a shelter, and a clean view south across the whole caldera to the five peaks. Twenty minutes is plenty - this is the warm-up for Daikanbo, not a substitute for it.',
                   'จุดจอดจริงจังจุดแรกหลังไต่ขึ้นถึงสันเขา ชื่อมาจากหินรูปหมวกนักรบที่อยู่ข้างๆ มีลานจอดฟรี ศาลาพัก และวิวโล่งไปทางใต้ข้ามปากปล่องทั้งแอ่งไปจนถึงยอดเขาทั้งห้า แวะยี่สิบนาทีก็พอ เพราะเป็นการอุ่นเครื่องก่อนไดคันโบ ไม่ใช่ตัวแทนของไดคันโบ'),
          refs: { map: 'https://maps.google.com/?q=%E3%81%8B%E3%81%B6%E3%81%A8%E5%B2%A9%E5%B1%95%E6%9C%9B%E6%89%80',
                  parking: L('Free roadside lot', 'ลานจอดริมถนน จอดฟรี'),
                  notes: L('Open at all hours, with nothing on site beyond a toilet and a vending machine. The wind up on the rim is far colder than down in the town, so dig the jackets out of the boot here rather than at Daikanbo.',
                           'เปิดตลอดเวลา บนจุดไม่มีอะไรนอกจากห้องน้ำกับตู้กดเครื่องดื่ม ลมบนสันเขาเย็นกว่าในเมืองมาก ควรหยิบเสื้อกันหนาวออกจากท้ายรถตั้งแต่จุดนี้ ไม่ต้องรอไปหยิบที่ไดคันโบ') } },

        { type: 'feature', time: '14:45', meridiem: 'Afternoon', kind: 'View', imageId: 'a-d2-nishiyu',
          title: L('Nishiyunoura Observatory', 'จุดชมวิวนิชิยุโนะอุระ'),
          place: L('Rim panorama over the caldera', 'พาโนรามาขอบปากปล่อง'),
          blurb: L('A quieter rim observatory with a sweeping panorama of the central cones and the town spread across the caldera floor - a great first stop before Daikanbo.',
                   'จุดชมวิวบนขอบปล่องที่คนน้อยกว่า เห็นพาโนรามากรวยภูเขาไฟกลางและเมืองที่กระจายอยู่บนพื้นปากปล่อง เป็นจุดแวะแรกที่ดีก่อนไปไดคันโบ'),
          refs: { map: 'https://maps.google.com/?q=Nishiyunoura+Observatory+Aso',
                  booking: L('Observatory - ¥300 pp (¥100 if you eat at the restaurant)', 'ค่าขึ้นจุดชมวิวคนละ 300 เยน เหลือ 100 เยนถ้ากินข้าวที่ร้าน'),
                  parking: L('Free gravel lot, big enough that coaches use it - no problem for the van. Open 10:00-17:00.', 'ลานกรวดจอดฟรี กว้างพอให้รถบัสจอดได้ รถตู้จึงสบายมาก เปิด 10:00 ถึง 17:00'),
                  notes: L('Along the rim from Kabutoiwa you reach this one about half an hour before Daikanbo, so the order is right. The ridge road is slow in a van - do not try to win time back here, the Yamanami leg to Beppu has the slack.', 'ขับเลียบสันเขามาจากคาบุโตอิวะจะถึงจุดนี้ก่อนไดคันโบราวครึ่งชั่วโมง ลำดับจึงถูกแล้ว ถนนสันเขาขับรถตู้ช้า อย่าพยายามเร่งเอาเวลาคืนตรงนี้ เพราะช่วงยามานามิไปเบปปุมีเวลาเผื่อไว้แล้ว') } },

        { type: 'feature', time: '15:15', meridiem: 'Afternoon', kind: 'View', imageId: 'a-d3-daikanbo',
          title: L('Daikanbo viewpoint', 'จุดชมวิวไดคันโบ'),
          place: L('The caldera rim', 'ขอบปากปล่อง'),
          blurb: L('The classic rim viewpoint - the whole 25-km caldera opens below, the central cones lined up like a sleeping figure.',
                   'จุดชมวิวขอบปล่องคลาสสิก แอ่งปากปล่องกว้าง 25 กิโลเมตร เปิดออกเบื้องล่าง กรวยกลางเรียงตัวเหมือนคนนอนหลับ'),
          refs: { map: 'https://maps.google.com/?q=Daikanbo+Aso',
                  parking: L('Free, somewhere around 100-160 spaces plus a bus bay. It fills hardest 11:00-14:00 and autumn weekends are the worst of its year - you arrive 11:50 on a holiday Sunday, so expect to circle a bit.', 'ฟรี ราว 100-160 ช่อง มีช่องรถบัสด้วย แต่เต็มหนักสุดช่วง 11:00 ถึง 14:00 และเสาร์อาทิตย์หน้าใบไม้เปลี่ยนสีคือช่วงแย่ที่สุดของปี เราไปถึง 11:50 วันอาทิตย์วันหยุดยาว เผื่อวนหาที่จอดหน่อย'),
                  notes: L('Wind is fierce on the rim - bring a layer.', 'ลมแรงบนขอบปล่อง พกเสื้อกันหนาว') } },

        { type: 'step', time: '16:05', meridiem: 'Afternoon', kind: 'Transfer', icon: 'car',
          title: L('Down the Yamanami to Yufuin', 'ลงยามานามิสู่ยูฟุอิน'),
          place: L('Daikanbo, Oguni, Senomoto, Makinoto, Yufuin - about 80 km, 1 h 40', 'ไดคันโบ โอกุนิ เซโนโมโตะ มากิโนโตะ ยูฟุอิน ระยะประมาณ 80 กิโลเมตร ใช้เวลาประมาณ 1 ชั่วโมง 40 นาที'),
          blurb: L('North off the rim to Oguni, east to Senomoto where the Yamanami Highway proper begins, then over Makinoto Pass at 1,330 m, across the Kuju grasslands, and down into the Yufuin basin with Mt Yufu standing over it. Leaving Daikanbo at five past four puts the best stretch, Senomoto to Makinoto, squarely in the low light between half four and ten past five; the last twenty minutes down into the valley are in the dusk. Beppu waits for tomorrow.',
                   'ลงจากสันเขาไปทางเหนือสู่โอกุนิ แล้วเลี้ยวตะวันออกไปเซโนโมโตะ ซึ่งเป็นจุดเริ่มของยามานามิไฮเวย์จริงๆ จากนั้นข้ามช่องเขามากิโนโตะที่สูง 1,330 เมตร ผ่านทุ่งหญ้าคุจู แล้วลงสู่แอ่งยูฟุอินที่มีภูเขายูฟุตั้งตระหง่านอยู่ การออกจากไดคันโบสี่โมงห้านาทีทำให้ช่วงที่สวยที่สุดคือเซโนโมโตะถึงมากิโนโตะ ตรงกับแสงเย็นระหว่างสี่โมงครึ่งถึงห้าโมงสิบพอดี ส่วนยี่สิบนาทีสุดท้ายที่ลงสู่หุบเขาเป็นช่วงโพล้เพล้ เบปปุเก็บไว้พรุ่งนี้'),
          refs: { map: 'https://maps.google.com/?q=33.2532031,131.3577542',
                  parking: L('Set the house as the destination - it has its own free parking on the raised ground in front of it.', 'ตั้งจุดหมายไว้ที่บ้านพักเลย เพราะมีที่จอดฟรีของตัวเองบนพื้นยกระดับหน้าบ้าน'),
                  notes: L('Sunset is 17:09, so the descent off Makinoto is in fading light and the valley in dusk - a main road, but take the bends slowly. Fill up at Oguni, the last easy fuel before the pass. If the weather has turned and you would rather not take a 1,330 m pass in the dark, go Oguni to Hita and take the Oita Expressway to Yufuin IC instead; it costs about the same time. Message the host from Daikanbo with the arrival time - the house asks to be told if you will be later than six.',
                           'พระอาทิตย์ตก 17:09 ช่วงลงจากมากิโนโตะจึงเป็นแสงโพล้เพล้และในหุบเขาเริ่มมืด เป็นถนนสายหลักแต่ควรเข้าโค้งช้าๆ เติมน้ำมันที่โอกุนิ เป็นปั๊มสุดท้ายที่หาง่ายก่อนขึ้นช่องเขา ถ้าอากาศเปลี่ยนและไม่อยากข้ามช่องเขาสูง 1,330 เมตรตอนมืด ให้ไปทางโอกุนิขึ้นฮิตะแล้วเข้าทางด่วนโออิตะไปลงยูฟุอินไอซีแทน ใช้เวลาพอๆ กัน ส่งข้อความบอกเวลาถึงให้เจ้าของบ้านตั้งแต่อยู่ไดคันโบ เพราะบ้านขอให้แจ้งถ้าจะถึงหลังหกโมงเย็น') } },

        { type: 'step', time: '17:45', meridiem: 'Evening', kind: 'Check-in', icon: 'bed',
          title: L('Check in - Tenkunoyado', 'เช็คอิน Tenkunoyado'),
          place: L('Kawaminami - a house on the slope south of the station', 'คาวามินามิ บ้านบนเนินทางใต้ของสถานี'),
          blurb: L('A two-storey house taken whole, on the high ground of Kawaminami with the valley and Mt Yufu laid out in front of it - the name means the inn in the sky. Three bedrooms, a kitchen, a washing machine, and its own private open-air hot-spring bath, which is the point of the place. There are no meals, so dinner is in town and breakfast comes from the supermarket. Self check-in with a door code, and free parking on the raised ground in front.',
                   'บ้านสองชั้นที่เช่าทั้งหลัง ตั้งอยู่บนที่สูงของย่านคาวามินามิ มองเห็นหุบเขาและภูเขายูฟุอยู่ตรงหน้า ชื่อบ้านแปลว่าที่พักบนฟ้า มีสามห้องนอน ครัว เครื่องซักผ้า และบ่อน้ำพุร้อนกลางแจ้งส่วนตัวของตัวเอง ซึ่งคือเหตุผลของการเลือกที่นี่ ไม่มีอาหาร มื้อค่ำจึงไปกินในเมือง ส่วนมื้อเช้าซื้อจากซูเปอร์มาร์เก็ต เช็คอินเองด้วยรหัสประตู และจอดรถฟรีบนพื้นยกระดับหน้าบ้าน'),
          refs: { map: 'https://maps.google.com/?q=33.2532031,131.3577542', official: 'https://th.airbnb.com/rooms/951823896238201233',
                  parking: L('Free, in front of the house - room for more than one car.', 'จอดฟรีหน้าบ้าน มีที่สำหรับรถมากกว่าหนึ่งคัน'),
                  reservation: { time: '17:45', code: 'YUF-TENKU', party: L('Night 2 - 1 night - to book', 'คืนที่ 2 หนึ่งคืน ยังไม่ได้จอง') },
                  notes: L('NOT BOOKED YET. Airbnb listing 951823896238201233, host Ayumu, a Superhost; the house is managed by the Yufuin lodging information centre, tel 0977-84-5050, address Kawaminami 400-3-2. Check-in from 15:00 and check-out 10:00; the host asks to be told if you will arrive after 18:00, and tonight you arrive about a quarter to six, so send the message from Daikanbo. Sleeps up to fourteen, so five is easy. No barbecues, no karaoke and no singing at night - it is a residential slope. Five minutes by car from Yufuin Station, which is where dinner and the shops are.',
                           'ยังไม่ได้จอง ประกาศ Airbnb หมายเลข 951823896238201233 เจ้าของบ้านชื่ออายูมุ เป็นซูเปอร์โฮสต์ บ้านดูแลโดยศูนย์ข้อมูลที่พักยูฟุอิน โทร 0977-84-5050 ที่อยู่คาวามินามิ 400-3-2 เช็คอินตั้งแต่ 15:00 เช็คเอาท์ 10:00 เจ้าของบ้านขอให้แจ้งถ้าจะถึงหลัง 18:00 และคืนนี้จะถึงราวห้าโมงสี่สิบห้า จึงควรส่งข้อความตั้งแต่อยู่ไดคันโบ บ้านรับได้ถึงสิบสี่คน ห้าคนจึงสบายมาก ห้ามปิ้งย่าง ห้ามคาราโอเกะ และห้ามร้องเพลงเสียงดังตอนกลางคืน เพราะเป็นเนินที่อยู่อาศัย ขับจากสถานียูฟุอินห้านาที ซึ่งเป็นย่านที่มีทั้งร้านอาหารมื้อค่ำและร้านค้า') } },

        { type: 'feature', time: '18:45', meridiem: 'Evening', kind: 'Dining', imageId: 'a-d6-mabushi',
          title: L('Yufu Mabushi Shin - by the station', 'ยูฟุมาบุชิ ชิน สาขาหน้าสถานี'),
          place: L('Bungo beef over rice, eaten three ways', 'ข้าวหน้าเนื้อบุงโงะ กินสามแบบในชามเดียว'),
          blurb: L('Yufuin\'s own dish: a lidded bowl of rice with Bungo beef, Oita\'s wagyu, seared and sliced over it, eaten three ways like hitsumabushi - first as it is, then with the condiments, then with dashi poured over. There is a jidori chicken version and an eel one. The station-front branch is upstairs on Kawakita 5-3, five minutes by car from the house, and it is one of the few kitchens in town still serving at eight.',
                   'อาหารประจำถิ่นของยูฟุอินเอง คือชามข้าวมีฝาปิดที่มีเนื้อบุงโงะ วากิวของโออิตะ ย่างแล้วสไลซ์วางบนข้าว กินสามแบบเหมือนฮิตสึมาบุชิ คือกินเปล่าๆ ก่อน แล้วใส่เครื่องเคียง แล้วราดน้ำดาชิ มีแบบไก่จิโดริและแบบปลาไหลด้วย สาขาหน้าสถานีอยู่ชั้นสองที่คาวาคิตะ 5-3 ขับจากบ้านห้านาที และเป็นครัวไม่กี่แห่งในเมืองที่ยังเสิร์ฟตอนสองทุ่ม'),
          refs: { map: 'https://maps.google.com/?q=%E7%94%B1%E5%B8%83%E3%81%BE%E3%81%B6%E3%81%97+%E5%BF%83+%E9%A7%85%E5%89%8D%E6%94%AF%E5%BA%97',
                  booking: L('Mabushi sets about Y2,500 to 3,500', 'ชุดมาบุชิราว 2,500 ถึง 3,500 เยน'),
                  parking: L('Use the coin lots around the station forecourt, two minutes away.', 'ใช้ลานหยอดเหรียญรอบลานหน้าสถานี ห่างไปสองนาที'),
                  notes: L('Kawakita 5-3 2F, tel 0977-84-5825. Lunch 11:00-16:00, dinner 17:30-21:00 with last orders 20:00, closed Thursdays - so open on this Sunday. It takes reservations online through AutoReserve; without one, five people walking in at quarter to seven on a Sunday in foliage season should expect a wait. The Kinrinko honten of the same shop is the fallback. The driver drinks nothing: the house is a five-minute drive back up the hill. Buy breakfast on the way home - MaxValu on Route 210 by the station is open until 23:00, and Yufuin has nothing open early.',
                           'ที่อยู่คาวาคิตะ 5-3 ชั้น 2 โทร 0977-84-5825 มื้อเที่ยง 11:00 ถึง 16:00 มื้อค่ำ 17:30 ถึง 21:00 ปิดรับออร์เดอร์ 20:00 หยุดวันพฤหัส วันอาทิตย์นี้จึงเปิด ร้านรับจองออนไลน์ผ่าน AutoReserve ถ้าไม่จอง ห้าคนเดินเข้าร้านตอนหกโมงสี่สิบห้าของวันอาทิตย์ในหน้าใบไม้เปลี่ยนสีควรเผื่อรอ ร้านสำรองคือสาขาใหญ่ริมบึงคินรินของร้านเดียวกัน คนขับไม่ดื่ม เพราะต้องขับกลับขึ้นเนินไปบ้านอีกห้านาที ซื้อของสำหรับมื้อเช้าตอนขากลับด้วย ซูเปอร์มาร์เก็ตแม็กซ์แวลูบนถนนหมายเลข 210 แถวสถานีเปิดถึง 23:00 และในยูฟุอินไม่มีอะไรเปิดเช้า') } },

        { type: 'step', time: '20:30', meridiem: 'Night', kind: 'Onsen', icon: 'bed',
          title: L('The private open-air bath under the stars', 'บ่อกลางแจ้งส่วนตัวใต้ดวงดาว'),
          place: L('Your own rotenburo, on the deck', 'โรเท็นบุโระของเราเอง บนระเบียงบ้าน'),
          blurb: L('The reason for a house with a spring rather than a hotel: an open-air bath that is yours alone, with the valley lights below and Mt Yufu black against the stars - on a clear November night the sky up here is genuinely dark. Take it in turns or all at once, as late as you like; nobody is closing it at ten.',
                   'เหตุผลของการเลือกบ้านที่มีน้ำพุร้อนแทนโรงแรม คือบ่อกลางแจ้งที่เป็นของเราคนเดียว มีไฟของหุบเขาอยู่เบื้องล่างและเงาดำของภูเขายูฟุตัดกับดวงดาว คืนเดือนพฤศจิกายนที่ฟ้าใส ท้องฟ้าบนนี้มืดจริงๆ จะผลัดกันลงหรือลงพร้อมกันก็ได้ ดึกแค่ไหนก็ได้ ไม่มีใครมาปิดบ่อตอนสี่ทุ่ม'),
          refs: { notes: L('The water runs hot and the night air will be near freezing - go in slowly and drink something afterwards. Run the washing machine tonight: it is the halfway point of the trip. Sunrise tomorrow is 06:53 and the lake is five minutes away by car, so set the alarm for six.',
                           'น้ำร้อนและอากาศกลางคืนใกล้จุดเยือกแข็ง ให้ค่อยๆ ลงและดื่มน้ำหลังขึ้นจากบ่อ คืนนี้ให้ซักผ้าด้วย เพราะเป็นจุดกึ่งกลางของทริปพอดี พรุ่งนี้พระอาทิตย์ขึ้น 06:53 และบึงอยู่ห่างไปห้านาทีโดยรถ ตั้งนาฬิกาปลุกหกโมง') } },
      ],
    },
    {
      label: 'Day 03', labelTh: 'วันที่ 03', theme: 'urushi',
      date: L('Monday - 23 Nov 2026', 'จันทร์ 23 พฤศจิกายน 2026'),
      title: L('Yufuin to Beppu', 'ยูฟุอิน สู่ เบปปุ'),
      subtitle: L('Lake Mist, the Ropeway, Two Hells and Yakiniku', 'หมอกริมบึง กระเช้า บ่อนรกสองบ่อ และเนื้อย่าง'),
      note: L(
        'Late November is exactly when the mist comes off Kinrin Lake, so the day starts in the dark, five minutes down the hill, with the town still asleep. Back to the house for breakfast and a last soak, out by ten, then Yufuin awake: the craft street before the coaches, the roll cake that sells out, and a coffee on the lake shore. At eleven the car climbs the pass to Beppu - the ropeway base is on it, so the whole bay opens up from 1,375 m before you have even reached the town - then the cobalt hell and the blood-red one, the sushi bar people drive across the prefecture for, taken after the lunch rush, and a pudding steamed over the springs of Myoban. Check in to a new-build house with its own spring on the Tsurumi slope, then a short drive to Beppu\'s long-established yakiniku house for the seven-second sirloin, and home to your own spring.',
        'ปลายพฤศจิกายนคือช่วงที่ไอหมอกลอยขึ้นจากบึงคินรินพอดี วันนี้จึงเริ่มตั้งแต่ฟ้ายังมืด ขับลงเนินห้านาทีไปตอนที่เมืองยังหลับ กลับมากินมื้อเช้าและแช่น้ำรอบสุดท้ายที่บ้าน ออกก่อนสิบโมง แล้วดูยูฟุอินตอนตื่น เดินถนนร้านคราฟต์ก่อนรถทัวร์มา ซื้อโรลเค้กที่ขายหมดทุกวัน และจิบกาแฟริมบึง สิบเอ็ดโมงรถไต่ช่องเขาไปเบปปุ สถานีกระเช้าอยู่บนถนนเส้นนั้นพอดี จึงได้เห็นอ่าวทั้งอ่าวจากความสูง 1,375 เมตรก่อนถึงตัวเมืองด้วยซ้ำ จากนั้นดูบ่อนรกสีโคบอลต์กับบ่อสีเลือด กินซูชิร้านที่คนขับรถข้ามจังหวัดมากินโดยไปหลังช่วงเที่ยงคนเยอะ แล้วกินพุดดิ้งที่นึ่งด้วยไอน้ำพุร้อนของเมียวบัง เช็คอินบ้านสร้างใหม่ที่มีน้ำพุร้อนของตัวเองบนเนินสึรุมิ แล้วขับรถสั้นๆ ไปร้านเนื้อย่างเก่าแก่ของเบปปุเพื่อกินโรสเจ็ดวินาที ก่อนกลับมาแช่น้ำพุร้อนที่บ้าน'
      ),
      coverId: 'day3-cover',
      activities: [
        { type: 'step', time: '06:35', meridiem: 'Dawn', kind: 'Transfer', icon: 'car',
          title: L('Drive to the Kinrin Lake car park', 'ขับไปลานจอดข้างบึงคินริน'),
          place: L('Five minutes down the hill - in the dark', 'ลงเนินห้านาที ตอนฟ้ายังมืด'),

                  parking: L('Times Yufuin Kinrinko, two minutes from the lake - a flat Y900 on holidays. Times Yufuin Kinrinko 2 is the overflow.', 'ไทม์สยูฟุอินคินรินโกะ ห่างบึงสองนาที วันหยุดเหมาวันละ 900 เยน ถ้าเต็มให้ไปไทม์สยูฟุอินคินรินโกะ 2') } },

        { type: 'feature', time: '06:45', meridiem: 'Dawn', kind: 'Lake', imageId: 'a-d7-mist',
          title: L('Kinrin Lake at dawn', 'บึงคินรินยามรุ่ง'),
          place: L('Steam off the water - the town still asleep', 'ไอน้ำลอยเหนือผิวน้ำ เมืองยังหลับอยู่'),

          refs: { map: 'https://maps.google.com/?q=Lake+Kinrin+Yufuin',
                  parking: L('Times Yufuin Kinrinko, two minutes from the lake - a flat Y900 on holidays.', 'ไทม์สยูฟุอินคินรินโกะ ห่างบึงสองนาที วันหยุดเหมาวันละ 900 เยน'),
                  notes: L('Best between about 06:30 and 08:00 on a clear cold morning - it thins fast once the sun is properly up. Walk the loop, then back up to the house; you return to this shore at ten for the cafe.', 'สวยสุดราว 06:30 ถึง 08:00 ของเช้าที่ฟ้าใสและหนาว พอแดดขึ้นเต็มที่ไอจะจางเร็ว เดินรอบบึงแล้วกลับขึ้นไปบ้าน สิบโมงจะกลับมาริมบึงเดิมนี้อีกทีเพื่อเข้าคาเฟ่') } },

        { type: 'step', time: '07:45', meridiem: 'Morning', kind: 'Onsen', icon: 'bed',
          title: L('Breakfast and a last soak at the house', 'มื้อเช้าและแช่น้ำรอบสุดท้ายที่บ้าน'),
          place: L('Supermarket breakfast, then the open-air bath', 'มื้อเช้าจากซูเปอร์ แล้วลงบ่อกลางแจ้ง'),
          blurb: L('Breakfast from last night\'s shopping round the table, then the outdoor bath one more time with the valley still in shadow. Pack before you soak - check-out is ten sharp and the code door does not negotiate.',
                   'มื้อเช้าจากของที่ซื้อไว้เมื่อคืนที่โต๊ะกินข้าว แล้วลงบ่อกลางแจ้งอีกรอบตอนหุบเขายังอยู่ในเงา เก็บกระเป๋าก่อนแช่ เพราะเช็คเอาท์สิบโมงตรงและประตูรหัสไม่ต่อรอง'),
          refs: {} },

        { type: 'step', time: '09:30', meridiem: 'Morning', kind: 'Check-out', icon: 'luggage',
          title: L('Check out - Tenkunoyado', 'เช็คเอาท์จาก Tenkunoyado'),
          place: L('Out by ten at the latest', 'ออกก่อนสิบโมงเป็นอย่างช้า'),
          blurb: L('Turn the bath tap off, take the rubbish out sorted, lock the code door. The lake is five minutes down the hill and Yunotsubo\'s shops open between nine and ten.',
                   'ปิดก๊อกน้ำร้อน เอาขยะที่แยกแล้วออกไป ล็อกประตูรหัส บึงอยู่ห่างลงเนินไปห้านาที และร้านบนถนนยูโนทสึโบะเปิดระหว่างเก้าโมงถึงสิบโมง'),
          refs: { map: 'https://maps.google.com/?q=%E3%82%BF%E3%82%A4%E3%83%A0%E3%82%BA%E6%B9%AF%E5%B8%83%E9%99%A2%E9%87%91%E9%B1%97%E6%B9%96',
                  parking: L('Back to Times Yufuin Kinrinko - park once for the whole morning.', 'กลับไปไทม์สยูฟุอินคินรินโกะ จอดครั้งเดียวทั้งเช้า') } },

        { type: 'feature', time: '09:50', meridiem: 'Morning', kind: 'Wander', imageId: 'a-d6-yunotsubo',
          title: L('Yunotsubo Kaido', 'ถนนยูโนทสึโบะ'),
          place: L('The main street - from the lake end towards the station', 'ถนนสายหลัก จากฝั่งบึงไปทางสถานี'),
          blurb: L('The kilometre of craft shops, cheese and jam stalls, croquette counters and small galleries that runs from the lake back towards the station. The car is at the lake end, so walk out along it towards the station and back - at this hour it is still the town\'s own street.',
                   'ถนนยาวหนึ่งกิโลเมตรเต็มไปด้วยร้านงานคราฟต์ แผงชีสและแยม เคาน์เตอร์โครเกะ และแกลเลอรีเล็กๆ ทอดจากบึงกลับไปทางสถานี รถจอดอยู่ฝั่งบึง จึงเดินออกไปทางสถานีแล้ววนกลับมา ชั่วโมงนี้ถนนยังเป็นของคนในเมืองอยู่'),
          refs: { map: 'https://maps.google.com/?q=Yunotsubo+Kaido+Yufuin',
                  notes: L('Most shops open between 09:00 and 10:00. Today is a holiday, so the coaches arrive from about half past ten - being here at ten is the whole trick.', 'ร้านส่วนใหญ่เปิดระหว่าง 09:00 ถึง 10:00 วันนี้เป็นวันหยุด รถทัวร์จะเริ่มมาราวสิบโมงครึ่ง การมาถึงตอนสิบโมงคือเคล็ดลับทั้งหมด') } },

        { type: 'feature', time: '10:15', meridiem: 'Morning', kind: 'Sweets', imageId: 'a-d6-sweets',
          title: L('Yufuin Sweets - B-speak & Milch', 'ของหวานยูฟุอินจากร้าน B-speak และ Milch'),
          place: L('Roll cake & baked cheesecake', 'โรลเค้กและชีสเค้กอบ'),
          blurb: L('B-speak sells one thing, a plain rolled sponge, and sells out of it; Milch does a small baked cheesecake eaten warm at the counter. Both are on the street you are already walking.',
                   'B-speak ขายอย่างเดียวคือโรลเค้กเนื้อสปันจ์ธรรมดา และขายหมดทุกวัน ส่วน Milch ทำชีสเค้กอบชิ้นเล็กให้กินอุ่นๆ ที่เคาน์เตอร์ ทั้งสองร้านอยู่บนถนนสายที่กำลังเดินอยู่แล้ว'),
          refs: { map: 'https://maps.google.com/?q=B-speak+Yufuin',
                  notes: L('B-speak opens at 10:00 and the plain roll often sells out by early afternoon - being at the door at opening is why the sweets come before the coffee. If the whole roll is gone, take the sliced P roll.', 'B-speak เปิด 10:00 และโรลธรรมดามักหมดตั้งแต่บ่ายต้นๆ การไปถึงหน้าร้านตอนเปิดคือเหตุผลที่ของหวานมาก่อนกาแฟ ถ้าโรลทั้งก้อนหมด ให้เอาแบบตัดชิ้นหรือ P roll แทน') } },

        { type: 'feature', time: '10:35', meridiem: 'Morning', kind: 'Coffee', imageId: 'a-yuf-laruche',
          title: L('CAFE LA RUCHE - coffee on the lake', 'CAFE LA RUCHE กาแฟริมบึงคินริน'),
          place: L('The shore of Kinrin Lake - in the morning light', 'ริมบึงคินริน ในแสงยามสาย'),
          blurb: L('The cafe that sits right on the edge of Kinrin Lake. It roasts its own coffee and bakes its own croissants, and in the morning it is the warmest seat in the valley from which to watch the last of the mist burn off the water in front of Mt Yufu. Twenty minutes, then the car.',
                   'คาเฟ่ที่ตั้งอยู่ริมบึงคินรินพอดี คั่วกาแฟเองและอบครัวซองต์เอง ตอนสายที่นี่คือที่นั่งอุ่นที่สุดในหุบเขาสำหรับดูหมอกช่วงสุดท้ายจางไปจากผิวน้ำหน้าภูเขายูฟุ ยี่สิบนาที แล้วขึ้นรถ'),
          refs: { map: 'https://maps.google.com/?q=CAFE+LA+RUCHE+Yufuin',
                  notes: L('Kawakami 1592-1. Open 09:00-17:30, from 08:00 on Sundays and holidays, closed Wednesdays - today is a holiday, so it has been open since eight. Leave by eleven: the ropeway is the first stop over the pass and the Beppu afternoon is full.',
                           'ที่อยู่คาวาคามิ 1592-1 เปิด 09:00 ถึง 17:30 วันอาทิตย์และวันหยุดเปิดตั้งแต่ 08:00 หยุดวันพุธ วันนี้เป็นวันหยุดจึงเปิดมาตั้งแต่แปดโมงแล้ว ออกก่อนสิบเอ็ดโมง เพราะกระเช้าคือจุดแรกหลังข้ามช่องเขา และบ่ายที่เบปปุแน่นมาก') } },

        { type: 'step', time: '11:00', meridiem: 'Late morning', kind: 'Transfer', icon: 'car',
          title: L('Drive over the pass to the Beppu Ropeway', 'ขับข้ามช่องเขาไปสถานีกระเช้าเบปปุ'),
          place: L('Route 11 over the Yufuin-Beppu saddle - about 12 km, 25 min', 'ถนนหมายเลข 11 ข้ามสันเขาระหว่างยูฟุอินกับเบปปุ ระยะประมาณ 12 กิโลเมตร ใช้เวลาประมาณ 25 นาที'),
          blurb: L('East out of the basin on Route 11, the same Yamanami Highway you came in on last night, climbing to the saddle between Mt Yufu and Mt Tsurumi. The ropeway\'s base station stands right on the road at the top, so it is the first stop in Beppu rather than a detour from it.',
                   'ออกจากแอ่งไปทางตะวันออกบนถนนหมายเลข 11 ซึ่งคือยามานามิไฮเวย์สายเดียวกับที่เข้ามาเมื่อคืน ไต่ขึ้นสันเขาระหว่างภูเขายูฟุกับภูเขาสึรุมิ สถานีกระเช้าฝั่งล่างตั้งอยู่ริมถนนบนยอดสันพอดี จึงเป็นจุดแรกของเบปปุ ไม่ใช่การอ้อมออกไป'),
          refs: { map: 'https://maps.google.com/?q=Beppu+Ropeway',
                  parking: L('Free lot at the base station.', 'ลานจอดฟรีที่สถานีล่าง'),
                  notes: L('The expressway is no faster for this leg. Fill up in Yufuin if the tank is under half - Beppu\'s stations are all down in the town.', 'ช่วงนี้ทางด่วนไม่ได้เร็วกว่า ถ้าน้ำมันต่ำกว่าครึ่งถังให้เติมที่ยูฟุอิน เพราะปั๊มของเบปปุอยู่ในตัวเมืองด้านล่างทั้งหมด') } },

        { type: 'feature', time: '11:30', meridiem: 'Late morning', kind: 'View', imageId: 'a-d3-ropeway',
          title: L('Beppu Ropeway - Mt Tsurumi', 'กระเช้าเบปปุขึ้นเขาสึรุมิ'),
          place: L('1,375 m - ten minutes up', 'ความสูง 1,375 เมตร ขึ้นไปสิบนาที'),
          blurb: L('A 101-person cable car climbs 800 metres in ten minutes to the summit plateau, and the whole of Beppu Bay opens up behind you - the town, the steam, the Kunisaki peninsula, and on a clear day Shikoku across the water. A short loop walk at the top takes twenty minutes.',
                   'กระเช้าจุ 101 คน ไต่ขึ้น 800 เมตรในสิบนาทีสู่ที่ราบยอดเขา แล้วอ่าวเบปปุทั้งอ่าวจะเปิดออกข้างหลัง เห็นทั้งตัวเมือง ไอน้ำ คาบสมุทรคุนิซากิ และถ้าฟ้าใสจะเห็นเกาะชิโกกุอยู่อีกฝั่งน้ำ บนยอดมีทางเดินวนสั้นๆ ใช้เวลายี่สิบนาที'),
          refs: { map: 'https://maps.google.com/?q=Beppu+Ropeway', official: 'https://www.beppu-ropeway.co.jp/',
                  booking: L('Return ticket - around Y1,800', 'ตั๋วไปกลับราว 1,800 เยน'),
                  parking: L('Free lot at the base station.', 'ลานจอดฟรีที่สถานีล่าง'),
                  notes: L('The autumn colour on Tsurumi peaks in late October, so by now the slopes are bare - you come for the bay view, not the leaves. It is 10 degrees colder at the top and often in cloud; check the summit webcam on the official site before you buy. Allow an hour and a quarter with the loop walk; on a holiday there can be a wait for a car.',
                           'ใบไม้เปลี่ยนสีบนสึรุมิพีคปลายตุลาคม ตอนนี้ไหล่เขาโล่งแล้ว จึงมาเพื่อวิวอ่าว ไม่ใช่เพื่อใบไม้ ข้างบนหนาวกว่าราว 10 องศาและมักมีเมฆปิด เช็คกล้องสดยอดเขาบนเว็บทางการก่อนซื้อตั๋ว เผื่อเวลาชั่วโมงสิบห้านาทีรวมทางเดินวนบนยอด และวันหยุดอาจต้องรอกระเช้ารอบถัดไป') } },

        { type: 'feature', time: '12:45', meridiem: 'Afternoon', kind: 'View', imageId: 'a-d5-umijigoku',
          title: L('Umi Jigoku - the blue pond', 'อุมิจิโกกุ บ่อนรกสีฟ้า'),
          place: L('Kannawa - the sea hell', 'ย่านคันนาวะ บ่อนรกสีทะเล'),
          blurb: L('A cobalt-blue pool at 98 degrees, the colour coming from dissolved iron sulphate, sitting in a small landscaped garden with a red torii and a lotus pond. The best of the Beppu hells by a distance.',
                   'บ่อน้ำสีฟ้าโคบอลต์ร้อน 98 องศา สีมาจากเหล็กซัลเฟตที่ละลายอยู่ ตั้งอยู่ในสวนจัดแต่งเล็กๆ ที่มีเสาโทริอิแดงและบ่อบัว ถือเป็นบ่อนรกที่ดีที่สุดของเบปปุแบบทิ้งห่าง'),
          refs: { map: 'https://maps.google.com/?q=Umi+Jigoku+Beppu', official: 'https://www.umijigoku.co.jp/',
                  booking: L('Entry - Y450', 'ค่าเข้า 450 เยน'),
                  parking: L('Its own free lot - each hell has one, there is no shared car park.', 'มีลานจอดฟรีของตัวเอง เพราะบ่อนรกแต่ละบ่อมีลานแยกกัน ไม่ได้ใช้ร่วมกัน'),
                  notes: L('Open from 08:00 with last entry at 17:00. Fifteen minutes down from the ropeway. Buy the single ticket, not the seven-hell pass, unless you plan on more.', 'เปิดตั้งแต่ 08:00 และเข้าได้ถึง 17:00 ขับลงมาจากกระเช้าสิบห้านาที ซื้อแค่ตั๋วเดี่ยวก็พอ ไม่ต้องซื้อพาสเจ็ดบ่อ ถ้าไม่ได้ตั้งใจเที่ยวหลายบ่อ') } },

        { type: 'feature', time: '13:40', meridiem: 'Afternoon', kind: 'View', imageId: 'a-d5-chinoike',
          title: L('Chinoike Jigoku - the blood pond', 'ชิโนอิเกะจิโกกุ บ่อเลือด'),
          place: L('Shibaseki - 10 min north of Kannawa', 'ชิบาเซกิ ห่างคันนาวะไปทางเหนือ 10 นาที'),
          blurb: L('The oldest natural hot spring in Japan on record, and the reddest thing you will see on this trip - iron oxide in the clay turns the whole pond blood red and the steam above it pink. It is a national Place of Scenic Beauty, and the pairing with the cobalt-blue Umi Jigoku an hour earlier is the point.',
                   'บ่อน้ำพุร้อนธรรมชาติที่มีบันทึกเก่าแก่ที่สุดในญี่ปุ่น และเป็นของที่แดงที่สุดที่จะได้เห็นในทริปนี้ เหล็กออกไซด์ในดินเหนียวย้อมทั้งบ่อให้เป็นสีเลือดและทำให้ไอน้ำด้านบนเป็นสีชมพู ที่นี่ขึ้นทะเบียนเป็นสถานที่ทัศนียภาพงามระดับชาติ และการได้เห็นคู่กับอุมิจิโกกุสีฟ้าโคบอลต์เมื่อชั่วโมงก่อนคือจุดประสงค์'),
          refs: { map: 'https://maps.google.com/?q=Chinoike+Jigoku+Beppu',
                  booking: L('Entry - Y450', 'ค่าเข้า 450 เยน'),
                  parking: L('Free lot at the gate, shared with Tatsumaki Jigoku next door.', 'ลานจอดฟรีหน้าประตู ใช้ร่วมกับบ่อทัตสึมากิที่อยู่ติดกัน'),
                  notes: L('Tatsumaki Jigoku, a geyser that erupts every 30-40 minutes, is right next door on the same ticket area - worth ten minutes if the timing lands.',
                           'บ่อทัตสึมากิซึ่งเป็นน้ำพุร้อนที่พุ่งขึ้นทุก 30 ถึง 40 นาที อยู่ติดกันในโซนเดียวกัน ถ้าจังหวะพอดีก็คุ้มที่จะแวะสิบนาที') } },

        { type: 'feature', time: '14:30', meridiem: 'Afternoon', kind: 'Dining', imageId: 'a-d5-sushi',
          title: L('Kamesho Kurukuru Sushi', 'คาเมโช คุรุคุรุ ซูชิ'),
          place: L('Conveyor sushi, Beppu - the one locals queue for', 'ซูชิสายพานของเบปปุ ร้านที่คนท้องถิ่นยอมต่อคิว'),
          blurb: L('A conveyor-belt sushi bar that people drive across the prefecture for: enormous cuts, Y130-360 a plate, and a blackboard of whatever came in that morning from Saganoseki, Saiki, Beppu bay and Ehime. Seki-saba and seki-aji, the prized mackerel and horse mackerel of the Bungo channel, are the reason to be here. Thirty-six seats, and it closes when the fish runs out.',
                   'เป็นร้านซูชิสายพานที่คนขับรถข้ามจังหวัดมากิน ชิ้นใหญ่มโหฬาร จานละ 130 ถึง 360 เยน และมีกระดานดำเขียนของที่เข้ามาเช้านั้นจากซางาโนเซกิ ไซกิ อ่าวเบปปุ และเอฮิเมะ เหตุผลที่ต้องมาคือเซกิซาบะกับเซกิอาจิ ปลาซาบะและปลาทูม้าชั้นดีของช่องแคบบุงโกะ ร้านมีแค่ 36 ที่นั่ง และปิดเมื่อปลาหมด'),
          refs: { map: 'https://maps.google.com/?q=%E4%BA%80%E6%AD%A3%E3%81%8F%E3%82%8B%E3%81%8F%E3%82%8B%E5%AF%BF%E5%8F%B8',
                  parking: L('Its own car park on site.', 'มีลานจอดของร้านเอง'),
                  notes: L('Open 11:00-21:00 and closed Wednesdays, with the occasional unannounced closure on top, so check Instagram before you set off. No bookings, and today is Labour Thanksgiving Day, so the lunch queue is the long one - which is why the hells come first and the sushi at half past two, well past the rush. Put the name on the list as you arrive and still expect a wait; the shop posts how far the list has got on Instagram. Budget around Y3,000-4,000 a head in practice, more than the menu suggests, because the plates are big and you will keep going.',
                           'เปิดเวลา 11:00 ถึง 21:00 หยุดวันพุธ และบางครั้งปิดกะทันหันโดยไม่แจ้งล่วงหน้า ควรเช็คอินสตาแกรมของร้านก่อนออกเดินทาง ร้านไม่รับจอง และวันนี้เป็นวันขอบคุณแรงงาน คิวมื้อเที่ยงจึงยาวที่สุด นี่คือเหตุผลที่ไปบ่อนรกก่อนแล้วค่อยมากินซูชิบ่ายสองครึ่ง ซึ่งพ้นช่วงคนเยอะไปมากแล้ว ลงชื่อทันทีที่มาถึงและยังควรเผื่อรอ ร้านอัปเดตว่าคิวเดินไปถึงไหนแล้วทางอินสตาแกรม งบจริงราว 3,000 ถึง 4,000 เยนต่อคน มากกว่าที่เมนูบอก เพราะชิ้นใหญ่และจะสั่งเพลิน') } },

        { type: 'feature', time: '15:45', meridiem: 'Afternoon', kind: 'Sweets', imageId: 'a-d5-sweets',
          title: L('Okamotoya - jigoku-mushi purin', 'โอกาโมโตยะ พุดดิ้งนึ่งไอบ่อนรก'),
          place: L('Myoban - up the hill from Kannawa', 'ย่านเมียวบัง บนเนินเหนือคันนาวะ'),
          blurb: L('The original steamed-over-the-springs custard pudding, made the same way since 1988: firm, eggy, with a bitter caramel, cooked in the natural steam of Myoban. The egg sandwich, made with eggs from the same steam, is the other thing people order, and there is a view down over the hillside from the shop. Myoban is also where the thatched huts that make yu-no-hana bath salts stand, a few minutes along the road.',
                   'พุดดิ้งคัสตาร์ดนึ่งด้วยไอน้ำพุร้อนต้นตำรับ ทำสูตรเดิมมาตั้งแต่ปี 1988 เนื้อแน่น รสไข่ชัด ราดคาราเมลขม นึ่งด้วยไอน้ำธรรมชาติของเมียวบัง อีกเมนูที่คนสั่งคู่กันคือแซนด์วิชไข่ที่ใช้ไข่นึ่งด้วยไอเดียวกัน และจากร้านมองลงไปเห็นไหล่เขาได้ ย่านเมียวบังยังเป็นที่ตั้งของกระท่อมมุงจากที่ใช้ผลิตเกลือแร่อาบน้ำยุโนะฮานะ ห่างไปตามถนนไม่กี่นาที'),
          refs: { map: 'https://maps.google.com/?q=%E5%B2%A1%E6%9C%AC%E5%B1%8B%E5%A3%B2%E5%BA%97+%E6%98%8E%E7%A4%AC', official: 'https://jigoku-prin.com/',
                  parking: L('Large car park at the shop.', 'มีลานจอดขนาดใหญ่หน้าร้าน'),
                  notes: L('Myoban 3-kumi, tel 0977-66-6115. Open 08:30-18:30 every day, last orders 17:30. Ten minutes uphill from Kamesho, and the house at Tsurumi is fifteen minutes back down the other side of Kannawa, so it costs nothing on the way. If the sushi ran late, take the purin away in the car.',
                           'ที่อยู่เมียวบัง 3 กุมิ โทร 0977-66-6115 เปิด 08:30 ถึง 18:30 ทุกวัน รับออร์เดอร์สุดท้าย 17:30 ขับขึ้นเนินจากคาเมโชสิบนาที และบ้านพักที่สึรุมิอยู่ห่างลงไปอีกฝั่งของคันนาวะสิบห้านาที จึงไม่ต้องอ้อมเลย ถ้าซูชิเสร็จช้า ให้ซื้อพุดดิ้งขึ้นรถไปกินแทน') } },

        { type: 'step', time: '16:30', meridiem: 'Afternoon', kind: 'Transfer', icon: 'car',
          title: L('Drive to the house - Tsurumi', 'ขับไปบ้านพักที่สึรุมิ'),
          place: L('Myoban down to Asahigaoka - about 6 km, 15 min', 'จากเมียวบังลงไปอาซาฮิงาโอกะ ระยะประมาณ 6 กิโลเมตร ใช้เวลาประมาณ 15 นาที'),
          blurb: L('Down from Myoban through Kannawa and south along the hill road to Tsurumi, a quiet residential slope above the town. The house is on Asahigaoka-cho beside a small river, with a drugstore right in front of it and a supermarket three minutes away.',
                   'ลงจากเมียวบังผ่านคันนาวะ แล้วลงใต้ตามถนนบนเนินไปสึรุมิ ย่านที่อยู่อาศัยเงียบๆ เหนือตัวเมือง บ้านอยู่ที่อาซาฮิงาโอกะโจ ริมลำน้ำสายเล็ก มีร้านขายยาอยู่หน้าบ้านพอดีและซูเปอร์มาร์เก็ตห่างไปสามนาที'),
          refs: { map: 'https://maps.google.com/?q=33.3077257,131.4744747',
                  parking: L('Free, two cars, in front of the house - a bay 6.7 m wide and 5.6 m deep, so the van fits with room to spare.', 'จอดฟรีสองคันหน้าบ้าน เป็นช่องกว้าง 6.7 เมตร ลึก 5.6 เมตร รถตู้จึงเข้าได้สบาย'),
                  notes: L('Check-in is from 16:00, so arriving at a quarter to five is fine. The entrance is a keypad; one review says the door takes a moment to work out, so read the host\'s instructions before you are standing in front of it in the dark.', 'เช็คอินได้ตั้งแต่ 16:00 มาถึงสี่โมงสี่สิบห้าจึงพอดี ประตูเป็นแบบกดรหัส มีรีวิวบอกว่าประตูใช้เวลาทำความเข้าใจสักพัก ควรอ่านคำแนะนำของเจ้าของบ้านก่อนไปยืนหน้าประตูตอนมืด') } },

        { type: 'step', time: '16:45', meridiem: 'Afternoon', kind: 'Check-in', icon: 'bed',
          title: L('Check in - the riverside house, Tsurumi', 'เช็คอินบ้านริมแม่น้ำที่สึรุมิ'),
          place: L('Asahigaoka-cho - built May 2026, sleeps eight', 'อาซาฮิงาโอกะโจ บ้านสร้างเสร็จพฤษภาคม 2026 นอนได้แปดคน'),
          blurb: L('A Japanese-modern house finished in May 2026 and let whole, beside a small river on the Tsurumi slope: two bedrooms with double beds and a tatami room upstairs, a kitchen with everything down to a takoyaki plate, a projector in the living room, and downstairs an indoor hot-spring bath that opens onto a wooden deck with a cascade shower - your own onsen, fed from Beppu\'s springs. Free parking for two cars in front. Drop the bags, put the bath on to fill and soak first - dinner is only a short drive away.',
                   'บ้านสไตล์ญี่ปุ่นโมเดิร์นที่สร้างเสร็จเดือนพฤษภาคม 2026 และให้เช่าทั้งหลัง ตั้งอยู่ริมลำน้ำสายเล็กบนเนินสึรุมิ มีห้องนอนเตียงคู่สองห้องกับห้องเสื่อทาทามิชั้นบน ครัวที่มีครบจนถึงกระทะทาโกยากิ โปรเจกเตอร์ในห้องนั่งเล่น และชั้นล่างมีบ่อน้ำพุร้อนในร่มที่เปิดออกสู่ระเบียงไม้พร้อมฝักบัวน้ำตก เป็นออนเซนของเราเองที่ต่อน้ำมาจากบ่อน้ำพุร้อนของเบปปุ จอดรถฟรีสองคันหน้าบ้าน วางกระเป๋า เปิดน้ำใส่บ่อแล้วแช่ก่อนได้เลย เพราะมื้อเย็นอยู่ห่างแค่ขับรถสั้นๆ'),
          refs: { map: 'https://maps.google.com/?q=33.3077257,131.4744747', official: 'https://th.airbnb.com/rooms/1667889457743176709',
                  parking: L('Free, two cars, in front of the house.', 'จอดฟรีสองคันหน้าบ้าน'),
                  reservation: { time: '16:45', code: 'BEP-TSURUMI', party: L('Night 3 - 1 night - to book', 'คืนที่ 3 หนึ่งคืน ยังไม่ได้จอง') },
                  notes: L('NOT BOOKED YET. Airbnb listing 1667889457743176709, host Ake, a Superhost who answers within the hour in English. Check-in 16:00 to 23:00 by keypad, check-out 10:00. The spring water runs very hot: turn the tap off after every use and at check-out, add cold before anyone gets in, and never leave a child in it alone. Smoking only at the designated ashtray, quiet after dark - it is a residential street - and the rubbish sorted before you leave. Drugstore Mori is one minute away, the Shinsen Ichiba supermarket three, a Lawson six.',
                           'ยังไม่ได้จอง ประกาศ Airbnb หมายเลข 1667889457743176709 เจ้าของบ้านชื่ออาเกะ เป็นซูเปอร์โฮสต์ที่ตอบภายในหนึ่งชั่วโมงและพูดอังกฤษได้ เช็คอิน 16:00 ถึง 23:00 ด้วยรหัสประตู เช็คเอาท์ 10:00 น้ำพุร้อนร้อนมาก ต้องปิดก๊อกทุกครั้งหลังใช้และตอนเช็คเอาท์ ผสมน้ำเย็นก่อนใครจะลง และห้ามปล่อยเด็กแช่ตามลำพัง สูบบุหรี่ได้เฉพาะจุดที่มีที่เขี่ย เงียบหลังมืดเพราะเป็นถนนในย่านที่อยู่อาศัย และแยกขยะก่อนออก ร้านขายยาโมริอยู่ห่างหนึ่งนาที ซูเปอร์ชินเซ็นอิจิบะสามนาที ลอว์สันหกนาที') } },

        { type: 'step', time: '18:10', meridiem: 'Evening', kind: 'Transfer', icon: 'car',
          title: L('Drive to Yakiniku Gansou Honten', 'ขับไปยากินิคุ กันโซ สาขาใหญ่'),
          place: L('Tsurumi to Ishigaki-higashi - about 3 km, 8 min', 'จากสึรุมิไปอิชิงากิฮิงาชิ ระยะประมาณ 3 กิโลเมตร ใช้เวลาประมาณ 8 นาที'),
          blurb: L('Down from the Tsurumi slope and east to Ishigaki-higashi - short and easy, with a car park at the shop. The driver drinks nothing tonight, since the car has to bring everyone home.',
                   'ลงจากเนินสึรุมิแล้วไปทางตะวันออกถึงอิชิงากิฮิงาชิ ใกล้และขับง่าย ที่ร้านมีลานจอดของตัวเอง คืนนี้คนขับไม่ดื่ม เพราะรถต้องพาทุกคนกลับบ้าน'),
          refs: { map: 'https://maps.google.com/?q=%E7%84%BC%E8%82%89%E5%85%83%E7%9B%B8%20%E6%9C%AC%E5%BA%97%20%E5%A4%A7%E5%88%86%E7%9C%8C%E5%88%A5%E5%BA%9C%E5%B8%82%E7%9F%B3%E5%9E%A3%E6%9D%B110%E4%B8%81%E7%9B%AE5-28',
                  parking: L('About 50 spaces at the shop.', 'ลานจอดของร้านราว 50 ช่อง') } },

        { type: 'feature', time: '18:30', meridiem: 'Evening', kind: 'Dining', imageId: 'a-beppu-gansou',
          title: L('Yakiniku Gansou Honten', 'ยากินิคุ กันโซ สาขาใหญ่'),
          place: L('Ishigaki-higashi - Beppu\'s long-established yakiniku house', 'อิชิงากิฮิงาชิ ร้านเนื้อย่างเก่าแก่ของเบปปุ'),
          blurb: L('A long-established Beppu yakiniku house serving A5-grade domestic wagyu at fair prices, in a room of 39 seats that mixes counter, private rooms and sunken kotatsu tables. Order the seven-second sirloin, a cut sold nowhere else and named for how little time it needs on the grill, and the salted tsubo-kalbi, and put the pot of silver rice in at the very start - it is cooked to order and takes fifteen to twenty minutes. Beppu reimen, a firm cold noodle in a light dashi soup, is a long-loved way to finish.',
                   'ร้านเนื้อย่างเก่าแก่ของเบปปุ เสิร์ฟวากิวในประเทศเกรด A5 ในราคาเป็นธรรม ห้อง 39 ที่นั่งมีทั้งเคาน์เตอร์ ห้องส่วนตัว และโต๊ะโคทัตสึแบบขุดพื้น สั่งโรสเจ็ดวินาทีที่ขายเฉพาะร้านนี้และตั้งชื่อตามเวลาที่ใช้ย่างน้อยนิด กับสึโบะคาลบิรสเกลือ แล้วสั่งข้าวกินเมชิตั้งแต่นั่งลงเลย เพราะหุงตามออร์เดอร์ใช้เวลา 15 ถึง 20 นาที ปิดท้ายด้วยเรเมนเย็นแบบเบปปุ บะหมี่เส้นเหนียวในน้ำซุปดาชิรสอ่อน'),
          refs: { map: 'https://maps.google.com/?q=%E7%84%BC%E8%82%89%E5%85%83%E7%9B%B8%20%E6%9C%AC%E5%BA%97%20%E5%A4%A7%E5%88%86%E7%9C%8C%E5%88%A5%E5%BA%9C%E5%B8%82%E7%9F%B3%E5%9E%A3%E6%9D%B110%E4%B8%81%E7%9B%AE5-28', official: 'https://yakinikugansou.com/',
                  booking: L('About Y4,500 to 6,000 a head for dinner', 'มื้อค่ำราวคนละ 4,500 ถึง 6,000 เยน'),
                  parking: L('About 50 spaces at the shop.', 'ลานจอดของร้านราว 50 ช่อง'),
                  reservation: { time: '18:30', code: 'GANSOU-01', party: L('Dinner - to book, by phone', 'มื้อค่ำ ยังไม่ได้จอง โทรจอง') },
                  notes: L('Ishigaki-higashi 10-5-28, tel 0977-23-2980. Dinner is 17:30-22:00 with last orders at 21:30, and from 17:00 on Saturdays, Sundays and public holidays - which tonight is, Labour Thanksgiving. Closing days have been irregular since June 2024, so ring to book and to confirm the shop is open on the 23rd; the booking calendar on the official site shows it too. Around Y2,200 for the seven-second sirloin, Y1,700 for the salted tsubo-kalbi, from Y860 for the silver rice and Y940 for the reimen. All-you-can-drink is an extra Y2,000 on a course, but the driver stays dry.',
                           'ที่อยู่อิชิงากิฮิงาชิ 10-5-28 โทร 0977-23-2980 มื้อค่ำ 17:30 ถึง 22:00 รับออร์เดอร์สุดท้าย 21:30 และเปิด 17:00 ในวันเสาร์ อาทิตย์ และวันหยุดนักขัตฤกษ์ ซึ่งคืนนี้เข้าเกณฑ์เพราะเป็นวันขอบคุณแรงงาน ร้านหยุดไม่แน่นอนตั้งแต่มิถุนายน 2024 จึงควรโทรจองและยืนยันว่าวันที่ 23 เปิด ปฏิทินจองบนเว็บทางการก็ดูได้ โรสเจ็ดวินาทีราว 2,200 เยน สึโบะคาลบิรสเกลือราว 1,700 เยน ข้าวกินเมชิเริ่ม 860 เยน เรเมนราว 940 เยน เครื่องดื่มไม่อั้นเพิ่ม 2,000 เยนเมื่อสั่งคอร์ส แต่คนขับงดดื่ม') } },

        { type: 'step', time: '21:00', meridiem: 'Night', kind: 'Onsen', icon: 'bed',
          title: L('Your own hot spring on the deck', 'บ่อน้ำพุร้อนของเราเองบนระเบียง'),
          place: L('Back up the hill - the bath you filled earlier', 'กลับขึ้นเนิน บ่อที่เปิดน้ำใส่ไว้ตอนเย็น'),
          blurb: L('Eight minutes back up to Tsurumi and the bath is waiting: the indoor spring bath with the deck doors open and the cascade shower running, the river audible below. Beppu pumps more hot water than anywhere in Japan, and tonight it comes out of your own tap.',
                   'ขับกลับขึ้นสึรุมิแปดนาทีแล้วบ่อก็รออยู่ บ่อน้ำพุร้อนในร่มที่เปิดประตูระเบียงออก มีฝักบัวน้ำตกไหล และได้ยินเสียงลำน้ำอยู่ข้างล่าง เบปปุสูบน้ำร้อนขึ้นมามากที่สุดในญี่ปุ่น และคืนนี้มันไหลออกจากก๊อกของเราเอง'),
          refs: { notes: L('Add cold water first - the spring runs hotter than a normal bath - and turn the tap off when you are done. The projector is there for anyone who would rather watch a film. Sunrise tomorrow is 06:54; nothing is booked before Hita, so sleep. Buy tomorrow\'s breakfast at a konbini on the way home - the supermarket shuts at eight.',
                           'เติมน้ำเย็นก่อน เพราะน้ำพุร้อนร้อนกว่าน้ำอาบปกติ และปิดก๊อกเมื่อเสร็จ มีโปรเจกเตอร์ให้คนที่อยากดูหนังมากกว่า พรุ่งนี้พระอาทิตย์ขึ้น 06:54 และไม่มีอะไรต้องไปก่อนฮิตะ นอนได้เต็มที่ ซื้อมื้อเช้าพรุ่งนี้ที่ร้านสะดวกซื้อตอนขากลับ เพราะซูเปอร์ปิดสองทุ่ม') } },
      ],
    },

      note: L(
        'A slow start by this trip\'s standards: one more soak in the house\'s own spring, breakfast round the table, and check-out at ten. West on the Oita Expressway after that, with lunch in Hita, the old shogunate merchant town a little past halfway home, and one stop before the city: Nanzoin in Sasaguri, where a bronze Buddha forty-one metres long lies on the hillside. The car goes back at Hakata Station as the Christmas lights come on outside it, then the subway to the last house of the trip, five minutes from Ohori Park, then the market lights of Tenjin, a booked table at a Yakuin yakiniku, and a yatai on the way home.',

        { type: 'step', time: '09:45', meridiem: 'Morning', kind: 'Check-out', icon: 'luggage',
